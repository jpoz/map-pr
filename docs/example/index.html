<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1d1b'/%3E%3Cpath d='M9 10L22 9M9 10L16 23M22 9L16 23' stroke='%239a9a94' stroke-width='2'/%3E%3Ccircle cx='9' cy='10' r='4' fill='%238ea4ff'/%3E%3Ccircle cx='22' cy='9' r='4' fill='%234cc27e'/%3E%3Ccircle cx='16' cy='23' r='4.5' fill='%23f0a050'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark;
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
    --added: #1f8a4c; --added-bg: #e3f4ea; --modified: #b8620b; --modified-bg: #fcefdf;
    --caller: #3b5bdb; --caller-bg: #e8edfd; --pkg-bg: #efefeb; --code-bg: #fafaf8; --hl: #dde5fc;
    --note-bg: #f3f0ff; --note-line: #7c5cff; --removed: #c92a2a; --removed-bg: #fdecec;
    --grid: #d3d3cc; --hud: rgba(255, 255, 255, .86); --shadow: 0 6px 24px rgba(0, 0, 0, .10);
    --entry: #0b8a8a; --entry-bg: #dff3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --ink: #ececea; --muted: #9a9a94; --line: #34342f;
      --added: #4cc27e; --added-bg: #193323; --modified: #f0a050; --modified-bg: #3a2915;
      --caller: #8ea4ff; --caller-bg: #1e2647; --pkg-bg: #222220; --code-bg: #191918; --hl: #26335f;
      --note-bg: #26213d; --note-line: #a58cff; --removed: #ff8787; --removed-bg: #3d1d1d;
      --grid: #2e2e2a; --hud: rgba(30, 30, 28, .86); --shadow: 0 6px 24px rgba(0, 0, 0, .45);
      --entry: #3cc9c4; --entry-bg: #16302f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px;
    align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 a:hover { text-decoration: underline; }
  header .meta { color: var(--muted); font-size: 13px; }
  header code { font-size: 12px; }
  .legend { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .l-added::before { background: var(--added); }
  .legend .l-top { cursor: help; }
  .legend .l-top::before { content: "★"; width: auto; height: auto; color: var(--modified); font-size: 13px; vertical-align: 0; }
  .legend .l-modified::before { background: var(--modified); }
  .legend .l-caller::before { background: var(--caller); }
  .legend .l-entry::before { background: var(--entry); }
  .legend .l-via::before { background: var(--muted); }
  .legend .l-call { cursor: help; }
  .legend .l-call::before { background: var(--hl); border: 1px solid var(--line); }
  .legend .toggle { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--ink); }
  .legend .toggle input { margin: 0; }
  main { display: flex; flex: 1; min-height: 0; }
  #stage { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  #map { position: absolute; inset: 0; display: block; cursor: grab; touch-action: none; }
  #map.dragging { cursor: grabbing; }
   
  .hud { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 8px; user-select: none; }
  .hud .group { display: flex; background: var(--hud); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 3px; }
  .hud button { border: 0; background: transparent; border-radius: 7px; padding: 5px 11px; font-size: 12px;
    color: var(--muted); font-weight: 500; transition: background .2s, color .2s; }
  .hud button:hover { color: var(--ink); }
  .hud button.on { background: var(--ink); color: var(--panel); }
  .hud .zoom button { min-width: 30px; padding: 5px 8px; font-size: 14px; }
  .hud .zoom button[data-zoom=fit] { font-size: 12px; }
  #tip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--hud);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow); padding: 6px 10px; font-size: 12px; display: flex;
    flex-direction: column; max-width: 360px; }
  #tip[hidden] { display: none; }
  #tip b { font: 600 12px ui-monospace, Menlo, monospace; word-break: break-all; }
  #tip span { color: var(--muted); font-size: 11px; }
  #ports { position: absolute; left: 0; top: 0; z-index: 5; background: var(--hud);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow); padding: 6px 0; font-size: 12px;
    max-width: 420px; max-height: 50%; overflow: auto; }
  #ports[hidden] { display: none; }
  #ports .head { padding: 2px 12px 6px; color: var(--muted); font-size: 11px; }
  #ports .head b { color: var(--ink); font: 600 11px ui-monospace, Menlo, monospace; }
  #ports ul { list-style: none; margin: 0; padding: 0; }
  #ports li { display: flex; flex-direction: column; gap: 1px; padding: 5px 12px; cursor: pointer; }
  #ports li:hover { background: var(--caller-bg); }
  #ports .loc { color: var(--muted); font: 11px ui-monospace, Menlo, monospace; }
  .kind { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  button.mini { font-size: 11px; padding: 1px 8px; margin-left: 8px; text-transform: none; letter-spacing: 0; vertical-align: 1px; }
  aside { width: min(600px, 42vw); min-width: 320px; background: var(--panel);
    overflow: auto; padding: 16px; }
  #split, #chat-split { width: 6px; flex: none; cursor: col-resize; background: var(--line); }
  #split:hover, #split.dragging, #chat-split:hover, #chat-split.dragging { background: var(--muted); }
  #chat[hidden] + #chat-split { display: none; }
  aside h2 { font-size: 15px; margin: 0 0 4px; word-break: break-word; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    margin: 18px 0 6px; }
  aside p { margin: 6px 0; }
  .prose code, .note code { font: 12px ui-monospace, Menlo, monospace; background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 600; }
  .badge.added { color: var(--added); background: var(--added-bg); }
  .badge.modified { color: var(--modified); background: var(--modified-bg); }
  .badge.caller { color: var(--caller); background: var(--caller-bg); }
  .badge.exported { color: var(--muted); border: 1px solid var(--line); }
  .badge.entry { color: var(--entry); background: var(--entry-bg); }
  .badge.via { color: var(--muted); background: var(--pkg-bg); }
  .top { color: var(--modified); }
  .entry-pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px;
    border-radius: 8px; color: var(--panel); background: var(--entry); vertical-align: 1px; text-transform: uppercase; }
  .entry-pill.root { background: var(--muted); }
  li.group > div[data-id] { cursor: pointer; }
  li.group > div[data-id]:hover > .name { color: var(--caller); }
  li.group details { margin: 4px 0 0 12px; font-size: 12px; }
  li.group details summary { color: var(--muted); cursor: pointer; }
  li.group details ul.links li:last-child { border-bottom: 0; }
   
  pre .ref { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-color: var(--muted); }
  pre .ref:hover { text-decoration: underline solid; text-decoration-color: var(--caller); background: var(--caller-bg); border-radius: 2px; }
  .badge.unchanged { color: var(--muted); border: 1px solid var(--line); }
  .path { color: var(--muted); font: 12px ui-monospace, Menlo, monospace; word-break: break-all; }
  .loc { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; word-break: break-all; }
  .note { background: var(--note-bg); border-left: 3px solid var(--note-line); border-radius: 4px;
    padding: 8px 10px; margin: 10px 0; }
  .note.small { margin: 4px 0 0; padding: 4px 8px; font-size: 13px; }
  pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; margin: 0;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: auto; padding: 6px 0; tab-size: 4; }
   
  .src-path { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
    background: var(--code-bg); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 6px 6px 0 0; padding: 5px 10px; user-select: all; }
  .src-path + pre { border-top-left-radius: 0; border-top-right-radius: 0; }
   
  .src-path { position: sticky; top: 0; z-index: 1; user-select: text; }
  .src-path b { color: var(--ink); font-weight: 600; }
  pre .ln.folded { display: none; }
  pre .ln.fold { cursor: pointer; color: var(--muted); background: var(--pkg-bg); padding: 2px 10px; font-style: italic; }
  pre .ln.fold:hover { color: var(--caller); background: var(--caller-bg); }
  pre .ln { display: block; padding: 0 10px; white-space: pre; }
  pre .ln.chg { background: var(--added-bg); box-shadow: inset 3px 0 var(--added); }
  pre.src .ln.del { background: var(--removed-bg); box-shadow: inset 3px 0 var(--removed); }
  pre.src .ln.del .gone { color: var(--removed); }
   
  pre .ln.hl { background: var(--hl); }
   
  @media (prefers-color-scheme: dark) { pre.src .code span { color: var(--shiki-dark) !important; } }
  pre .no, pre .gone { color: var(--muted); display: inline-block; width: 3.5em; user-select: none; }
  ul.links { list-style: none; padding: 0; margin: 0; }
  ul.links li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  ul.links li[data-id], ul.links li[data-theme] { cursor: pointer; }
  ul.links li[data-id]:hover > .name, ul.links li[data-theme]:hover .title { color: var(--caller); }
  .empty { color: var(--muted); }
  .file { border-bottom: 1px solid var(--line); padding: 5px 0; }
  .file-name { font: 12px ui-monospace, Menlo, monospace; word-break: break-all; }
  details.file > summary { cursor: pointer; }
  details.file > summary:hover { color: var(--caller); }
  details.file pre { margin-top: 6px; }
  .add-count { color: var(--added); }
  .del-count { color: var(--removed); }
  .badge.deleted { color: var(--removed); background: var(--removed-bg); }
  pre.diff .ln.add { background: var(--added-bg); }
  pre.diff .ln.del { background: var(--removed-bg); }
  pre.diff .ln.hunk { color: var(--muted); }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .themes .title { font-weight: 600; }
  .themes .sum { color: var(--muted); font-size: 13px; margin-top: 2px; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--note-line); border-color: var(--note-line); color: #fff; }
  .path-nav { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
  .path-nav .count { color: var(--muted); font-size: 12px; margin-right: auto; }
   
  .path-chip { display: inline-block; min-width: 18px; height: 18px; border-radius: 9px; color: #fff; font-size: 11px; font-weight: 700;
    text-align: center; line-height: 18px; padding: 0 4px; vertical-align: 1px; }
  ul.links li[data-path] { cursor: pointer; }
  ul.links li[data-path]:hover .name { color: var(--caller); }
  ol.stations { list-style: none; padding: 0; margin: 0 0 6px; position: relative; }
  ol.stations::before { content: ""; position: absolute; left: 9px; top: 14px; bottom: 14px; width: 4px; border-radius: 2px; background: var(--path); }
  ol.stations li { position: relative; padding: 6px 6px 6px 30px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  ol.stations li::before { content: ""; position: absolute; left: 5px; top: 10px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--path); }
  ol.stations li.interchange::before { left: 3px; top: 8px; width: 12px; height: 12px; border: 2.5px solid var(--ink); }
  ol.stations li.cur { border-color: var(--path); background: var(--code-bg); }
  ol.stations li:hover .name { color: var(--caller); }
  ol.stations .call { font-size: 12px; color: var(--muted); margin-top: 2px; }
  ol.stations .also { font-size: 11px; color: var(--muted); margin-top: 3px; }
  ol.stations .also [data-path] { cursor: pointer; }
  a.file-link { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
  a.file-link:hover { color: var(--caller); text-decoration-color: currentColor; }
  .back { color: var(--muted); font-size: 12px; cursor: pointer; margin-bottom: 8px; display: inline-block; }
  .back:hover { color: var(--ink); }
   
  .hud .group:has(> [hidden]:only-child) { display: none; }
  #stage.commenting::after { content: "Click anywhere on the map to attach it to your message · Esc to cancel"; position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%); background: var(--note-line); color: #fff; font-size: 12px;
    padding: 5px 12px; border-radius: 14px; box-shadow: var(--shadow); pointer-events: none; }
   
  #chat { width: 340px; flex: none; display: flex; flex-direction: column; background: var(--panel); min-height: 0; }
  #chat[hidden], #toast[hidden] { display: none; }
  #chat .head { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  #chat .head b { font-size: 14px; }
  #chat .head span { color: var(--muted); font-size: 11px; flex: 1; }
  #chat .head button { border: 0; background: transparent; color: var(--muted); font-size: 16px; padding: 0 4px; cursor: pointer; }
  #chat .head button:hover { color: var(--ink); }
  #chat-log { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  #chat-log .msg { scroll-margin: 12px; flex: none; }
  #chat-log .msg.you { align-self: flex-end; max-width: 92%; background: var(--code-bg); }
  #chat-log .msg.you:has(.att) { width: 92%; }
  #chat-log .msg.fresh { box-shadow: 0 0 0 2px var(--note-line); }
  #chat-log .msg.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--entry); } 100% { box-shadow: 0 0 0 0 transparent; } }
  #chat-log .quote { color: var(--muted); font-size: 11px; margin: 2px 0 4px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chat-log .quote:hover { color: var(--ink); }
  #chat-log .waiting { font-size: 11px; margin-top: 4px; }
  #chat .compose { border-top: 1px solid var(--line); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  #chat-attach { display: flex; align-items: center; gap: 4px; }
  #chat-attach[hidden] { display: none; }
  #chat-attach .att { flex: 1; margin: 0; }
  #chat-attach .x { border: 0; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0 4px; }
  #chat-attach .x:hover { color: var(--ink); }
  #chat-input { width: 100%; resize: none; font: inherit; font-size: 13px; }
  #chat .compose .hint { display: flex; justify-content: space-between; }
  #chat .error { color: var(--removed); font-size: 12px; margin: 0; }
  #chat .error[hidden] { display: none; }
  .att { display: flex; flex-direction: column; gap: 1px; margin: 4px 0; padding: 4px 8px; border-radius: 6px; cursor: pointer;
    background: var(--note-bg); border-left: 3px solid var(--note-line); font-size: 11px; min-width: 0; }
  .att:hover { filter: brightness(1.08); }
  .att .where { font-weight: 600; color: var(--note-line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att code { font: 11px ui-monospace, Menlo, monospace; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chat-btn .badge { background: var(--note-line); color: #fff; border-radius: 9px; font-size: 10px; font-weight: 700;
    padding: 1px 6px; margin-left: 6px; }
  #chat-btn .badge[hidden] { display: none; }
  #toast { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); max-width: min(520px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--note-line); border-radius: 8px;
    box-shadow: var(--shadow); padding: 8px 12px; font-size: 13px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  #toast b { white-space: nowrap; }
  #toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #toast:hover { border-color: var(--note-line); }
  .anchor { margin: 4px 0 8px; }
  .anchor [data-goto] { cursor: pointer; font-weight: 600; }
  .anchor [data-goto]:hover { color: var(--caller); }
  pre.excerpt { margin-bottom: 12px; }
  pre.src.askable .no { cursor: pointer; }
  pre.src.askable .no:hover { color: var(--note-line); text-decoration: underline; }
  .hint { color: var(--muted); font-family: ui-sans-serif, -apple-system, sans-serif; font-size: 11px; user-select: none; }
  .thread { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 12px; }
  .msg { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .msg.claude { background: var(--note-bg); border-color: transparent; border-left: 3px solid var(--note-line); }
  .msg .who { font-size: 12px; font-weight: 600; }
  .msg .who span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .msg .prose p:first-child { margin-top: 2px; }
  .waiting { color: var(--muted); font-size: 12px; font-style: italic; }
  .error { color: var(--removed); font-size: 12px; }
  textarea { width: 100%; font: inherit; color: var(--ink); background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--note-line); outline-offset: -1px; border-color: transparent; }
  .state { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px;
    border-radius: 8px; vertical-align: 1px; }
  .state.open { color: #fff; background: var(--note-line); }
  .state.answered { color: var(--caller); background: var(--caller-bg); }
  .state.resolved { color: var(--muted); border: 1px solid var(--line); }
  ul.links li[data-thread] { cursor: pointer; }
  ul.links li[data-thread]:hover { color: var(--caller); }
  @media (max-width: 760px) {
    body { display: block; height: auto; }
    main { flex-direction: column; }
    #stage { height: 60vh; flex: none; }
    aside { width: auto !important; min-width: 0; border-top: 1px solid var(--line); }
    #split { display: none; }
    .legend { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">PR Map</h1>
  <div class="meta" id="meta"></div>
  <div class="legend">
    <span class="l-added">added</span><span class="l-modified">modified</span><span class="l-caller" title="Code this PR does not change that calls code it changes.">calls changed code</span><span class="l-entry" title="Where execution starts: main, an HTTP handler, a goroutine, or code with no callers.">entry point</span><span class="l-via" title="Code the PR does not change that a code path passes through on its way from an entry point to the changes.">on a path</span><span class="l-call" title="A line, not changed itself, that calls code this PR changes.">line calls changed code</span><span class="l-top" title="A changed function that no other changed function calls, directly or through other code. Start reviewing here. A package shows how many it holds.">review first</span>
    <label class="toggle"><input type="checkbox" id="show-tests"> show tests</label>
  </div>
</header>
<main>
  <section id="chat" hidden>
    <div class="head"><b>Claude</b><span>answers from the session that serves this map</span><button id="chat-close" title="Hide the chat">×</button></div>
    <div id="chat-log"></div>
    <div class="compose">
      <div id="chat-attach" hidden></div>
      <textarea id="chat-input" rows="3" placeholder="Ask about this PR. Click a line number to attach it."></textarea>
      <div class="hint"><span>Enter to send · Shift+Enter for a new line</span><span>/ to focus</span></div>
      <p class="error" hidden></p>
    </div>
  </section>
  <div id="chat-split" title="Drag to resize"></div>
  <div id="stage">
    <canvas id="map"></canvas>
    <div class="hud">
      <div class="group levels">
        <button data-level="packages">Packages</button><button data-level="decls">Functions &amp; types</button><button data-level="code">Code</button>
      </div>
      <div class="group zoom">
        <button data-zoom="out" title="Zoom out (−)">−</button><button data-zoom="fit" title="Fit (0)">Fit</button><button data-zoom="in" title="Zoom in (+)">+</button>

tline, err := scanner.Readline()\n\t\tswitch {\n\t\tcase errors.Is(err, io.EOF):\n\t\t\tfmt.Println()\n\t\t\treturn nil\n\t\tcase errors.Is(err, readline.ErrInterrupt):\n\t\t\tif line == \"\" {\n\t\t\t\tfmt.Println(\"\\nUse Ctrl + d or /bye to exit.\")\n\t\t\t}\n\n\t\t\tscanner.Prompt.UseAlt = false\n\t\t\tsb.Reset()\n\n\t\t\tcontinue\n\t\tcase errors.Is(err, readline.ErrEditPrompt):\n\t\t\tsb.Reset()\n\t\t\tcontent, err := editInExternalEditor(line)\n\t\t\tif err != nil {\n\t\t\t\tfmt.Fprintf(os.Stderr, \"error: %v\\n\", err)\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif strings.TrimSpace(content) == \"\" {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tscanner.Prefill = content\n\t\t\tcontinue\n\t\tcase err != nil:\n\t\t\treturn err\n\t\t}\n\n\t\tswitch {\n\t\tcase multiline != MultilineNone:\n\t\t\t// check if there's a multiline terminating string\n\t\t\tbefore, ok := strings.CutSuffix(line, `\"\"\"`)\n\t\t\tsb.WriteString(before)\n\t\t\tif !ok {\n\t\t\t\tfmt.Fprintln(\u0026sb)\n\t\t\t\tscanner.Prompt.UseAlt = true\n\t\t\t\tcontinue\n\t\t\t}\n\n\t\t\tswitch multiline {\n\t\t\tcase MultilineSystem:\n\t\t\t\topts.System = sb.String()\n\t\t\t\topts.Messages = append(opts.Messages, api.Message{Role: \"system\", Content: opts.System})\n\t\t\t\tfmt.Println(\"Set system message.\")\n\t\t\t\tsb.Reset()\n\t\t\t}\n\n\t\t\tmultiline = MultilineNone\n\t\t\tscanner.Prompt.UseAlt = false\n\t\tcase strings.HasPrefix(line, `\"\"\"`):\n\t\t\tline := strings.TrimPrefix(line, `\"\"\"`)\n\t\t\tline, ok := strings.CutSuffix(line, `\"\"\"`)\n\t\t\tsb.WriteString(line)\n\t\t\tif !ok {\n\t\t\t\t// no multiline terminating string; need more input\n\t\t\t\tfmt.Fprintln(\u0026sb)\n\t\t\t\tmultiline = MultilinePrompt\n\t\t\t\tscanner.Prompt.UseAlt = true\n\t\t\t}\n\t\tcase scanner.Pasting:\n\t\t\tfmt.Fprintln(\u0026sb, line)\n\t\t\tcontinue\n\t\tcase strings.HasPrefix(line, \"/list\"):\n\t\t\targs := strings.Fields(line)\n\t\t\tif err := ListHandler(cmd, args[1:]); err != nil {\n\t\t\t\treturn err\n\t\t\t}\n\t\tcase strings.HasPrefix(line, \"/load\"):\n\t\t\targs := strings.Fields(line)\n\t\t\tif len(args) != 2 {\n\t\t\t\tfmt.Println(\"Usage:\\n  /load \u003cmodelname\u003e\")\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\torigOpts := opts.Copy()\n\n\t\t\tclient, err := api.ClientFromEnvironment()\n\t\t\tif err != nil {\n\t\t\t\tfmt.Println(\"error: couldn't connect to ollama server\")\n\t\t\t\treturn err\n\t\t\t}\n\n\t\t\topts.Model = args[1]\n\t\t\topts.Messages = []api.Message{}\n\t\t\topts.LoadedMessages = nil\n\t\t\tfmt.Printf(\"Loading model '%s'\\n\", opts.Model)\n\t\t\tinfo, err := client.Show(cmd.Context(), \u0026api.ShowRequest{Model: opts.Model, Runner: opts.Runner})\n\t\t\tif err != nil {\n\t\t\t\tif strings.Contains(err.Error(), \"not found\") {\n\t\t\t\t\tfmt.Printf(\"Couldn't find model '%s'\\n\", opts.Model)\n\t\t\t\t\topts = origOpts.Copy()\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\treturn err\n\t\t\t}\n\t\t\tapplyShowResponseToRunOptions(\u0026opts, info)\n\t\t\topts.Decision = slices.Contains(info.Capabilities, model.CapabilityDecision)\n\t\t\tdecisionState = nil\n\t\t\tif opts.Decision {\n\t\t\t\t// Decision models can't generate; the first answer loads the model.\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\topts.Think, err = inferThinkingOption(\u0026info.Capabilities, \u0026opts, thinkExplicitlySet)\n\t\t\tif err != nil {\n\t\t\t\treturn err\n\t\t\t}\n\t\t\tif err := loadOrUnloadModel(cmd, \u0026opts); err != nil {\n\t\t\t\tif strings.Contains(err.Error(), \"not found\") {\n\t\t\t\t\tfmt.Printf(\"Couldn't find model '%s'\\n\", opts.Model)\n\t\t\t\t\topts = origOpts.Copy()\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\tif strings.Contains(err.Error(), \"does not support thinking\") {\n\t\t\t\t\tfmt.Printf(\"error: %v\\n\", err)\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\treturn err\n\t\t\t}\n\t\t\tcontinue\n\t\tcase strings.HasPrefix(line, \"/save\"):\n\t\t\targs := strings.Fields(line)\n\t\t\tif len(args) != 2 {\n\t\t\t\tfmt.Println(\"Usage:\\n  /save \u003cmodelname\u003e\")\n\t\t\t\tcontinue\n\t\t\t}\n\n\t\t\tclient, err := api.ClientFromEnvironment()\n\t\t\tif err != nil {\n\t\t\t\tfmt.Println(\"error: couldn't connect to ollama server\")\n\t\t\t\treturn err\n\t\t\t}\n\n\t\t\treq := NewCreateRequest(args[1], opts)\n\t\t\tfn := func(resp api.ProgressResponse) error { return nil }\n\t\t\terr = client.Create(cmd.Context(), req, fn)\n\t\t\tif err != nil {\n\t\t\t\tif strings.Contains(err.Error(), errtypes.InvalidModelNameErrMsg) {\n\t\t\t\t\tfmt.Printf(\"error: The model name '%s' is invalid\\n\", args[1])\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\treturn err\n\t\t\t}\n\t\t\tfmt.Printf(\"Created new model '%s'\\n\", args[1])\n\t\t\tcontinue\n\t\tcase strings.HasPrefix(line, \"/clear\"):\n\t\t\tdecisionState = nil\n\t\t\topts.Messages = []api.Message{}\n\t\t\tif opts.System != \"\" {\n\t\t\t\tnewMessage := api.Message{Role: \"system\", Content: opts.System}\n\t\t\t\topts.Messages = append(opts.Messages, newMessage)\n\t\t\t}\n\t\t\tfmt.Println(\"Cleared session context\")\n\t\t\tcontinue\n\t\tcase strings.HasPrefix(line, \"/set\"):\n\t\t\targs := strings.Fields(line)\n\t\t\tif len(args) \u003e 1 {\n\t\t\t\tswitch args[1] {\n\t\t\t\tcase \"history\":\n\t\t\t\t\tscanner.HistoryEnable()\n\t\t\t\tcase \"nohistory\":\n\t\t\t\t\tscanner.HistoryDisable()\n\t\t\t\tcase \"wordwrap\":\n\t\t\t\t\topts.WordWrap = true\n\t\t\t\t\tfmt.Println(\"Set 'wordwrap' mode.\")\n\t\t\t\tcase \"nowordwrap\":\n\t\t\t\t\topts.WordWrap = false\n\t\t\t\t\tfmt.Println(\"Set 'nowordwrap' mode.\")\n\t\t\t\tcase \"verbose\":\n\t\t\t\t\tif err := cmd.Flags().Set(\"verbose\", \"true\"); err != nil {\n\t\t\t\t\t\treturn err\n\t\t\t\t\t}\n\t\t\t\t\tfmt.Println(\"Set 'verbose' mode.\")\n\t\t\t\tcase \"quiet\":\n\t\t\t\t\tif err := cmd.Flags().Set(\"verbose\", \"false\"); err != nil {\n\t\t\t\t\t\treturn err\n\t\t\t\t\t}\n\t\t\t\t\tfmt.Println(\"Set 'quiet' mode.\")\n\t\t\t\tcase \"think\":\n\t\t\t\t\tthinkValue := api.ThinkValue{Value: true}\n\t\t\t\t\tvar maybeLevel string\n\t\t\t\t\tif len(args) \u003e 2 {\n\t\t\t\t\t\tmaybeLevel = args[2]\n\t\t\t\t\t}\n\t\t\t\t\tif maybeLevel != \"\" {\n\t\t\t\t\t\t// TODO(drifkin): validate the level, could be model dependent\n\t\t\t\t\t\t// though... It will also be validated on the server once a call is\n\t\t\t\t\t\t// made.\n\t\t\t\t\t\tthinkValue.Value = maybeLevel\n\t\t\t\t\t}\n\t\t\t\t\topts.Think = \u0026thinkValue\n\t\t\t\t\tthinkExplicitlySet = true\n\t\t\t\t\tif client, err := api.ClientFromEnvironment(); err == nil {\n\t\t\t\t\t\tensureThinkingSupport(cmd.Context(), client, opts.Model, opts.Runner)\n\t\t\t\t\t}\n\t\t\t\t\tif maybeLevel != \"\" {\n\t\t\t\t\t\tfmt.Printf(\"Set 'think' mode to '%s'.\\n\", maybeLevel)\n\t\t\t\t\t} else {\n\t\t\t\t\t\tfmt.Println(\"Set 'think' mode.\")\n\t\t\t\t\t}\n\t\t\t\tcase \"nothink\":\n\t\t\t\t\topts.Think = \u0026api.ThinkValue{Value: false}\n\t\t\t\t\tthinkExplicitlySet = true\n\t\t\t\t\tif client, err := api.ClientFromEnvironment(); err == nil {\n\t\t\t\t\t\tensureThinkingSupport(cmd.Context(), client, opts.Model, opts.Runner)\n\t\t\t\t\t}\n\t\t\t\t\tfmt.Println(\"Set 'nothink' mode.\")\n\t\t\t\tcase \"format\":\n\t\t\t\t\tif len(args) \u003c 3 || args[2] != \"json\" {\n\t\t\t\t\t\tfmt.Println(\"Invalid or missing format. For 'json' mode use '/set format json'\")\n\t\t\t\t\t} else {\n\t\t\t\t\t\topts.Format = args[2]\n\t\t\t\t\t\tfmt.Printf(\"Set format to '%s' mode.\\n\", args[2])\n\t\t\t\t\t}\n\t\t\t\tcase \"noformat\":\n\t\t\t\t\topts.Format = \"\"\n\t\t\t\t\tfmt.Println(\"Disabled format.\")\n\t\t\t\tcase \"parameter\":\n\t\t\t\t\tif len(args) \u003c 4 {\n\t\t\t\t\t\tusageParameters()\n\t\t\t\t\t\tcontinue\n\t\t\t\t\t}\n\t\t\t\t\tparams := args[3:]\n\t\t\t\t\tfp, err := api.FormatParams(map[string][]string{args[2]: params})\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\tfmt.Printf(\"Couldn't set parameter: %q\\n\", err)\n\t\t\t\t\t\tcontinue\n\t\t\t\t\t}\n\t\t\t\t\tfmt.Printf(\"Set parameter '%s' to '%s'\\n\", args[2], strings.Join(params, \", \"))\n\t\t\t\t\topts.Opti := range params {\n\t\tif opt, ok := jsonOpts[key]; !ok {\n\t\t\treturn nil, fmt.Errorf(\"unknown parameter '%s'\", key)\n\t\t} else {\n\t\t\tfield := valueOpts.FieldByName(opt.Name)\n\t\t\tif field.IsValid() \u0026\u0026 field.CanSet() {\n\t\t\t\tswitch field.Kind() {\n\t\t\t\tcase reflect.Float32:\n\t\t\t\t\tfloatVal, err := strconv.ParseFloat(vals[0], 32)\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\treturn nil, fmt.Errorf(\"invalid float value %s\", vals)\n\t\t\t\t\t}\n\n\t\t\t\t\tout[key] = float32(floatVal)\n\t\t\t\tcase reflect.Int:\n\t\t\t\t\tintVal, err := strconv.ParseInt(vals[0], 10, 64)\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\treturn nil, fmt.Errorf(\"invalid int value %s\", vals)\n\t\t\t\t\t}\n\n\t\t\t\t\tout[key] = intVal\n\t\t\t\tcase reflect.Bool:\n\t\t\t\t\tboolVal, err := strconv.ParseBool(vals[0])\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\treturn nil, fmt.Errorf(\"invalid bool value %s\", vals)\n\t\t\t\t\t}\n\n\t\t\t\t\tout[key] = boolVal\n\t\t\t\tcase reflect.String:\n\t\t\t\t\tout[key] = vals[0]\n\t\t\t\tcase reflect.Slice:\n\t\t\t\t\t// TODO: only string slices are supported right now\n\t\t\t\t\tout[key] = vals\n\t\t\t\tcase reflect.Pointer:\n\t\t\t\t\tswitch field.Type().Elem().Kind() {\n\t\t\t\t\tcase reflect.Bool:\n\t\t\t\t\t\tboolVal, err := strconv.ParseBool(vals[0])\n\t\t\t\t\t\tif err != nil {\n\t\t\t\t\t\t\treturn nil, fmt.Errorf(\"invalid bool value %s\", vals)\n\t\t\t\t\t\t}\n\t\t\t\t\t\tout[key] = \u0026boolVal\n\t\t\t\t\tcase reflect.Int:\n\t\t\t\t\t\tintVal, err := strconv.ParseInt(vals[0], 10, 64)\n\t\t\t\t\t\tif err != nil {\n\t\t\t\t\t\t\treturn nil, fmt.Errorf(\"invalid int value %s\", vals)\n\t\t\t\t\t\t}\n\t\t\t\t\t\tout[key] = intVal\n\t\t\t\t\tdefault:\n\t\t\t\t\t\treturn nil, fmt.Errorf(\"unknown type %s for %s\", field.Kind(), key)\n\t\t\t\t\t}\n\t\t\t\tdefault:\n\t\t\t\t\treturn nil, fmt.Errorf(\"unknown type %s for %s\", field.Kind(), key)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\n\treturn out, nil\n}"},{"id":"api/types.go:136:6","name":"ChatRequest","kind":"type","file":"api/types.go","line":136,"endLine":185,"source":"type ChatRequest struct {\n\t// Model is the model name, as in [GenerateRequest].\n\tModel string `json:\"model\"`\n\n\t// Runner selects a runner variant from a manifest list.\n\tRunner string `json:\"runner,omitempty\"`\n\n\t// Messages is the messages of the chat - can be used to keep a chat memory.\n\tMessages []Message `json:\"messages\"`\n\n\t// Stream enables streaming of returned responses; true by default.\n\tStream *bool `json:\"stream,omitempty\"`\n\n\t// Format is the format to return the response in (e.g. \"json\").\n\tFormat json.RawMessage `json:\"format,omitempty\"`\n\n\t// KeepAlive controls how long the model will stay loaded into memory\n\t// following the request.\n\tKeepAlive *Duration `json:\"keep_alive,omitempty\"`\n\n\t// Tools is an optional list of tools the model has access to.\n\tTools `json:\"tools,omitempty\"`\n\n\t// Options lists model-specific options.\n\tOptions map[string]any `json:\"options\"`\n\n\t// Think controls whether thinking/reasoning models will think before\n\t// responding. Can be a boolean (true/false) or a model-defined thinking level.\n\tThink *ThinkValue `json:\"think,omitempty\"`\n\n\t// Truncate is a boolean that, when set to true, truncates the chat history messages\n\t// if the rendered prompt exceeds the context length limit.\n\tTruncate *bool `json:\"truncate,omitempty\"`\n\n\t// Shift is a boolean that, when set to true, shifts the chat history\n\t// when hitting the context length limit instead of erroring.\n\tShift *bool `json:\"shift,omitempty\"`\n\n\t// DebugRenderOnly is a debug option that, when set to true, returns the rendered\n\t// template instead of calling the model.\n\tDebugRenderOnly bool `json:\"_debug_render_only,omitempty\"`\n\n\t// Logprobs specifies whether to return log probabilities of the output tokens.\n\tLogprobs bool `json:\"logprobs,omitempty\"`\n\n\t// TopLogprobs is the number of most likely tokens to return at each token position,\n\t// each with an associated log probability. Only applies when Logprobs is true.\n\t// Valid values are 0-20. Default is 0 (only return the selected token's logprob).\n\tTopLogprobs int `json:\"top_logprobs,omitempty\"`\n}"},{"id":"api/types.go:202:6","name":"Message","kind":"type","file":"api/types.go","line":202,"endLine":212,"source":"type Message struct {\n\tRole    string `json:\"role\"`\n\tContent string `json:\"content\"`\n\t// Thinking contains the text that was inside thinking tags in the\n\t// original model output when ChatRequest.Think is enabled.\n\tThinking   string      `json:\"thinking,omitempty\"`\n\tImages     []ImageData `json:\"images,omitempty\"`\n\tToolCalls  []ToolCall  `json:\"tool_calls,omitempty\"`\n\tToolName   string      `json:\"tool_name,omitempty\"`\n\tToolCallID string      `json:\"tool_call_id,omitempty\"`\n}"},{"id":"api/types.go:23:6","name":"StatusError","kind":"type","file":"api/types.go","line":23,"endLine":27,"source":"type StatusError struct {\n\tStatusCode   int\n\tStatus       string\n\tErrorMessage string `json:\"error\"`\n}"},{"id":"api/types.go:574:6","name":"Options","kind":"type","file":"api/types.go","line":574,"endLine":591,"source":"type Options struct {\n\tRunner\n\n\t// Predict options used at runtime\n\tNumKeep          int      `json:\"num_keep,omitempty\"`\n\tSeed             int      `json:\"seed,omitempty\"`\n\tNumPredict       int      `json:\"num_predict,omitempty\"`\n\tTopK             int      `json:\"top_k,omitempty\"`\n\tTopP             float32  `json:\"top_p,omitempty\"`\n\tMinP             float32  `json:\"min_p,omitempty\"`\n\tTypicalP         float32  `json:\"typical_p,omitempty\"` // Deprecated: rejected as a model parameter; still accepted per request with a warning\n\tRepeatLastN      int      `json:\"repeat_last_n,omitempty\"`\n\tTemperature      float32  `json:\"temperature,omitempty\"`\n\tRepeatPenalty    float32  `json:\"repeat_penalty,omitempty\"`\n\tPresencePenalty  float32  `json:\"presence_penalty,omitempty\"`\n\tFrequencyPenalty float32  `json:\"frequency_penalty,omitempty\"`\n\tStop             []string `json:\"stop,omitempty\"`\n}"},{"id":"api/types.go:62:6","name":"GenerateRequest","kind":"type","file":"api/types.go","line":62,"endLine":133,"source":"type GenerateRequest struct {\n\t// Model is the model name; it should be a name familiar to Ollama from\n\t// the library at https://ollama.com/library\n\tModel string `json:\"model\"`\n\n\t// Runner selects a runner variant from a manifest list.\n\tRunner string `json:\"runner,omitempty\"`\n\n\t// Prompt is the textual prompt to send to the model.\n\tPrompt string `json:\"prompt\"`\n\n\t// Suffix is the text that comes after the inserted text.\n\tSuffix string `json:\"suffix\"`\n\n\t// System overrides the model's default system message/prompt.\n\tSystem string `json:\"system\"`\n\n\t// Template overrides the model's default prompt template.\n\tTemplate string `json:\"template\"`\n\n\t// Context is the context parameter returned from a previous call to\n\t// [Client.Generate]. It can be used to keep a short conversational memory.\n\tContext []int `json:\"context,omitempty\"`\n\n\t// Stream specifies whether the response is streaming; it is true by default.\n\tStream *bool `json:\"stream,omitempty\"`\n\n\t// Raw set to true means that no formatting will be applied to the prompt.\n\tRaw bool `json:\"raw,omitempty\"`\n\n\t// Format specifies the format to return a response in.\n\tFormat json.RawMessage `json:\"format,omitempty\"`\n\n\t// KeepAlive controls how long the model will stay loaded in memory following\n\t// this request.\n\tKeepAlive *Duration `json:\"keep_alive,omitempty\"`\n\n\t// Images is an optional list of raw image bytes accompanying this\n\t// request, for multimodal models.\n\tImages []ImageData `json:\"images,omitempty\"`\n\n\t// Options lists model-specific options. For example, temperature can be\n\t// set through this field, if the model supports it.\n\tOptions map[string]any `json:\"options\"`\n\n\t// Think controls whether thinking/reasoning models will think before\n\t// responding. Can be a boolean (true/false) or a model-defined thinking level.\n\t// Needs to be a pointer so we can distinguish between false (request that\n\t// thinking _not_ be used) and unset (use the old behavior\n\t// before this option was introduced)\n\tThink *ThinkValue `json:\"think,omitempty\"`\n\n\t// Truncate is a boolean that, when set to true, truncates the chat history messages\n\t// if the rendered prompt exceeds the context length limit.\n\tTruncate *bool `json:\"truncate,omitempty\"`\n\n\t// Shift is a boolean that, when set to true, shifts the chat history\n\t// when hitting the context length limit instead of erroring.\n\tShift *bool `json:\"shift,omitempty\"`\n\n\t// DebugRenderOnly is a debug option that, when set to true, returns the rendered\n\t// template instead of calling the model.\n\tDebugRenderOnly bool `json:\"_debug_render_only,omitempty\"`\n\n\t// Logprobs specifies whether to return log probabilities of the output tokens.\n\tLogprobs bool `json:\"logprobs,omitempty\"`\n\n\t// TopLogprobs is the number of most likely tokens to return at each token position,\n\t// each with an associated log probability. Only applies when Logprobs is true.\n\t// Valid values are 0-20. Default is 0 (only return the selected token's logprob).\n\tTopLogprobs int `json:\"top_logprobs,omitempty\"`\n}"},{"id":"api/types.go:711:6","name":"CreateRequest","kind":"type","file":"api/types.go","line":711,"endLine":778,"source":"type CreateRequest struct {\n\t// Model is the model name to create.\n\tModel string `json:\"model\"`\n\n\t// Stream specifies whether the response is streaming; it is true by default.\n\tStream *bool `json:\"stream,omitempty\"`\n\n\t// Quantize is the quantization format to apply when importing safetensors weights.\n\tQuantize string `json:\"quantize,omitempty\"`\n\n\t// DraftQuantize is the quantization format to apply when importing safetensors draft weights.\n\tDraftQuantize string `json:\"draft_quantize,omitempty\"`\n\n\t// From is the name of the model or file to use as the source.\n\tFrom string `json:\"from,omitempty\"`\n\n\t// List is the list of local model tags to include in a manifest list.\n\tList []string `json:\"list,omitempty\"`\n\n\t// RemoteHost is the URL of the upstream ollama API for the model (if any).\n\tRemoteHost string `json:\"remote_host,omitempty\"`\n\n\t// Files maps source file names to their SHA-256 digests.\n\tFiles map[string]string `json:\"files,omitempty\"`\n\n\t// DraftFiles maps draft source file names to their SHA-256 digests.\n\tDraftFiles map[string]string `json:\"draft_files,omitempty\"`\n\n\t// Adapters is a map of LoRA adapters to include when creating the model.\n\t//\n\t// Deprecated: LoRA adapters are no longer supported.\n\tAdapters map[string]string `json:\"adapters,omitempty\"`\n\n\t// Template is the template used when constructing a request to the model.\n\tTemplate string `json:\"template,omitempty\"`\n\n\t// License is a string or list of strings for licenses.\n\tLicense any `json:\"license,omitempty\"`\n\n\t// System is the system prompt for the model.\n\tSystem string `json:\"system,omitempty\"`\n\n\t// Parameters is a map of hyper-parameters which are applied to the model.\n\tParameters map[string]any `json:\"parameters,omitempty\"`\n\n\t// Messages is a list of messages added to the model before chat and generation requests.\n\tMessages []Message `json:\"messages,omitempty\"`\n\n\t// Renderer is the name of the renderer used when constructing a request to the model.\n\tRenderer string `json:\"renderer,omitempty\"`\n\n\t// Parser is the name of the parser used to parse the output of the request.\n\tParser string `json:\"parser,omitempty\"`\n\n\t// Requires is the minimum version of Ollama required by the model.\n\tRequires string `json:\"requires,omitempty\"`\n\n\t// Capabilities adds to the model's inherited or inferred capabilities.\n\tCapabilities []string `json:\"capabilities,omitempty\"`\n\n\t// Info is a map of additional information for the model\n\tInfo map[string]any `json:\"info,omitempty\"`\n\n\t// Deprecated: set the model name with Model instead\n\tName string `json:\"name\"`\n\t// Deprecated: use Quantize instead\n\tQuantization string `json:\"quantization,omitempty\"`\n}"},{"id":"api/types.go:789:6","name":"ShowRequest","kind":"type","file":"api/types.go","line":789,"endLine":803,"source":"type ShowRequest struct {\n\tModel        string `json:\"model\"`\n\tRunner       string `json:\"runner,omitempty\"`\n\tAllManifests bool   `json:\"all_manifests,omitempty\"`\n\tSystem       string `json:\"system\"`\n\n\t// Template is deprecated\n\tTemplate string `json:\"template\"`\n\tVerbose  bool   `json:\"verbose\"`\n\n\tOptions map[string]any `json:\"options\"`\n\n\t// Deprecated: set the model name with Model instead\n\tName string `json:\"name\"`\n}"},{"id":"api/types.go:830:6","name":"ManifestSummary","kind":"type","file":"api/types.go","line":830,"endLine":835,"source":"type ManifestSummary struct {\n\tDigest   string `json:\"digest,omitempty\"`\n\tRunner   string `json:\"runner,omitempty\"`\n\tFormat   string `json:\"format,omitempty\"`\n\tSelected bool   `json:\"selected,omitempty\"`\n}"},{"id":"api/types.go:844:6","name":"ShowManifestsResponse","kind":"type","file":"api/types.go","line":844,"endLine":847,"source":"type ShowManifestsResponse struct {\n\tManifests []ShowManifest `json:\"manifests\"`\n\tLicense   string         `json:\"license,omitempty\"`\n}"},{"id":"api/types.go:870:6","name":"ProgressResponse","kind":"type","file":"api/types.go","line":870,"endLine":875,"source":"type ProgressResponse struct {\n\tStatus    string `json:\"status\"`\n\tDigest    string `json:\"digest,omitempty\"`\n\tTotal     int64  `json:\"total,omitempty\"`\n\tCompleted int64  `json:\"completed,omitempty\"`\n}"},{"id":"cmd/cloud_suggest.go:83:6","name":"pullWithCloudSuggestion","kind":"func","file":"cmd/cloud_suggest.go","line":83,"endLine":121,"source":"func pullWithCloudSuggestion(ctx context.Context, client *api.Client, name, runner string, insecure bool, verb string) (string, error) {\n\t// If a suggestion prompt may follow a failed pull, erase the failed\n\t// attempt's progress display instead of leaving its \"pulling manifest\"\n\t// line to stack up against the accepted pull's identical one.\n\t_, eligible := cloudSuggestionName(name, insecure)\n\tclearNotFound := eligible \u0026\u0026 isInteractiveTerminal()\n\n\tpullErr := pullModelWithProgress(ctx, client, name, runner, insecure, clearNotFound)\n\tif pullErr == nil {\n\t\treturn name, nil\n\t}\n\n\tcloudName, ok := cloudSuggestionCandidate(name, pullErr, insecure)\n\tif !ok || ctx.Err() != nil {\n\t\treturn \"\", pullErr\n\t}\n\n\t// Showing a \":cloud\" model is proxied to ollama.com and mirrors its status,\n\t// so this reliably answers \"does a cloud version exist?\". Any error (no\n\t// cloud tag, cloud disabled, older server, offline) means no suggestion.\n\tif _, err := client.Show(ctx, \u0026api.ShowRequest{Model: cloudName, Runner: runner}); err != nil {\n\t\treturn \"\", pullErr\n\t}\n\n\tif !isInteractiveTerminal() {\n\t\treturn \"\", fmt.Errorf(\"%w\\n\\n%q is available as a cloud model. Try:\\n  ollama %s %s\", pullErr, cloudName, verb, cloudName)\n\t}\n\n\taccepted, err := confirmCloudSuggestion(fmt.Sprintf(\"Did you mean %q?\", cloudName))\n\tif err != nil || !accepted {\n\t\t// Declining or cancelling falls back to the original error.\n\t\treturn \"\", pullErr\n\t}\n\n\tif err := pullModelWithProgress(ctx, client, cloudName, runner, insecure, false); err != nil {\n\t\treturn \"\", err\n\t}\n\treturn cloudName, nil\n}"},{"id":"cmd/cmd.go:1040:6","name":"SigninHandler","kind":"func","file":"cmd/cmd.go","line":1040,"endLine":1069,"source":"func SigninHandler(cmd *cobra.Command, args []string) error {\n\tclient, err := api.ClientFromEnvironment()\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tuser, err := client.Whoami(cmd.Context())\n\tif err != nil {\n\t\tvar aErr api.AuthorizationError\n\t\tif errors.As(err, \u0026aErr) \u0026\u0026 aErr.StatusCode == http.StatusUnauthorized {\n\t\t\tfmt.Println(\"You need to be signed in to Ollama to run Cloud models.\")\n\t\t\tfmt.Println()\n\n\t\t\tif aErr.SigninURL != \"\" {\n\t\t\t\t_ = browser.OpenURL(aErr.SigninURL)\n\t\t\t\tfmt.Printf(ConnectInstructions, aErr.SigninURL)\n\t\t\t}\n\t\t\treturn nil\n\t\t}\n\t\treturn err\n\t}\n\n\tif user != nil \u0026\u0026 user.Name != \"\" {\n\t\tfmt.Printf(\"You are already signed in as user '%s'\\n\", user.Name)\n\t\tfmt.Println()\n\t\treturn nil\n\t}\n\n\treturn nil\n}"},{"id":"cmd/cmd.go:1071:6","name":"SignoutHandler","kind":"func","file":"cmd/cmd.go","line":1071,"endLine":1092,"source":"func SignoutHandler(cmd *cobra.Command, args []string) error {\n\tclient, err := api.ClientFromEnvironment()\n\tif err != nil {\n\t\treturn err\n\t}\n\n\terr = client.Signout(cmd.Context())\n\tif err != nil {\n\t\tvar aErr api.AuthorizationError\n\t\tif errors.As(err, \u0026aErr) \u0026\u0026 aErr.StatusCode == http.StatusUnauthorized {\n\t\t\tfmt.Println(\"You are not signed in to ollama.com\")\n\t\t\tfmt.Println()\n\t\t\treturn nil\n\t\t} else {\n\t\t\treturn err\n\t\t}\n\t}\n\n\tfmt.Println(\"You have signed out of ollama.com\")\n\tfmt.Println()\n\treturn nil\n}"},{"id":"cmd/cmd.go:1094:6","name":"PushHandler","kind":"func","file":"cmd/cmd.go","line":1094,"endLine":1186,"source":"func PushHandler(cmd *cobra.Command, args []string) error {\n\tclient, err := api.ClientFromEnvironment()\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tinsecure, err := cmd.Flags().GetBool(\"insecure\")\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tn := model.ParseName(args[0])\n\tif strings.HasSuffix(n.Host, \".ollama.ai\") || strings.HasSuffix(n.Host, \".ollama.com\") {\n\t\t_, err := client.Whoami(cmd.Context())\n\t\tif err != nil {\n\t\t\tvar aErr api.AuthorizationError\n\t\t\tif errors.As(err, \u0026aErr) \u0026\u0026 aErr.StatusCode == http.StatusUnauthorized {\n\t\t\t\tfmt.Println(\"You need to be signed in to push models to ollama.com.\")\n\t\t\t\tfmt.Println()\n\n\t\t\t\tif aErr.SigninURL != \"\" {\n\t\t\t\t\tfmt.Printf(ConnectInstructions, aErr.SigninURL)\n\t\t\t\t}\n\t\t\t\treturn nil\n\t\t\t}\n\n\t\t\treturn err\n\t\t}\n\t}\n\n\tp := progress.NewProgress(os.Stderr)\n\tdefer p.Stop()\n\n\tbars := make(map[string]*progress.Bar)\n\tvar status string\n\tvar spinner *progress.Spinner\n\n\tfn := func(resp api.ProgressResponse) error {\n\t\tif resp.Digest != \"\" {\n\t\t\tif spinner != nil {\n\t\t\t\tspinner.Stop()\n\t\t\t}\n\n\t\t\tbar, ok := bars[resp.Digest]\n\t\t\tif !ok {\n\t\t\t\tmsg := resp.Status\n\t\t\t\tif msg == \"\" {\n\t\t\t\t\tmsg = fmt.Sprintf(\"pushing %s...\", resp.Digest[7:19])\n\t\t\t\t}\n\t\t\t\tbar = progress.NewBar(msg, resp.Total, resp.Completed)\n\t\t\t\tbars[resp.Digest] = bar\n\t\t\t\tp.Add(resp.Digest, bar)\n\t\t\t}\n\n\t\t\tbar.Set(resp.Completed)\n\t\t} else if status != resp.Status {\n\t\t\tif spinner != nil {\n\t\t\t\tspinner.Stop()\n\t\t\t}\n\n\t\t\tstatus = resp.Status\n\t\t\tspinner = progress.NewSpinner(status)\n\t\t\tp.Add(status, spinner)\n\t\t}\n\n\t\treturn nil\n\t}\n\n\trequest := api.PushRequest{Name: args[0], Insecure: insecure}\n\n\tif err := client.Push(cmd.Context(), \u0026request, fn); err != nil {\n\t\tif spinner != nil {\n\t\t\tspinner.Stop()\n\t\t}\n\t\terrStr := strings.ToLower(err.Error())\n\t\tif strings.Contains(errStr, \"access denied\") || strings.Contains(errStr, \"unauthorized\") {\n\t\t\treturn errors.New(\"you are not authorized to push to this namespace, create the model under a namespace you own\")\n\t\t}\n\t\treturn err\n\t}"},{"id":"cmd/cmd.go:1188:6","name":"ListHandler","kind":"func","file":"cmd/cmd.go","line":1188,"endLine":1226,"source":"func ListHandler(cmd *cobra.Command, args []string) error {\n\tclient, err := api.ClientFromEnvironment()\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tmodels, err := client.List(cmd.Context())\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tvar data [][]string\n\n\tfor _, m := range models.Models {\n\t\tif len(args) == 0 || strings.HasPrefix(strings.ToLower(m.Name), strings.ToLower(args[0])) {\n\t\t\tvar size string\n\t\t\tif m.RemoteModel != \"\" {\n\t\t\t\tsize = \"-\"\n\t\t\t} else {\n\t\t\t\tsize = format.HumanBytes(m.Size)\n\t\t\t}\n\n\t\t\tdata = append(data, []string{m.Name, m.Digest[:12], size, format.HumanTime(m.ModifiedAt, \"Never\")})\n\t\t}\n\t}\n\n\ttable := tablewriter.NewWriter(os.Stdout)\n\ttable.SetHeader([]string{\"NAME\", \"ID\", \"SIZE\", \"MODIFIED\"})\n\ttable.SetHeaderAlignment(tablewriter.ALIGN_LEFT)\n\ttable.SetAlignment(tablewriter.ALIGN_LEFT)\n\ttable.SetHeaderLine(false)\n\ttable.SetBorder(false)\n\ttable.SetNoWhiteSpace(true)\n\ttable.SetTablePadding(\"    \")\n\ttable.AppendBulk(data)\n\ttable.Render()\n\n\treturn nil\n}"},{"id":"cmd/cmd.go:1228:6","name":"ListRunningHandler","kind":"func","file":"cmd/cmd.go","line":1228,"endLine":1281,"source":"func ListRunningHandler(cmd *cobra.Command, args []string) error {\n\tclient, err := api.ClientFromEnvironment()\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tmodels, err := client.ListRunning(cmd.Context())\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tvar data [][]string\n\n\tfor _, m := range models.Models {\n\t\tif len(args) == 0 || strings.HasPrefix(m.Name, args[0]) {\n\t\t\tvar procStr string\n\t\t\tswitch {\n\t\t\tcase m.SizeVRAM == 0:\n\t\t\t\tprocStr = \"100% CPU\"\n\t\t\tcase m.SizeVRAM == m.Size:\n\t\t\t\tprocStr = \"100% GPU\"\n\t\t\tcase m.SizeVRAM \u003e m.Size || m.Size == 0:\n\t\t\t\tprocStr = \"Unknown\"\n\t\t\tdefault:\n\t\t\t\tsizeCPU := m.Size - m.SizeVRAM\n\t\t\t\tcpuPercent := math.Round(float64(sizeCPU) / float64(m.Size) * 100)\n\t\t\t\tprocStr = fmt.Sprintf(\"%d%%/%d%% CPU/GPU\", int(cpuPercent), int(100-cpuPercent))\n\t\t\t}\n\n\t\t\tvar until string\n\t\t\tdelta := time.Since(m.ExpiresAt)\n\t\t\tif delta \u00 \tfmt.Fprintf(os.Stderr, \"Couldn't process file: %q\\n\", err)\n\t\t\treturn \"\", imgs, err\n\t\t}\n\t\text := strings.ToLower(filepath.Ext(nfp))\n\t\tswitch ext {\n\t\tcase \".wav\":\n\t\t\tfmt.Fprintf(os.Stderr, \"Added audio '%s'\\n\", nfp)\n\t\tdefault:\n\t\t\tfmt.Fprintf(os.Stderr, \"Added image '%s'\\n\", nfp)\n\t\t}\n\t\tinput = strings.ReplaceAll(input, \"'\"+nfp+\"'\", \"\")\n\t\tinput = strings.ReplaceAll(input, \"'\"+fp+\"'\", \"\")\n\t\tinput = strings.ReplaceAll(input, fp, \"\")\n\t\timgs = append(imgs, data)\n\t}\n\treturn strings.TrimSpace(input), imgs, nil\n}"},{"id":"cmd/interactive.go:687:6","name":"editInExternalEditor","kind":"func","file":"cmd/interactive.go","line":687,"endLine":738,"source":"func editInExternalEditor(content string) (string, error) {\n\teditor := envconfig.Editor()\n\tif editor == \"\" {\n\t\teditor = os.Getenv(\"VISUAL\")\n\t}\n\tif editor == \"\" {\n\t\teditor = os.Getenv(\"EDITOR\")\n\t}\n\tif editor == \"\" {\n\t\teditor = defaultEditor\n\t}\n\n\t// Check that the editor binary exists\n\targs := strings.Fields(editor)\n\tif len(args) == 0 {\n\t\treturn \"\", fmt.Errorf(\"no editor configured, set OLLAMA_EDITOR to the path of your preferred editor\")\n\t}\n\tif _, err := exec.LookPath(args[0]); err != nil {\n\t\treturn \"\", fmt.Errorf(\"editor %q not found, set OLLAMA_EDITOR to the path of your preferred editor\", args[0])\n\t}\n\n\ttmpFile, err := os.CreateTemp(\"\", \"ollama-prompt-*.txt\")\n\tif err != nil {\n\t\treturn \"\", fmt.Errorf(\"creating temp file: %w\", err)\n\t}\n\tdefer os.Remove(tmpFile.Name())\n\n\tif content != \"\" {\n\t\tif _, err := tmpFile.WriteString(content); err != nil {\n\t\t\ttmpFile.Close()\n\t\t\treturn \"\", fmt.Errorf(\"writing to temp file: %w\", err)\n\t\t}\n\t}\n\ttmpFile.Close()\n\n\targs = append(args, tmpFile.Name())\n\tcmd := exec.Command(args[0], args[1:]...)\n\tcmd.Stdin = os.Stdin\n\tcmd.Stdout = os.Stdout\n\tcmd.Stderr = os.Stderr\n\n\tif err := cmd.Run(); err != nil {\n\t\treturn \"\", fmt.Errorf(\"editor exited with error: %w\", err)\n\t}\n\n\tdata, err := os.ReadFile(tmpFile.Name())\n\tif err != nil {\n\t\treturn \"\", fmt.Errorf(\"reading temp file: %w\", err)\n\t}\n\n\treturn strings.TrimRight(string(data), \"\\n\"), nil\n}"},{"id":"cmd/launch/launch.go:276:6","name":"LaunchCmd","kind":"func","file":"cmd/launch/launch.go","line":276,"endLine":407,"source":"func LaunchCmd(checkServerHeartbeat func(cmd *cobra.Command, args []string) error, runTUI func(cmd *cobra.Command)) *cobra.Command {\n\tvar modelFlag string\n\tvar configFlag bool\n\tvar yesFlag bool\n\tvar restoreFlag bool\n\n\tcmd := \u0026cobra.Command{\n\t\tUse:   \"launch [INTEGRATION] [-- [EXTRA_ARGS...]]\",\n\t\tShort: \"Launch the Ollama menu or an integration\",\n\t\tLong: `Launch the Ollama interactive menu, or directly launch a specific integration.\n\nWithout arguments, this is equivalent to running 'ollama' directly.\nFlags and extra arguments require an integration name.\n\nSupported integrations:\n  claude          Claude Code\n  chatgpt         ChatGPT (aliases: codex-app, codex-desktop, codex-gui)\n  hermes          Hermes Agent\n  openclaw        OpenClaw (aliases: clawdbot, moltbot)\n  opencode        OpenCode\n  codex           Codex\n  hermes-desktop  Hermes Desktop\n  copilot         Copilot CLI (aliases: copilot-cli)\n  omp             OMP\n  droid           Droid\n  dsh             DeepSeek Harness (alias: deepseek-harness)\n  kimi            Kimi Code CLI\n  muse            Muse Code (aliases: muse-code)\n  pi              Pi\n  pool            Pool\n  cline           Cline\n  qwen            Qwen Code\n  vscode          VS Code (aliases: code)\n\nExamples:\n  ollama launch\n  ollama launch claude-desktop --restore\n  ollama launch claude\n  ollama launch claude --model \u003cmodel\u003e\n  ollama launch chatgpt\n  ollama launch chatgpt --restore\n  ollama launch hermes\n  ollama launch hermes-desktop\n  ollama launch dsh\n  ollama launch droid --config (does not auto-launch)\n  ollama launch codex --restore\n  ollama launch codex -- --sandbox workspace-write`,\n\t\tArgs: cobra.ArbitraryArgs,\n\t\tPreRunE: func(cmd *cobra.Command, args []string) error {\n\t\t\tif restoreFlag {\n\t\t\t\treturn nil\n\t\t\t}\n\t\t\tif len(args) \u003e 0 \u0026\u0026 launchCommandIsClaudeDesktop(args[0]) {\n\t\t\t\treturn fmt.Errorf(\"Claude Desktop can only be restored from the command line: ollama launch claude-desktop --restore\")\n\t\t\t}\n\t\t\treturn checkServerHeartbeat(cmd, args)\n\t\t},\n\t\tRunE: func(cmd *cobra.Command, args []string) error {\n\t\t\tpolicy := defaultLaunchPolicy(isInteractiveSession(), yesFlag)\n\t\t\t// reset when done to make sure state doesn't leak between launches\n\t\t\trestoreConfirmPolicy := withLaunchConfirmPolicy(policy.confirmPolicy())\n\t\t\tdefer restoreConfirmPolicy()\n\n\t\t\tvar name string\n\t\t\tvar passArgs []string\n\t\t\tdashIdx := cmd.ArgsLenAtDash()\n\n\t\t\tif dashIdx == -1 {\n\t\t\t\tif len(args) \u003e 1 {\n\t\t\t\t\treturn fmt.Errorf(\"unexpected arguments: %v\\nUse '--' to pass extra arguments to the integration\", args[1:])\n\t\t\t\t}\n\t\t\t\tif len(args) == 1 {\n\t\t\t\t\tname = args[0]\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\tif dashIdx \u003e 1 {\n\t\t\t\t\treturn fmt.Errorf(\"expected at most 1 integration name before '--', got %d\", dashIdx)\n\t\t\t\t}\n\t\t\t\tif dashIdx == 1 {\n\t\t\t\t\tname = args[0]"},{"id":"cmd/launch/selector_hooks.go:21:5","name":"ErrCancelled","kind":"var","file":"cmd/launch/selector_hooks.go","line":21,"endLine":21,"source":"var ErrCancelled = errors.New(\"cancelled\")"},{"id":"cmd/welcome.go:11:6","name":"runWelcome","kind":"func","file":"cmd/welcome.go","line":11,"endLine":23,"source":"func runWelcome() error {\n\tif !term.IsTerminal(int(os.Stdin.Fd())) || !term.IsTerminal(int(os.Stdout.Fd())) {\n\t\treturn nil\n\t}\n\treturn ensureWelcome(func() error {\n\t\treturn tui.RunWelcome(tui.WelcomeOptions{\n\t\t\tIsCompleted: func() bool {\n\t\t\t\tneeded, err := config.NeedsWelcome()\n\t\t\t\treturn err == nil \u0026\u0026 !needed\n\t\t\t},\n\t\t})\n\t})\n}"},{"id":"discover/gpu.go:21:6","name":"GetSystemInfo","kind":"func","file":"discover/gpu.go","line":21,"endLine":38,"source":"func GetSystemInfo() ml.SystemInfo {\n\tlogutil.Trace(\"performing system memory discovery\")\n\tstartDiscovery := time.Now()\n\tdefer func() {\n\t\tlogutil.Trace(\"system memory discovery completed\", \"duration\", time.Since(startDiscovery))\n\t}()\n\n\tmemInfo, err := GetCPUMem()\n\tif err != nil {\n\t\tslog.Warn(\"error looking up system memory\", \"error\", err)\n\t}\n\n\treturn ml.SystemInfo{\n\t\tTotalMemory: memInfo.TotalMemory,\n\t\tFreeMemory:  memInfo.FreeMemory,\n\t\tFreeSwap:    memInfo.FreeSwap,\n\t}\n}"},{"id":"discover/native_probe.go:108:6","name":"RunNativeProbeCommand","kind":"func","file":"discover/native_probe.go","line":108,"endLine":119,"source":"func RunNativeProbeCommand(ctx context.Context, libDirs []string, out io.Writer) error {\n\tif len(libDirs) == 0 {\n\t\tlibDirs = []string{ml.LibOllamaPath}\n\t}\n\n\tdevices, err := runNativeProbe(ctx, libDirs) //nolint:staticcheck,nolintlint // runNativeProbe always returns non-nil on macOS (stub) but can return nil on Linux with cgo\n\tif err != nil {                              //nolint:staticcheck,nolintlint\n\t\treturn err\n\t}\n\n\treturn json.NewEncoder(out).Encode(nativeProbeResult{Devices: devices})\n}"},{"id":"discover/runner.go:36:6","name":"GPUDevices","kind":"func","file":"discover/runner.go","line":36,"endLine":370,"source":"func GPUDevices(ctx context.Context, runners []ml.FilteredRunnerDiscovery) []ml.DeviceInfo {\n\tdeviceMu.Lock()\n\tdefer deviceMu.Unlock()\n\tstartDiscovery := time.Now()\n\tmsg := \"overall device VRAM discovery took\"\n\tdefer func() {\n\t\tslog.Debug(msg, \"duration\", time.Since(startDiscovery))\n\t}()\n\n\tif !bootstrapped {\n\t\tmsg = \"GPU bootstrap discovery took\"\n\t\tlibDirs = make(map[string]struct{})\n\t\tfiles, err := filepath.Glob(filepath.Join(ml.LibOllamaPath, \"*\", \"*ggml-*\"))\n\t\tif err != nil {\n\t\t\tslog.Debug(\"unable to lookup runner library directories\", \"error\", err)\n\t\t}\n\t\tfor _, file := range files {\n\t\t\tlibDirs[filepath.Dir(file)] = struct{}{}\n\t\t}\n\n\t\tif len(libDirs) == 0 {\n\t\t\tlibDirs[\"\"] = struct{}{}\n\t\t}\n\n\t\tslog.Info(\"discovering available GPUs...\")\n\t\tdetectIncompatibleLibraries()\n\t\tdetectOldAMDDriverWindows()\n\n\t\t// Warn if any user-overrides are set which could lead to incorrect GPU discovery\n\t\toverrideWarnings()\n\n\t\trequested := envconfig.LLMLibrary()\n\t\tjetpack := cudaJetpack()\n\n\t\t// If the detected JetPack runner isn't installed, clear the override so\n\t\t// normal discovery can select a standard CUDA build (e.g. cuda_v13,\n\t\t// which supports Orin on JetPack 7).\n\t\tif jetpack != \"\" {\n\t\t\tif _, ok := libDirs[filepath.Join(ml.LibOllamaPath, \"cuda_\"+jetpack)]; !ok {\n\t\t\t\tjetpack = \"\"\n\t\t\t}\n\t\t}\n\n\t\t// For our initial discovery pass, we gather all the known GPUs through\n\t\t// all the libraries that were detected. This pass may include GPUs that\n\t\t// are enumerated, but not actually supported.\n\t\t// We run this in serial to avoid potentially initializing a GPU multiple\n\t\t// times concurrently leading to memory contention\n\t\tfor dir := range libDirs {\n\t\t\t// Typically bootstrapping takes \u003c 1s, but on some systems, with devices\n\t\t\t// in low power/idle mode, initialization can take multiple seconds.  We\n\t\t\t// set a longer timeout just for bootstrap discovery to reduce the chance\n\t\t\t// of giving up too quickly\n\t\t\tbootstrapTimeout := 30 * time.Second\n\t\t\tif runtime.GOOS == \"windows\" {\n\t\t\t\t// On Windows with Defender enabled, AV scanning of the DLLs\n\t\t\t\t// takes place sequentially and this can significantly increase\n\t\t\t\t// the time it takes too do the initial discovery pass.\n\t\t\t\t// Subsequent loads will be faster as the scan results are\n\t\t\t\t// cached\n\t\t\t\tbootstrapTimeout = 90 * time.Second\n\t\t\t}\n\t\t\tvar dirs []string\n\t\t\tif dir != \"\" {\n\t\t\t\tif requested != \"\" \u0026\u0026 !strings.HasPrefix(requested, \"mlx_\") \u0026\u0026 filepath.Base(dir) != requested {\n\t\t\t\t\tslog.Debug(\"skipping available library at user's request\", \"requested\", requested, \"libDir\", dir)\n\t\t\t\t\tcontinue\n\t\t\t\t} else if jetpack != \"\" \u0026\u0026 filepath.Base(dir) != \"cuda_\"+jetpack {\n\t\t\t\t\tcontinue\n\t\t\t\t} else if jetpack == \"\" \u0026\u0026 strings.Contains(filepath.Base(dir), \"cuda_jetpack\") {\n\t\t\t\t\tslog.Debug(\"jetpack not detected (set JETSON_JETPACK or OLLAMA_LLM_LIBRARY to override), skipping\", \"libDir\", dir)\n\t\t\t\t\tcontinue\n\t\t\t\t} else if !envconfig.EnableVulkan(true) \u0026\u0026 strings.Contains(filepath.Base(dir), \"vulkan\") {\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\tdirs = []string{ml.LibOllamaPath, dir}\n\t\t\t} else {\n\t\t\t\tdirs = []string{ml.LibOllamaPath}\n\t\t\t}\n"},{"id":"discover/types.go:19:6","name":"LogDetails","kind":"func","file":"discover/types.go","line":19,"endLine":64,"source":"func LogDetails(devices []ml.DeviceInfo) {\n\tsort.Sort(sort.Reverse(ml.ByFreeMemory(devices))) // Report devices in order of scheduling preference\n\tfor _, dev := range devices {\n\t\tvar libs []string\n\t\tfor _, dir := range dev.LibraryPath {\n\t\t\tif strings.Contains(dir, filepath.Join(\"lib\", \"ollama\")) {\n\t\t\t\tlibs = append(libs, filepath.Base(dir))\n\t\t\t}\n\t\t}\n\t\ttypeStr := \"discrete\"\n\t\tif dev.Integrated {\n\t\t\ttypeStr = \"iGPU\"\n\t\t}\n\t\tslog.Info(\"inference compute\",\n\t\t\t\"id\", dev.ID,\n\t\t\t\"filter_id\", dev.FilterID,\n\t\t\t\"library\", dev.Library,\n\t\t\t\"compute\", dev.Compute(),\n\t\t\t\"name\", dev.Name,\n\t\t\t\"description\", dev.Description,\n\t\t\t\"libdirs\", strings.Join(libs, \",\"),\n\t\t\t\"driver\", dev.Driver(),\n\t\t\t\"pci_id\", dev.PCIID,\n\t\t\t\"type\", typeStr,\n\t\t\t\"total\", format.HumanBytes2(dev.TotalMemory),\n\t\t\t\"available\", format.HumanBytes2(dev.FreeMemory),\n\t\t)\n\t}\n\t// CPU inference\n\tif len(devices) == 0 {\n\t\tdev, _ := GetCPUMem()\n\t\tslog.Info(\"inference compute\",\n\t\t\t\"id\", \"cpu\",\n\t\t\t\"library\", \"cpu\",\n\t\t\t\"compute\", \"\",\n\t\t\t\"name\", \"cpu\",\n\t\t\t\"description\", \"cpu\",\n\t\t\t\"libdirs\", \"ollama\",\n\t\t\t\"driver\", \"\",\n\t\t\t\"pci_id\", \"\",\n\t\t\t\"type\", \"\",\n\t\t\t\"total\", format.HumanBytes2(dev.TotalMemory),\n\t\t\t\"available\", format.HumanBytes2(dev.FreeMemory),\n\t\t)\n\t}\n}"},{"id":"envconfig/config.go:129:6","name":"KeepAlive","kind":"func","file":"envconfig/config.go","line":129,"endLine":144,"source":"func KeepAlive() (keepAlive time.Duration) {\n\tkeepAlive = 5 * time.Minute\n\tif s := Var(\"OLLAMA_KEEP_ALIVE\"); s != \"\" {\n\t\tif d, err := time.ParseDuration(s); err == nil {\n\t\t\tkeepAlive = d\n\t\t} else if n, err := strconv.ParseInt(s, 10, 64); err == nil {\n\t\t\tkeepAlive = time.Duration(n) * time.Second\n\t\t}\n\t}\n\n\tif keepAlive \u003c 0 {\n\t\treturn time.Duration(math.MaxInt64)\n\t}\n\n\treturn keepAlive\n}"},{"id":"envconfig/config.go:201:6","name":"LogLevel","kind":"func","file":"envconfig/config.go","line":201,"endLine":212,"source":"func LogLevel() slog.Level {\n\tlevel := slog.LevelInfo\n\tif s := Var(\"OLLAMA_DEBUG\"); s != \"\" {\n\t\tif b, _ := strconv.ParseBool(s); b {\n\t\t\tlevel = slog.LevelDebug\n\t\t} else if i, _ := strconv.ParseInt(s, 10, 64); i != 0 {\n\t\t\tlevel = slog.Level(i * -4)\n\t\t}\n\t}\n\n\treturn level\n}"},{"id":"envconfig/config.go:224:2","name":"NoHistory","kind":"var","file":"envconfig/config.go","line":224,"endLine":224,"source":"\tNoHistory = Bool(\"OLLAMA_NOHISTORY\")"},{"id":"envconfig/config.go:226:2","name":"NoPrune","kind":"var","file":"envconfig/config.go","line":226,"endLine":226,"source":"\tNoPrune = Bool(\"OLLAMA_NOPRUNE\")"},{"id":"envconfig/config.go:22:6","name":"Host","kind":"func","file":"envconfig/config.go","line":22,"endLine":60,"source":"func Host() *url.URL {\n\tdefaultPort := \"11434\"\n\n\ts := strings.TrimSpace(Var(\"OLLAMA_HOST\"))\n\tscheme, hostport, ok := strings.Cut(s, \"://\")\n\tswitch {\n\tcase !ok:\n\t\tscheme, hostport = \"http\", s\n\t\tif s == \"ollama.com\" {\n\t\t\tscheme, hostport = \"https\", \"ollama.com:443\"\n\t\t}\n\tcase scheme == \"http\":\n\t\tdefaultPort = \"80\"\n\tcase scheme == \"https\":\n\t\tdefaultPort = \"443\"\n\t}\n\n\thostport, path, _ := strings.Cut(hostport, \"/\")\n\thost, port, err := net.SplitHostPort(hostport)\n\tif err != nil {\n\t\thost, port = \"127.0.0.1\", defaultPort\n\t\tif ip := net.ParseIP(strings.Trim(hostport, \"[]\")); ip != nil {\n\t\t\thost = ip.String()\n\t\t} else if hostport != \"\" {\n\t\t\thost = hostport\n\t\t}\n\t}\n\n\tif n, err := strconv.ParseInt(port, 10, 32); err != nil || n \u003e 65535 || n \u003c 0 {\n\t\tslog.Warn(\"invalid port, using default\", \"port\", port, \"default\", defaultPort)\n\t\tport = defaultPort\n\t}\n\n\treturn \u0026url.URL{\n\t\tScheme: scheme,\n\t\tHost:   net.JoinHostPort(host, port),\n\t\tPath:   path,\n\t}\n}"},{"id":"envconfig/config.go:277:2","name":"NumParallel","kind":"var","file":"envconfig/config.go","line":277,"endLine":277,"source":"\tNumParallel = Uint(\"OLLAMA_NUM_PARALLEL\", 1)"},{"id":"envconfig/config.go:281:2","name":"MaxQueue","kind":"var","file":"envconfig/config.go","line":281,"endLine":281,"source":"\tMaxQueue = Uint(\"OLLAMA_MAX_QUEUE\", 512)"},{"id":"envconfig/config.go:305:5","name":"GpuOverhead","kind":"var","file":"envconfig/config.go","line":305,"endLine":305,"source":"var GpuOverhead = Uint64(\"OLLAMA_GPU_OVERHEAD\", 0)"},{"id":"envconfig/config.go:307:6","name":"EnvVar","kind":"type","file":"envconfig/config.go","line":307,"endLine":311,"source":"type EnvVar struct {\n\tName        string\n\tValue       any\n\tDescription string\n}"},{"id":"envconfig/config.go:313:6","name":"AsMap","kind":"func","file":"envconfig/config.go","line":313,"endLine":367,"source":"func AsMap() map[string]EnvVar {\n\tret := map[string]EnvVar{\n\t\t\"OLLAMA_DEBUG\":                {\"OLLAMA_DEBUG\", LogLevel(), \"Show additional debug information (e.g. OLLAMA_DEBUG=1)\"},\n\t\t\"OLLAMA_DEBUG_LOG_REQUESTS\":   {\"OLLAMA_DEBUG_LOG_REQUESTS\", DebugLogRequests(), \"Log inference request bodies and replay curl commands to a temp directory\"},\n\t\t\"OLLAMA_GO_TEMPLATE\":          {\"OLLAMA_GO_TEMPLATE\", GoTemplate(true), \"Enable Modelfile TEMPLATE based rendering when available\"},\n\t\t\"OLLAMA_FLASH_ATTENTION\":      {\"OLLAMA_FLASH_ATTENTION\", FlashAttention(false), \"Enabled flash attention\"},\n\t\t\"OLLAMA_KV_CACHE_TYPE\":        {\"OLLAMA_KV_CACHE_TYPE\", KvCacheType(), \"Quantization type for the K/V cache (default: f16)\"},\n\t\t\"OLLAMA_GPU_OVERHEAD\":         {\"OLLAMA_GPU_OVERHEAD\", GpuOverhead(), \"Reserve a portion of VRAM per GPU (bytes)\"},\n\t\t\"OLLAMA_IGPU_ENABLE\":          {\"OLLAMA_IGPU_ENABLE\", String(\"OLLAMA_IGPU_ENABLE\")(), \"Enable integrated GPUs\"},\n\t\t\"LLAMA_ARG_FIT\":               {\"LLAMA_ARG_FIT\", String(\"LLAMA_ARG_FIT\")(), \"Enable llama.cpp automatic fit of unset memory options (default \\\"on\\\")\"},\n\t\t\"LLAMA_ARG_FIT_TARGET\":        {\"LLAMA_ARG_FIT_TARGET\", String(\"LLAMA_ARG_FIT_TARGET\")(), \"Target free VRAM margin per device for llama.cpp fit (MiB)\"},\n\t\t\"OLLAMA_HOST\":                 {\"OLLAMA_HOST\", Host(), \"IP Address for the ollama server (default 127.0.0.1:11434)\"},\n\t\t\"OLLAMA_KEEP_ALIVE\":           {\"OLLAMA_KEEP_ALIVE\", KeepAlive(), \"The duration that models stay loaded in memory (default \\\"5m\\\")\"},\n\t\t\"OLLAMA_LLM_LIBRARY\":          {\"OLLAMA_LLM_LIBRARY\", LLMLibrary(), \"Set LLM library to bypass autodetection\"},\n\t\t\"OLLAMA_LOAD_TIMEOUT\":         {\"OLLAMA_LOAD_TIMEOUT\", LoadTimeout(), \"How long to allow model loads to stall before giving up (default \\\"5m\\\")\"},\n\t\t\"OLLAMA_MAX_LOADED_MODELS\":    {\"OLLAMA_MAX_LOAD e":1127,"source":"func (s *llamaServerRunner) Load(ctx context.Context, systemInfo ml.SystemInfo, gpus []ml.DeviceInfo, _ bool) ([]ml.DeviceID, error) {\n\tslog.Info(\"loading model via llama-server\", \"model\", s.modelPath)\n\n\tif err := s.WaitUntilRunning(ctx); err != nil {\n\t\tretried, retryErr := s.retryWithMMProjCPUOffload(err)\n\t\tif retryErr != nil {\n\t\t\treturn nil, retryErr\n\t\t}\n\t\tif !retried {\n\t\t\treturn nil, err\n\t\t}\n\t\tif err := s.WaitUntilRunning(ctx); err != nil {\n\t\t\treturn nil, fmt.Errorf(\"llama-server startup failed after projector CPU offload retry: %w\", err)\n\t\t}\n\t}\n\tif err := s.removeSplitDirs(); err != nil {\n\t\tslog.Debug(\"split GGUF alias cleanup deferred until runner shutdown\", \"error\", err)\n\t}\n\n\t// Verify that buffer size parsing captured GPU allocations.\n\t// If parsing failed (e.g., llama-server log format changed), warn so the\n\t// issue is visible in logs when users report problems.\n\tif len(s.gpus) \u003e 0 \u0026\u0026 !s.hasParsedVRAM() {\n\t\tslog.Warn(\"llama-server VRAM tracking: no per-device buffer sizes were parsed from \"+\n\t\t\t\"llama-server logs. VRAM accounting will be inaccurate. This may indicate a \"+\n\t\t\t\"change in llama-server's log format — check for 'buffer size' lines in the output.\",\n\t\t\t\"model\", s.modelPath, \"gpus\", len(s.gpus))\n\t}\n\n\tif s.options.MainGPU != nil \u0026\u0026 *s.options.MainGPU \u003e= 0 \u0026\u0026 *s.options.MainGPU \u003c len(gpus) {\n\t\treturn []ml.DeviceID{gpus[*s.options.MainGPU].DeviceID}, nil\n\t}\n\n\t// Return device IDs for all GPUs when llama-server manages layer placement itself.\n\tdeviceIDs := make([]ml.DeviceID, len(gpus))\n\tfor i, g := range gpus {\n\t\tdeviceIDs[i] = g.DeviceID\n\t}\n\n\treturn deviceIDs, nil\n}"},{"id":"llm/llama_server.go:1327:29","name":"(*llamaServerRunner).WaitUntilRunning","kind":"method","file":"llm/llama_server.go","line":1327,"endLine":1430,"source":"func (s *llamaServerRunner) WaitUntilRunning(ctx context.Context) error {\n\ts.startLoadTracking(time.Now())\n\tdefer s.stopLoadTracking()\n\n\tstallTimeout := envconfig.LoadTimeout()\n\tlastActivity := s.lastLoadActivity()\n\tif lastActivity.IsZero() {\n\t\tlastActivity = s.loadStart\n\t}\n\tif lastActivity.IsZero() {\n\t\tlastActivity = time.Now()\n\t}\n\tloadDeadline := lastActivity.Add(stallTimeout)\n\n\tslog.Info(\"waiting for llama-server to start responding\")\n\tvar lastStatus ServerStatus = -1\n\n\tfor {\n\t\tselect {\n\t\tcase \u003c-ctx.Done():\n\t\t\tslog.Warn(\"client connection closed before llama-server finished loading, aborting load\")\n\t\t\treturn fmt.Errorf(\"timed out waiting for llama-server to start: %w\", ctx.Err())\n\t\tcase \u003c-s.done:\n\t\t\tif msg := s.lastErrMsg(); msg != \"\" {\n\t\t\t\tif s.doneErr == nil {\n\t\t\t\t\treturn fmt.Errorf(\"llama-server process has terminated: %s\", msg)\n\t\t\t\t}\n\t\t\t\tif s.cmd != nil \u0026\u0026 s.cmd.ProcessState != nil \u0026\u0026 s.cmd.ProcessState.ExitCode() \u003e= 0 {\n\t\t\t\t\treturn fmt.Errorf(\"llama-server process has terminated: %s: %s\", ExitStatus(s.cmd.ProcessState.ExitCode()), msg)\n\t\t\t\t}\n\t\t\t\tif exit := ExitStatusFromError(s.doneErr); exit.Known() {\n\t\t\t\t\treturn fmt.Errorf(\"llama-server process has terminated: %s: %s\", exit, msg)\n\t\t\t\t}\n\t\t\t\treturn fmt.Errorf(\"llama-server process has terminated: %w: %s\", s.doneErr, msg)\n\t\t\t}\n\t\t\tif s.doneErr == nil {\n\t\t\t\tif s.cmd != nil \u0026\u0026 s.cmd.ProcessState != nil {\n\t\t\t\t\treturn fmt.Errorf(\"llama-server process has terminated: %s\", ExitStatus(s.cmd.ProcessState.ExitCode()))\n\t\t\t\t}\n\t\t\t\treturn errors.New(\"llama-server process has terminated\")\n\t\t\t}\n\t\t\tif exit := ExitStatusFromError(s.doneErr); exit.Known() {\n\t\t\t\treturn fmt.Errorf(\"llama-server process has terminated: %s\", exit)\n\t\t\t}\n\t\t\treturn fmt.Errorf(\"llama-server process has terminated: %w\", s.doneErr)\n\t\tdefault:\n\t\t}\n\n\t\tif activity := s.lastLoadActivity(); activity.After(lastActivity) {\n\t\t\tlastActivity = activity\n\t\t\tloadDeadline = lastActivity.Add(stallTimeout)\n\t\t}\n\n\t\tif time.Now().After(loadDeadline) {\n\t\t\tmsg := s.lastErrMsg()\n\t\t\treturn fmt.Errorf(\"timed out waiting for llama-server to start - %s\", msg)\n\t\t}\n\n\t\tif s.cmd.ProcessState != nil {\n\t\t\tmsg := s.lastErrMsg()\n\t\t\treturn fmt.Errorf(\"llama-server process no longer running: %s %s\", ExitStatus(s.cmd.ProcessState.ExitCode()), msg)\n\t\t}\n\n\t\tpollCtx, cancel := context.WithTimeout(ctx, 200*time.Millisecond)\n\t\tstatus, statusErr := s.getServerStatus(pollCtx)\n\t\tcancel()\n\n\t\tstatusChanged := lastStatus != status\n\t\tif statusChanged \u0026\u0026 status != ServerStatusReady {\n\t\t\tslog.Info(\"waiting for llama-server to become available\", \"status\", status)\n\t\t}\n\t\tif statusChanged \u0026\u0026 status == ServerStatusLoadingModel {\n\t\t\tlastActivity = time.Now()\n\t\t\tloadDeadline = lastActivity.Add(stallTimeout)\n\t\t}\n\n\t\tswitch status {\n\t\tcase ServerStatusReady:\n\t\t\tif s.status != nil {\n\t\t\t\ts.status.SetLastError(\"\")"},{"id":"llm/llama_server.go:228:29","name":"(*llamaServerRunner).ModelPath","kind":"method","file":"llm/llama_server.go","line":228,"endLine":230,"source":"func (s *llamaServerRunner) ModelPath() string {\n\treturn s.modelPath\n}"},{"id":"llm/llama_server.go:232:29","name":"(*llamaServerRunner).Pid","kind":"method","file":"llm/llama_server.go","line":232,"endLine":237,"source":"func (s *llamaServerRunner) Pid() int {\n\tif s.cmd != nil \u0026\u0026 s.cmd.Process != nil {\n\t\treturn s.cmd.Process.Pid\n\t}\n\treturn 0\n}"},{"id":"llm/llama_server.go:2734:29","name":"(*llamaServerRunner).Close","kind":"method","file":"llm/llama_server.go","line":2734,"endLine":2736,"source":"func (s *llamaServerRunner) Close() error {\n\treturn errors.Join(s.stopProcess(), s.removeSplitDirs())\n}"},{"id":"llm/llama_server.go:2801:29","name":"(*llamaServerRunner).MemorySize","kind":"method","file":"llm/llama_server.go","line":2801,"endLine":2839,"source":"func (s *llamaServerRunner) MemorySize() (total, vram uint64) {\n\ts.memoryMu.RLock()\n\tmemTotal := s.memTotal\n\tmemGPU := s.memGPU\n\tmemModelFileBacked := s.memModelFileBacked\n\tmemCPUMappedModel := s.memCPUMappedModel\n\ttotalLayers := s.totalLayers\n\tgpuLayers := s.gpuLayers\n\tgpuLayerOverflow := s.gpuLayerOverflow\n\ts.memoryMu.RUnlock()\n\n\tif memTotal \u003e 0 {\n\t\ttotal, vram = memTotal, memGPU\n\t\t// With mmap, llama-server reports each CPU_Mapped model buffer as the\n\t\t// file-offset span of its CPU-resident tensors. During partial offload\n\t\t// that span covers nearly the whole file (the first and last tensors\n\t\t// stay on CPU), re-counting weights already held in device buffers.\n\t\t// Only buffers that mirror the on-disk file can overlap this way;\n\t\t// repacked copies such as CPU_REPACK are separate real allocations and\n\t\t// must be left intact. Weights cannot exceed the model file on disk, so\n\t\t// trim that overlap from the mmap-backed (reclaimable page cache) portion.\n\t\tif memCPUMappedModel \u003e 0 {\n\t\t\tif modelSize := modelFileSize(s.modelPath, s.metadata); modelSize \u003e 0 \u0026\u0026 memModelFileBacked \u003e modelSize {\n\t\t\t\ttotal -= min(memCPUMappedModel, memModelFileBacked-modelSize)\n\t\t\t}\n\t\t}\n\t\tif totalLayers \u003e 0 \u0026\u0026 gpuLayers \u003e= totalLayers \u0026\u0026 gpuLayerOverflow == 0 {\n\t\t\ttotal = vram\n\t\t}\n\t\treturn total, vram\n\t}\n\t// Fallback: use model file size as a rough proxy\n\tslog.Debug(\"llama-server buffer sizes not available, falling back to file size estimate\", \"model\", s.modelPath)\n\tif modelSize := modelFileSize(s.modelPath, s.metadata); modelSize \u003e 0 {\n\t\ttotal = modelSize\n\t\tvram = total\n\t}\n\treturn total, vram\n}"},{"id":"llm/llama_server.go:2844:6","name":"PredictServerVRAM","kind":"func","file":"llm/llama_server.go","line":2844,"endLine":2860,"source":"func PredictServerVRAM(modelPath string, f *gguf.Model, numCtx int) uint64 {\n\tweights := modelFileSize(modelPath, f)\n\n\t// KV cache: 2 (K+V) * layers * kv_heads * head_dim * context * 2 bytes (f16)\n\tlayers := f.KV().BlockCount()\n\tkvHeads := f.KV().HeadCountKVMin()\n\tif kvHeads == 0 {\n\t\tkvHeads = 1\n\t}\n\theadDim := uint64(0)\n\tif f.KV().HeadCountMax() \u003e 0 {\n\t\theadDim = f.KV().EmbeddingLength() / f.KV().HeadCountMax()\n\t}\n\tkvCache := 2 * layers * kvHeads * headDim * uint64(numCtx) * 2\n\n\treturn weights + kvCache\n}"},{"id":"llm/llama_server.go:350:29","name":"(*llamaServerRunner).ContextLength","kind":"method","file":"llm/llama_server.go","line":350,"endLine":352,"source":"func (s *llamaServerRunner) ContextLength() int {\n\treturn s.options.NumCtx\n}"},{"id":"llm/llama_server.go:627:6","name":"LlamaServerFlashAttention","kind":"func","file":"llm/llama_server.go","line":627,"endLine":641,"source":"func LlamaServerFlashAttention(gpus []ml.DeviceInfo) ml.FlashAttentionType {\n\tenabled := envconfig.FlashAttention(false)\n\tuserSet := enabled == envconfig.FlashAttention(true)\n\tif userSet {\n\t\tif enabled {\n\t\t\treturn ml.FlashAttentionEnabled\n\t\t}\n\t\treturn ml.FlashAttentionDisabled\n\t}\n\n\tif !ml.FlashAttentionSupported(gpus) {\n\t\treturn ml.FlashAttentionDisabled\n\t}\n\treturn ml.FlashAttentionAuto\n}"},{"id":"llm/llama_server.go:94:6","name":"LlamaServerBatch","kind":"func","file":"llm/llama_server.go","line":94,"endLine":109,"source":"func LlamaServerBatch(f *gguf.Model, opts api.Options, completion bool) (int, uint64) {\n\tbatch := opts.NumBatch\n\t// These decision heads read the whole prompt without a KV cache, so the\n\t// physical batch must hold the entire effective context.\n\twholePrompt := f.KV().Uint(\"decision.block_count\") \u003e 0\n\tif wholePrompt {\n\t\tbatch = opts.NumCtx\n\t\tif trainCtx := int(f.KV().ContextLength()); trainCtx \u003e 0 {\n\t\t\tbatch = min(batch, trainCtx)\n\t\t}\n\t}\n\tif !completion \u0026\u002
