<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Map</title>
<style>
  :root { color-scheme: light dark;
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
    --added: #1f8a4c; --added-bg: #e3f4ea; --modified: #b8620b; --modified-bg: #fcefdf;
    --caller: #3b5bdb; --caller-bg: #e8edfd; --pkg-bg: #efefeb; --code-bg: #fafaf8; --hl: #fff2c2;
    --note-bg: #f3f0ff; --note-line: #7c5cff; --removed: #c92a2a; --removed-bg: #fdecec;
    --grid: #d3d3cc; --hud: rgba(255, 255, 255, .86); --shadow: 0 6px 24px rgba(0, 0, 0, .10);
    --entry: #0b8a8a; --entry-bg: #dff3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --ink: #ececea; --muted: #9a9a94; --line: #34342f;
      --added: #4cc27e; --added-bg: #193323; --modified: #f0a050; --modified-bg: #3a2915;
      --caller: #8ea4ff; --caller-bg: #1e2647; --pkg-bg: #222220; --code-bg: #191918; --hl: #3d3517;
      --note-bg: #26213d; --note-line: #a58cff; --removed: #ff8787; --removed-bg: #3d1d1d;
      --grid: #2e2e2a; --hud: rgba(30, 30, 28, .86); --shadow: 0 6px 24px rgba(0, 0, 0, .45);
      --entry: #3cc9c4; --entry-bg: #16302f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px;
    align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 a:hover { text-decoration: underline; }
  header .meta { color: var(--muted); font-size: 13px; }
  header code { font-size: 12px; }
  .legend { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .l-added::before { background: var(--added); }
  .legend .l-top { cursor: help; }
  .legend .l-top::before { content: "★"; width: auto; height: auto; color: var(--modified); font-size: 13px; vertical-align: 0; }
  .legend .l-modified::before { background: var(--modified); }
  .legend .l-caller::before { background: var(--caller); }
  .legend .l-entry::before { background: var(--entry); }
  .legend .toggle { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--ink); }
  .legend .toggle input { margin: 0; }
  main { display: flex; flex: 1; min-height: 0; }
  #stage { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  #map { position: absolute; inset: 0; display: block; cursor: grab; touch-action: none; }
  #map.dragging { cursor: grabbing; }
   
  .hud { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 8px; user-select: none; }
  .hud .group { display: flex; background: var(--hud); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 3px; }
  .hud button { border: 0; background: transparent; border-radius: 7px; padding: 5px 11px; font-size: 12px;
    color: var(--muted); font-weight: 500; transition: background .2s, color .2s; }
  .hud button:hover { color: var(--ink); }
  .hud button.on { background: var(--ink); color: var(--panel); }
  .hud .zoom button { min-width: 30px; padding: 5px 8px; font-size: 14px; }
  .hud .zoom button[data-zoom=fit] { font-size: 12px; }
  #tip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--hud);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow); padding: 6px 10px; font-size: 12px; display: flex;
    flex-direction: column; max-width: 360px; }
  #tip[hidden] { display: none; }
  #tip b { font: 600 12px ui-monospace, Menlo, monospace; word-break: break-all; }
  #tip span { color: var(--muted); font-size: 11px; }
  #ports { position: absolute; left: 0; top: 0; z-index: 5; background: var(--hud);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow); padding: 6px 0; font-size: 12px;
    max-width: 420px; max-height: 50%; overflow: auto; }
  #ports[hidden] { display: none; }
  #ports .head { padding: 2px 12px 6px; color: var(--muted); font-size: 11px; }
  #ports .head b { color: var(--ink); font: 600 11px ui-monospace, Menlo, monospace; }
  #ports ul { list-style: none; margin: 0; padding: 0; }
  #ports li { display: flex; flex-direction: column; gap: 1px; padding: 5px 12px; cursor: pointer; }
  #ports li:hover { background: var(--caller-bg); }
  #ports .loc { color: var(--muted); font: 11px ui-monospace, Menlo, monospace; }
  .kind { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  button.mini { font-size: 11px; padding: 1px 8px; margin-left: 8px; text-transform: none; letter-spacing: 0; vertical-align: 1px; }
  aside { width: min(600px, 42vw); min-width: 320px; background: var(--panel);
    overflow: auto; padding: 16px; }
  aside.wide { width: min(1100px, 70vw); }
  #split { width: 6px; flex: none; cursor: col-resize; background: var(--line); }
  #split:hover, #split.dragging { background: var(--muted); }
  aside h2 { font-size: 15px; margin: 0 0 4px; word-break: break-word; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    margin: 18px 0 6px; }
  aside p { margin: 6px 0; }
  .prose code, .note code { font: 12px ui-monospace, Menlo, monospace; background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 600; }
  .badge.added { color: var(--added); background: var(--added-bg); }
  .badge.modified { color: var(--modified); background: var(--modified-bg); }
  .badge.caller { color: var(--caller); background: var(--caller-bg); }
  .badge.exported { color: var(--muted); border: 1px solid var(--line); }
  .badge.entry { color: var(--entry); background: var(--entry-bg); }
  .top { color: var(--modified); }
  .entry-pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px;
    border-radius: 8px; color: var(--panel); background: var(--entry); vertical-align: 1px; text-transform: uppercase; }
  .entry-pill.root { background: var(--muted); }
  li.group > div[data-id] { cursor: pointer; }
  li.group > div[data-id]:hover > .name { color: var(--caller); }
  li.group details { margin: 4px 0 0 12px; font-size: 12px; }
  li.group details summary { color: var(--muted); cursor: pointer; }
  li.group details ul.links li:last-child { border-bottom: 0; }
   
  pre .ref { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-color: var(--muted); }
  pre .ref:hover { text-decoration: underline solid; text-decoration-color: var(--caller); background: var(--caller-bg); border-radius: 2px; }
  .badge.unchanged { color: var(--muted); border: 1px solid var(--line); }
  .path { color: var(--muted); font: 12px ui-monospace, Menlo, monospace; word-break: break-all; }
  .loc { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; word-break: break-all; }
  .note { background: var(--note-bg); border-left: 3px solid var(--note-line); border-radius: 4px;
    padding: 8px 10px; margin: 10px 0; }
  .note.small { margin: 4px 0 0; padding: 4px 8px; font-size: 13px; }
  pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; margin: 0;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: auto; padding: 6px 0; tab-size: 4; }
   
  .src-path { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
    background: var(--code-bg); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 6px 6px 0 0; padding: 5px 10px; user-select: all; }
  .src-path + pre { border-top-left-radius: 0; border-top-right-radius: 0; }
  pre .ln { display: block; padding: 0 10px; white-space: pre; }
  pre .ln.chg { background: var(--added-bg); box-shadow: inset 3px 0 var(--added); }
  pre.src .ln.del { background: var(--removed-bg); box-shadow: inset 3px 0 var(--removed); }
  pre.src .ln.del .gone { color: var(--removed); }
   
  pre .ln.hl { background: var(--hl); }
   
  @media (prefers-color-scheme: dark) { pre.src .code span { color: var(--shiki-dark) !important; } }
  pre .no, pre .gone { color: var(--muted); display: inline-block; width: 3.5em; user-select: none; }
  ul.links { list-style: none; padding: 0; margin: 0; }
  ul.links li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  ul.links li[data-id], ul.links li[data-theme] { cursor: pointer; }
  ul.links li[data-id]:hover > .name, ul.links li[data-theme]:hover .title { color: var(--caller); }
  .empty { color: var(--muted); }
  .file { border-bottom: 1px solid var(--line); padding: 5px 0; }
  .file-name { font: 12px ui-monospace, Menlo, monospace; word-break: break-all; }
  details.file > summary { cursor: pointer; }
  details.file > summary:hover { color: var(--caller); }
  details.file pre { margin-top: 6px; }
  .add-count { color: var(--added); }
  .del-count { color: var(--removed); }
  .badge.deleted { color: var(--removed); background: var(--removed-bg); }
  pre.diff .ln.add { background: var(--added-bg); }
  pre.diff .ln.del { background: var(--removed-bg); }
  pre.diff .ln.hunk { color: var(--muted); }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .themes .title { font-weight: 600; }
  .themes .sum { color: var(--muted); font-size: 13px; margin-top: 2px; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--note-line); border-color: var(--note-line); color: #fff; }
  .tour-nav { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
  .tour-nav .count { color: var(--muted); font-size: 12px; margin-right: auto; }
  .back { color: var(--muted); font-size: 12px; cursor: pointer; margin-bottom: 8px; display: inline-block; }
  .back:hover { color: var(--ink); }
   
  .hud .group:has(> [hidden]:only-child) { display: none; }
  #stage.commenting::after { content: "Click anywhere on the map to ask about it · Esc to cancel"; position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%); background: var(--note-line); color: #fff; font-size: 12px;
    padding: 5px 12px; border-radius: 14px; box-shadow: var(--shadow); pointer-events: none; }
  .anchor { margin: 4px 0 8px; }
  .anchor [data-goto] { cursor: pointer; font-weight: 600; }
  .anchor [data-goto]:hover { color: var(--caller); }
  pre.excerpt { margin-bottom: 12px; }
  pre.src.askable .no { cursor: pointer; }
  pre.src.askable .no:hover { color: var(--note-line); text-decoration: underline; }
  .hint { color: var(--muted); font-family: ui-sans-serif, -apple-system, sans-serif; font-size: 11px; user-select: none; }
  .thread { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 12px; }
  .msg { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .msg.claude { background: var(--note-bg); border-color: transparent; border-left: 3px solid var(--note-line); }
  .msg .who { font-size: 12px; font-weight: 600; }
  .msg .who span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .msg .prose p:first-child { margin-top: 2px; }
  .waiting { color: var(--muted); font-size: 12px; font-style: italic; }
  .error { color: var(--removed); font-size: 12px; }
  textarea { width: 100%; font: inherit; color: var(--ink); background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--note-line); outline-offset: -1px; border-color: transparent; }
  .state { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px;
    border-radius: 8px; vertical-align: 1px; }
  .state.open { color: #fff; background: var(--note-line); }
  .state.answered { color: var(--caller); background: var(--caller-bg); }
  .state.resolved { color: var(--muted); border: 1px solid var(--line); }
  ul.links li[data-thread] { cursor: pointer; }
  ul.links li[data-thread]:hover { color: var(--caller); }
  @media (max-width: 760px) {
    body { display: block; height: auto; }
    main { flex-direction: column; }
    #stage { height: 60vh; flex: none; }
    aside { width: auto !important; min-width: 0; border-top: 1px solid var(--line); }
    #split { display: none; }
    .legend { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">PR Map</h1>
  <div class="meta" id="meta"></div>
  <div class="legend">
    <span class="l-added">added</span><span class="l-modified">modified</span><span class="l-caller">uses a change</span><span class="l-entry">entry point</span><span class="l-top" title="A changed function that no other changed function calls, directly or through other code. Start reviewing here. A package shows how many it holds.">start here</span>
    <label class="toggle"><input type="checkbox" id="show-tests"> show tests</label>
  </div>
</header>
<main>
  <div id="stage">
    <canvas id="map"></canvas>
    <div class="hud">
      <div class="group levels">
        <button data-level="packages">Packages</button><button data-level="decls">Declarations</button><button data-level="code">Code</button>
      </div>
      <div class="group zoom">
        <button data-zoom="out" title="Zoom out (−)">−</button><button data-zoom="fit" title="Fit (0)">Fit</button><button data-zoom="in" title="Zoom in (+)">+</button>
      </div>
      <div class="group">
        <button id="comment-btn" title="Drop a question on the map (C)" hidden>Comment</button>
      </div>
    </div>
    <div id="tip" hidden></div>
    <div id="ports" hidden></div>
  </div>
  <div id="split" title="Drag to resize"></div>
  <aside id="panel"></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>

s the user asks.\n-\n-## 1. Get the code at the PR head\n-\n-- **PR URL, `owner/repo#N`, or `N`:** read the PR:\n-  `gh pr view \u003cN\u003e -R \u003cowner/repo\u003e --json title,body,baseRefOid,headRefOid,files`.\n-  Clone once to `~/.cache/map-pr/repos/\u003cowner\u003e/\u003crepo\u003e`\n-  (`gh repo clone \u003cowner/repo\u003e \u003cdir\u003e -- --filter=blob:none`), then\n-  `git fetch origin pull/\u003cN\u003e/head:pr-\u003cN\u003e \u0026\u0026 git checkout pr-\u003cN\u003e`.\n-  The base is `baseRefOid`.\n-- **No argument:** use the current repo and branch. The base is the default\n-  branch (`gh repo view --json defaultBranchRef`), or what the user names.\n-\n-## 2. Install map-pr with the repo's Go toolchain, and run it\n-\n-map-pr type-checks with the `go/types` of the Go that builds it, so build it\n-with the toolchain the repo asks for. `+auto` lets Go pick a newer toolchain\n-when map-pr itself needs one. Install it per map, in `$OUT/bin`:\n-\n-```sh\n-GOV=$(go -C \u003crepo\u003e env GOVERSION)\n-GOBIN=$OUT/bin GOTOOLCHAIN=$GOV+auto go install github.com/jpoz/map-pr@latest\n-M=$OUT/bin/map-pr\n-$M -C \u003crepo\u003e -base \u003cbase\u003e -format json -o $OUT/map.json\n-$M -from $OUT/map.json -format outline -o $OUT/outline.txt\n-```\n-\n-(To work on map-pr itself, or before it is on a module proxy, build a checkout\n-instead: `GOTOOLCHAIN=$GOV+auto go -C \u003ccheckout\u003e build -o $OUT/bin/map-pr .`)\n-\n-Look at stderr: type errors mean the toolchain or modules are wrong. Fix them\n-before you go on; a map built on broken types misses callers.\n-\n-If there are no changed Go declarations, tell the user and stop.\n-\n-## 3. Understand the PR\n-\n-Read, in this order:\n-1. The PR title and body (if there is one).\n-2. `$OUT/outline.txt`: every changed declaration with its **key**, kind, status,\n-   changed line count and users, then non-Go and deleted files.\n-3. The diff of the production code: `git -C \u003crepo\u003e diff \u003cmerge-base\u003e -- \u003cfiles\u003e`.\n-   Start with schema/migration and query files, then the functions with the\n-   most callers or the most changed lines. Skip tests until the end.\n-\n-Check every claim you will write against the diff. If the PR body says\n-something, find it in the code. Do not guess from names.\n-\n-The outline's ENTRY POINTS section lists where execution starts and reaches\n-the changes: HTTP routes, `main`, goroutines, and code with no callers outside\n-tests. Use it to find how a user or service reaches the change. A changed\n-function with \"no callers\" is either called through an interface or not used\n-yet; say which.\n-\n-Look especially for:\n-- **Behavior changes** vs renames and refactors (say which).\n-- **Removed safety:** deleted checks, gates, approvals, locks.\n-- **Deleted code** — map-pr does not show deleted declarations yet, so name them\n-  in the tour text.\n-- **Entry points** a user or other service reaches: routes, CLI commands, tool\n-  definitions, workers. Exported functions may have callers outside the repo.\n-- **Migrations and rollout:** what happens to existing data, and to old and new\n-  versions running at the same time.\n-\n-## 4. Write `$OUT/notes.json`\n-\n-```json\n-{\n-  \"title\": \"repo #N · PR title\",\n-  \"summary\": \"2 short paragraphs: what changes and why, for someone who has not seen the PR.\",\n-  \"themes\": [\n-    {\n-      \"id\": \"short-id\",\n-      \"title\": \"4–8 words\",\n-      \"summary\": \"First paragraph shows on the overview. More paragraphs show when the theme is open.\",\n-      \"nodes\": [\"\u003ckey from outline\u003e\", \"...\"],\n-      \"files\": [\"non-Go files that belong to this theme\"]\n-    }\n-  ],\n-  \"tour\": [\n-    {\n-      \"title\": \"Short title\",\n-      \"theme\": \"short-id (optional)\",\n-      \"body\": \"What to look at and why. Use **Review here:** or **Check:** for what a reviewer must decide.\",\n-      \"nodes\": [\"2–6 keys to show for this step\"],\n-      \"files\": [\"optional\"]\n-    }\n-  ],\n-  \"nodes\": { \"\u003ckey\u003e\": \"1–2 sentences on what changed in this function and why it matters.\" }\n-}\n-```\n-\n-Rules:\n-- **Keys** must be copied exactly from the outline (`file:Name`, e.g.\n-  `internal/store/flow.go:(*Store).Save`).\n-- **Files** must be exact paths of files the PR changes or deletes (no notes\n-  after the path). The page shows each file's diff: open by default in a tour\n-  step with no nodes, on click everywhere else. Use a files-only step for a\n-  migration, a query file, or a deleted file whose removed code matters.\n-- **Themes:** 3–7. Put every changed code declaration into one theme. Order them\n-  the way the change flows (data → logic → entry points → surfaces).\n-- **Tour:** 5–10 steps in reading order. Step 1 is the idea in plain words\n-  (no nodes is fine). Step 2 is often where to start: the entry points that reach the\n-  most changes (keys from the outline's ENTRY POINTS). Each later step shows a small set of nodes that call each\n-  other, so the focused view draws a readable graph. End with what was deleted\n-  or what is not on the map.\n-- **Node notes:** for the 8–20 declarations that matter most. Start with the kind\n-  of change in bold when it helps (**Behavior change:**, **Renamed:**, **New:**).\n-- Text supports `` `code` ``, `**bold**` and blank-line paragraphs only.\n-- Plain, short sentences. No praise, no filler.\n-\n-## 5. Build the page and check it\n-\n-```sh\n-$M -from $OUT/map.json -notes $OUT/notes.json -o $OUT/pr-map.html\n-```\n-\n-map-pr refuses notes that name a key or theme that is not on the map and lists\n-each problem. Fix `notes.json` and run it again until it passes.\n-\n-If browser tools are available, look at the page through the server from\n-step 6 (a browser tool may refuse `file://`) and step through the tour. A step whose declarations sit in\n-packages far apart opens at the package level with labeled pins; one in a\n-single package opens at the declaration level. Prefer steps of the second\n-kind: pick declarations that call each other.\n-\n-## 6. Serve it, and answer questions\n-\n-Serve the page so the reader can drop questions on it, and watch for them:\n-\n-```sh\n-$M serve -dir $OUT -addr 127.0.0.1:8770    # run in the background\n-$M comments -dir $OUT -watch               # watch it, e.g. with the Monitor tool\n-```\n-\n-If port 8770 is taken, pick another and use it in the URL below.\n-\n-Each line from `-watch` is a new question: `[ID] \u003cnode key\u003e line N: \u003ctext\u003e`.\n-For each one:\n-1. Run `$M comments -dir $OUT` to see the whole thread.\n-2. Read the code at that place in the repo (and the diff), not only the map.\n-3. Answer with `$M reply -dir $OUT -id ID -` and the text on stdin.\n-   Same Markdown as the notes, plus line breaks. Say what you checked; say\n-   when something is a guess. Use `-resolve` only when the reader asks.\n-\n-The reader sees the answer in the page within a few seconds. Re-arm the\n-Monitor when it expires while the reader still uses the map.\n-\n-## 7. Hand it over\n-\n-Open the served URL (`http://127.0.0.1:8770/pr-map.html`). Tell the user the path, the themes in one line\n-each, and the 2–4 things a reviewer must decide (from your **Review here** and\n-**Check** points).","skills/map-pr/SKILL.md":"@@ -0,0 +1,168 @@\n+---\n+name: map-pr\n+description: Build an interactive, zoomable map of a Go pull request — the declarations it changes (functions, methods, types, constants, variables), the code that uses them, plus Claude-written themes, a guided tour, and per-declaration notes — as one HTML page. Use when the user asks to map, visualize, or explain a PR \"as a map\", or runs /map-pr with a PR URL, number, or nothing (current branch).\n+argument-hint: \"[PR URL | owner/repo#N | N | empty for current branch]\"\n+---\n+\n+# map-pr\n+\n+`map-pr` (github.com/jpoz/map-pr) finds the changed Go declarations and their\n+users with type information. You add the meaning: themes, a tour and notes.\n+map-pr puts both on one HTML page.\n+\n+Needs: Go, git, and `gh` (logged in) for PRs on GitHub.\n+\n+Work in `~/.cache/map-pr/\u003crepo\u003e-\u003cpr\u003e/` (call it `$OUT`). Keep private code on\n+this machine: never publish the page or the notes anywhere unless the user asks.\n+\n+## 1. Get the code at the PR head\n+\n+- **PR URL, `owner/repo#N`, or `N`:** read the PR:\n+  `gh pr view \u003cN\u003e -R \u003cowner/repo\u003e --json title,body,baseRefOid,headRefOid,files`.\n+  Clone once to `~/.cache/map-pr/repos/\u003cowner\u003e/\u003crepo\u003e`\n+  (`gh repo clone \u003cowner/repo\u003e \u003cdir\u003e -- --filter=blob:none`), then\n+  `git fetch origin pull/\u003cN\u003e/head:pr-\u003cN\u003e \u0026\u0026 git checkout pr-\u003cN\u003e`.\n+  The base is `baseRefOid`.\n+- **No argument:** use the current repo and branch. The base is the default\n+  branch (`gh repo view --json defaultBranchRef`), or what the user names.\n+\n+## 2. Install map-pr with the repo's Go toolchain, and run it\n+\n+map-pr type-checks with the `go/types` of the Go that builds it, so build it\n+with the toolchain the repo asks for. `+auto` lets Go pick a newer toolchain\n+when map-pr itself needs one. Install it per map, in `$OUT/bin`:\n+\n+```sh\n+GOV=$(go -C \u003crepo\u003e env GOVERSION)\n+GOBIN=$OUT/bin GOTOOLCHAIN=$GOV+auto go install github.com/jpoz/map-pr@latest\n+M=$OUT/bin/map-pr\n+$M -C \u003crepo\u003e -base \u003cbase\u003e -format json -o $OUT/map.json\n+$M -from $OUT/map.json -format outline -o $OUT/outline.txt\n+```\n+\n+(To work on map-pr itself, or before it is on a module proxy, build a checkout\n+instead: `GOTOOLCHAIN=$GOV+auto go -C \u003ccheckout\u003e build -o $OUT/bin/map-pr .`)\n+\n+Look at stderr: type errors mean the toolchain or modules are wrong. Fix them\n+before you go on; a map built on broken types misses callers.\n+\n+If there are no changed Go declarations, tell the user and stop.\n+\n+## 3. Understand the PR\n+\n+Read, in this order:\n+1. The PR title and body (if there is one).\n+2. `$OUT/outline.txt`: every changed declaration with its **key**, kind, status,\n+   changed line count and users, then non-Go and deleted files.\n+3. The diff of the production code: `git -C \u003crepo\u003e diff \u003cmerge-base\u003e -- \u003cfiles\u003e`.\n+   Start with schema/migration and query files, then the functions with the\n+   most callers or the most changed lines. Skip tests until the end.\n+\n+Check every claim you will write against the diff. If the PR body says\n+something, find it in the code. Do not guess from names.\n+\n+The outline's ENTRY POINTS section lists where execution starts and reaches\n+the changes: HTTP routes, `main`, goroutines, and code with no callers outside\n+tests. Use it to find how a user or service reaches the change. A changed\n+function with \"no callers\" is either called through an interface or not used\n+yet; say which.\n+\n+Look especially for:\n+- **Behavior changes** vs renames and refactors (say which).\n+- **Removed safety:** deleted checks, gates, approvals, locks.\n+- **Deleted code** — map-pr does not show deleted declarations yet, so name them\n+  in the tour text.\n+- **Entry points** a user or other service reaches: routes, CLI commands, tool\n+  definitions, workers. Exported functions may have callers outside the repo.\n+- **Migrations and rollout:** what happens to existing data, and to old and new\n+  versions running at the same time.\n+\n+## 4. Write `$OUT/notes.json`\n+\n+```json\n+{\n+  \"title\": \"repo #N · PR title\",\n+  \"summary\": \"2 short paragraphs: what changes and why, for someone who has not seen the PR.\",\n+  \"themes\": [\n+    {\n+      \"id\": \"short-id\",\n+      \"title\": \"4–8 words\",\n+      \"summary\": \"First paragraph shows on the overview. More paragraphs show when the theme is open.\",\n+      \"nodes\": [\"\u003ckey from outline\u003e\", \"...\"],\n+      \"files\": [\"non-Go files that belong to this theme\"]\n+    }\n+  ],\n+  \"tour\": [\n+    {\n+      \"title\": \"Short title\",\n+      \"theme\": \"short-id (optional)\",\n+      \"body\": \"What to look at and why. Use **Review here:** or **Check:** for what a reviewer must decide.\",\n+      \"nodes\": [\"2–6 keys to show for this step\"],\n+      \"files\": [\"optional\"]\n+    }\n+  ],\n+  \"nodes\": { \"\u003ckey\u003e\": \"1–2 sentences on what changed in this function and why it matters.\" }\n+}\n+```\n+\n+Rules:\n+- **Keys** must be copied exactly from the outline (`file:Name`, e.g.\n+  `internal/store/flow.go:(*Store).Save`).\n+- **Files** must be exact paths of files the PR changes or deletes (no notes\n+  after the path). The page shows each file's diff: open by default in a tour\n+  step with no nodes, on click everywhere else. Use a files-only step for a\n+  migration, a query file, or a deleted file whose removed code matters.\n+- **Themes:** 3–7. Put every changed code declaration into one theme. Order them\n+  the way the change flows (data → logic → entry points → surfaces).\n+- **Tour:** 5–10 steps in reading order. Step 1 is the idea in plain words\n+  (no nodes is fine). Step 2 is often where to start: the entry points that reach the\n+  most changes (keys from the outline's ENTRY POINTS). Each later step shows a small set of nodes that call each\n+  other, so the focused view draws a readable graph. End with what was deleted\n+  or what is not on the map.\n+- **Node notes:** for the 8–20 declarations that matter most. Start with the kind\n+  of change in bold when it helps (**Behavior change:**, **Renamed:**, **New:**).\n+- Text supports `` `code` ``, `**bold**` and blank-line paragraphs only.\n+- Plain, short sentences. No praise, no filler.\n+\n+## 5. Build the page and check it\n+\n+```sh\n+$M -from $OUT/map.json -notes $OUT/notes.json -o $OUT/pr-map.html\n+```\n+\n+map-pr refuses notes that name a key or theme that is not on the map and lists\n+each problem. Fix `notes.json` and run it again until it passes.\n+\n+If browser tools are available, look at the page through the server from\n+step 6 (a browser tool may refuse `file://`) and step through the tour. A step whose declarations sit in\n+packages far apart opens at the package level with labeled pins; one in a\n+single package opens at the declaration level. Prefer steps of the second\n+kind: pick declarations that call each other.\n+\n+## 6. Serve it, and answer questions\n+\n+Serve the page so the reader can drop questions on it, and watch for them:\n+\n+```sh\n+$M serve -dir $OUT -addr 127.0.0.1:8770    # run in the background\n+$M comments -dir $OUT -watch               # watch it, e.g. with the Monitor tool\n+```\n+\n+If port 8770 is taken, pick another and use it in the URL below.\n+\n+Each line from `-watch` is a new question: `[ID] \u003cnode key\u003e line N: \u003ctext\u003e`.\n+For each one:\n+1. Run `$M comments -dir $OUT` to see the whole thread.\n+2. Read the code at that place in the repo (and the diff), not only the map.\n+3. Answer with `$M reply -dir $OUT -id ID -` and the text on stdin.\n+   Same Markdown as the notes, plus line breaks. Say what you checked; say\n+   when something is a guess. Use `-resolve` only when the reader asks.\n+\n+The reader sees the answer in the page within a few seconds. Re-arm the\n+Monitor when it expires while the reader still uses the map.\n+\n+## 7. Hand it over\n+\n+Open the served URL (`http://127.0.0.1:8770/pr-map.html`). Tell the user the path, the themes in one line\n+each, and the 2–4 things a reviewer must decide (from your **Review here** and\n+**Check** points)."},"stats":{"README.md":{"added":5,"deleted":5},"internal/callgraph/callgraph.go":{"added":156,"deleted":7},"internal/callgraph/callgraph_test.go":{"added":155,"deleted":0},"internal/gitdiff/gitdiff.go":{"added":36,"deleted":18},"internal/gitdiff/gitdiff_test.go":{"added":8,"deleted":2},"internal/render/page/app.js":{"added":55,"deleted":6},"internal/ ines-1)\n\t\tm.Defs = append(m.Defs, \u0026Def{\n\t\t\tID: n.ID, Name: n.Name, Kind: n.Kind, File: n.File, Line: n.Line, EndLine: n.EndLine,\n\t\t\tSource: readLines(filepath.Join(root, n.File), n.Line, end),\n\t\t})\n\t}\n\tsort.Slice(m.Defs, func(i, j int) bool { return m.Defs[i].ID \u003c m.Defs[j].ID })\n\n\tm.Uses = map[string][]Use{}\n\tfor from, tos := range uses {\n\t\tif !onMap[from] \u0026\u0026 !defs[from] {\n\t\t\tcontinue\n\t\t}\n\t\tfor to, lines := range tos {\n\t\t\tif onMap[to] || defs[to] {\n\t\t\t\tsort.Ints(lines)\n\t\t\t\tm.Uses[from] = append(m.Uses[from], Use{To: to, Lines: slices.Compact(lines)})\n\t\t\t}\n\t\t}\n\t\tsort.Slice(m.Uses[from], func(i, j int) bool { return m.Uses[from][i].To \u003c m.Uses[from][j].To })\n\t}\n}"},{"id":"internal/callgraph/callgraph.go:60:2","name":"KindFunc","kind":"const","file":"internal/callgraph/callgraph.go","line":60,"endLine":60,"source":"\tKindFunc   Kind = \"func\""},{"id":"internal/callgraph/callgraph.go:61:2","name":"KindMethod","kind":"const","file":"internal/callgraph/callgraph.go","line":61,"endLine":61,"source":"\tKindMethod Kind = \"method\""},{"id":"internal/callgraph/callgraph.go:62:2","name":"KindType","kind":"const","file":"internal/callgraph/callgraph.go","line":62,"endLine":62,"source":"\tKindType   Kind = \"type\""},{"id":"internal/callgraph/callgraph.go:63:2","name":"KindConst","kind":"const","file":"internal/callgraph/callgraph.go","line":63,"endLine":63,"source":"\tKindConst  Kind = \"const\""},{"id":"internal/callgraph/callgraph.go:64:2","name":"KindVar","kind":"const","file":"internal/callgraph/callgraph.go","line":64,"endLine":64,"source":"\tKindVar    Kind = \"var\""},{"id":"internal/callgraph/callgraph.go:662:6","name":"reachFromEntries","kind":"func","file":"internal/callgraph/callgraph.go","line":662,"endLine":700,"source":"func reachFromEntries(onMap map[string]bool, decls map[string]*declInfo, refs map[string]map[ref]bool, entryOf func(string) *Entry) []*Edge {\n\t// A walk follows calls: it starts at functions and methods, and a type\n\t// that names one does not call it.\n\tisFunc := func(id string) bool { k := decls[id].node.Kind; return k == KindFunc || k == KindMethod }\n\tstarts := make([]string, 0, len(onMap))\n\tfor id := range onMap {\n\t\tif !decls[id].node.IsTest \u0026\u0026 isFunc(id) \u0026\u0026 entryOf(id) == nil {\n\t\t\tstarts = append(starts, id)\n\t\t}\n\t}\n\tsort.Strings(starts)\n\tvar out []*Edge\n\tfor _, start := range starts {\n\t\tparent := map[string]string{start: \"\"}\n\t\tfrontier := []string{start}\n\t\tfor hop := 0; hop \u003c= maxEntryHops \u0026\u0026 len(frontier) \u003e 0; hop++ {\n\t\t\tvar next []string\n\t\t\tfor _, id := range frontier {\n\t\t\t\tfor _, from := range callerIDs(refs[id], decls) {\n\t\t\t\t\tif _, seen := parent[from]; seen || onMap[from] || decls[from].node.Kind == KindType {\n\t\t\t\t\t\tcontinue\n\t\t\t\t\t}\n\t\t\t\t\tparent[from] = id\n\t\t\t\t\tif entryOf(from) != nil {\n\t\t\t\t\t\tvia := []string{}\n\t\t\t\t\t\tfor p := id; p != start; p = parent[p] {\n\t\t\t\t\t\t\tvia = append(via, decls[p].node.Name)\n\t\t\t\t\t\t}\n\t\t\t\t\t\tout = append(out, \u0026Edge{From: from, To: start, Via: via})\n\t\t\t\t\t\tcontinue\n\t\t\t\t\t}\n\t\t\t\t\tnext = append(next, from)\n\t\t\t\t}\n\t\t\t}\n\t\t\tfrontier = next\n\t\t}\n\t}\n\treturn out\n}"},{"id":"internal/callgraph/callgraph.go:703:7","name":"maxEntries","kind":"const","file":"internal/callgraph/callgraph.go","line":703,"endLine":703,"source":"const maxEntries = 20"},{"id":"internal/callgraph/callgraph.go:710:6","name":"pickEntries","kind":"func","file":"internal/callgraph/callgraph.go","line":710,"endLine":813,"source":"func pickEntries(cands []*Edge, edges map[[2]string]*Edge, decls map[string]*declInfo, entry func(string) *Entry, limit int) []*Edge {\n\tdown := map[string][]string{}\n\tfor _, e := range edges {\n\t\tdown[e.From] = append(down[e.From], e.To)\n\t}\n\tbyEntry := map[string][]*Edge{}\n\tfor _, e := range cands {\n /gitdiff.go:33:6","lines":[106]},{"to":"internal/gitdiff/gitdiff.go:39:6","lines":[53,111]}],"internal/gitdiff/gitdiff_test.go:9:6":[{"to":"internal/gitdiff/gitdiff.go:181:6","lines":[38]}],"internal/render/render.go:59:6":[{"to":"internal/callgraph/callgraph.go:118:6","lines":[59]},{"to":"internal/callgraph/callgraph.go:33:2","lines":[89]},{"to":"internal/callgraph/callgraph.go:41:2","lines":[80]},{"to":"internal/callgraph/callgraph.go:45:2","lines":[84]},{"to":"internal/callgraph/callgraph.go:68:6","lines":[59,60]}],"internal/render/render.go:99:6":[{"to":"internal/callgraph/callgraph.go:107:6","lines":[104]},{"to":"internal/callgraph/callgraph.go:118:6","lines":[99]},{"to":"internal/callgraph/callgraph.go:30:2","lines":[112,114]},{"to":"internal/callgraph/callgraph.go:33:2","lines":[114]},{"to":"internal/callgraph/callgraph.go:68:6","lines":[100,109,121]},{"to":"internal/render/render.go:59:6","lines":[156]}],"main.go:104:6":[{"to":"internal/callgraph/callgraph.go:118:6","lines":[104,110]},{"to":"internal/callgraph/callgraph.go:157:6","lines":[104]},{"to":"internal/callgraph/callgraph.go:180:6","lines":[120]},{"to":"internal/gitdiff/gitdiff.go:53:6","lines":[116]}],"main.go:22:6":[{"to":"main.go:29:6","lines":[23]}],"main.go:29:6":[{"to":"internal/callgraph/callgraph.go:157:6","lines":[53]},{"to":"internal/render/render.go:99:6","lines":[87]},{"to":"main.go:104:6","lines":[53]}]}};
window.MAPR_NOTES = {"title":"map-pr #2 · Map features: removed lines, links, callers, locals, and more","url":"https://github.com/jpoz/map-pr/pull/2","summary":"This PR gives the map more to show for each changed declaration. The diff parser now keeps the text of deleted lines, so a card shows removed and added lines as GitHub does. The call graph marks the **start-here** functions (★): changed functions that no other changed function reaches. It also records every use of each local name, so the page can mark them all when you hover one.\n\nThe page gets the rest: click a name to go to its declaration, hover an arrow end to list its callers, larger arrows drawn in front of the cards, sideways scroll for long lines, and full file paths on the cards. The skill is renamed from `/make-pr-map` to `/map-pr`.","themes":[{"id":"diff","title":"Keep the text of deleted lines","summary":"`gitdiff.Parse` now stores each deleted line, keyed by the new line it came before. It counts the lines of each hunk, so a deleted line that starts with `--- ` is not read as a file header.\n\nA pure deletion no longer marks the line before it as changed. A declaration counts as changed when it has removed lines inside it.","nodes":["internal/gitdiff/gitdiff.go:FileChange","internal/gitdiff/gitdiff.go:Parse","internal/gitdiff/gitdiff.go:count","internal/gitdiff/gitdiff.go:hunkHeader","internal/gitdiff/gitdiff.go:Load"]},{"id":"graph","title":"New facts on each node","summary":"`callgraph.Build` adds three fields to each `Node`: `Removed` (deleted lines inside it), `Top` (a start-here function) and `Locals` (the uses of each local name).\n\nThe helpers are small and each has a test: `removedIn`, `markTops`, `localsIn`, `localObject` and `localGroups`.","nodes":["internal/callgraph/callgraph.go:Build","internal/callgraph/callgraph.go:Node","internal/callgraph/callgraph.go:Span","internal/callgraph/callgraph.go:removedIn","internal/callgraph/callgraph.go:markTops","internal/callgraph/callgraph.go:localsIn","internal/callgraph/callgraph.go:localObject","internal/callgraph/callgraph.go:localGroups"]},{"id":"page","title":"Page: links, callers, locals, scroll","summary":"The page uses the new fields. Cards show removed lines with a red `−` gutter and mark the ★ functions. Names are links, arrow ends list their callers, and hovering a local marks all its uses. Long lines scroll sideways with shift and the wheel.","nodes":[],"files":["internal/render/page/engine.js","internal/render/page/app.js","internal/render/page/index.html"]},{"id":"skill","title":"Rename the skill to map-pr","summary":"The skill moves from `skills/make-pr-map` to `skills/map-pr`, so it runs as `/map-pr`.","nodes":[],"files":["skills/map-pr/SKILL.md","skills/make-pr-map/SKILL.md","README.md"]}],"tour":[{"title":"The idea","body":"A map was missing three things a reviewer needs: what was deleted, where to start reading, and how to move from a name to its code. This PR adds the data for these in Go and the views for them in the page.\n\nThis page is a map of this PR, made by map-pr itself. Hover and click names on the cards to try the features.","nodes":null},{"title":"Start here: Build and Load","body":"`main.go:loadMap` calls `gitdiff.Load` and then `callgraph.Build`. Both are changed and no changed function calls them, so both have a ★.\n\n**Check:** `Build` now asks `removedIn` before it skips a function. A function with only deleted lines is now **modified**, not unchanged.","theme":"graph","nodes":["main.go:loadMap","internal/gitdiff/gitdiff.go:Load","internal/callgraph/callgraph.go:Build"]},{"title":"Parse keeps deleted lines","body":"`Parse` reads the old line count from the hunk header (`count`). While that count is above zero, a line that starts with `-` is a deleted line, not a `--- ` header.\n\n**Review here:** `before` is the new line the deleted lines came before. With no new lines in the hunk, git gives the line *before* the gap, so `Parse` adds one.","theme":"diff","nodes":["internal/gitdiff/gitdiff.go:Parse","internal/gitdiff/gitdiff.go:count","internal/gitdiff/gitdiff.go:hunkHeader","internal/gitdiff/gitdiff.go:FileChange"]},{"title":"Which deleted lines belong to a declaration","body":"`removedIn` takes the deleted lines between a declaration's first and last line. At the edges it uses a rule: lines deleted just before the first line belong to it only when the first line changed too.\n\n**Check:** a function whose old first lines were replaced keeps them; a function below a deleted block does not take them.","theme":"graph","nodes":["internal/callgraph/callgraph.go:Build","internal/callgraph/callgraph.go:removedIn","internal/gitdiff/gitdiff.go:FileChange"]},{"title":"Start-here stars","body":"`markTops` walks the callers of each changed function through the whole repo, tests left out. A changed function is a top when no other changed function reaches it. Two functions that reach each other are at the same level, so a cycle does not hide both.","theme":"graph","nodes":["internal/callgraph/callgraph.go:Build","internal/callgraph/callgraph.go:markTops","internal/callgraph/callgraph.go:Node"]},{"title":"Local names","body":"`localsIn` walks the whole function, receiver included, and asks `localObject` for each name. Only names declared inside the function count: variables and parameters (not fields), constants, types and labels. `localGroups` keeps the names used more than once.\n\nHover a local name on any card to see the result.","theme":"graph","nodes":["internal/callgraph/callgraph.go:localsIn","internal/callgraph/callgraph.go:localObject","internal/callgraph/callgraph.go:localGroups","internal/callgraph/callgraph.go:Span"]},{"title":"The page","body":"Most of the lines are in `engine.js`: removed rows, ★ marks, name links, the callers menu on arrow ends, larger arrows in front, local marks and sideways scroll. `app.js` shows removed lines in the code panel and the callers list.","theme":"page","nodes":null,"files":["internal/render/page/engine.js","internal/render/page/app.js"]},{"title":"Not on the map","body":"The skill rename has no Go code: `skills/make-pr-map/SKILL.md` is deleted and `skills/map-pr/SKILL.md` takes its place. The new tests (`TestBuildTops`, `TestRemovedIn`, `TestBuildLocals`) are on the map at the declaration level.","theme":"skill","nodes":null,"files":["skills/map-pr/SKILL.md","skills/make-pr-map/SKILL.md"]}],"nodes":{"internal/callgraph/callgraph.go:Build":"Fills the new `Removed`, `Top` and `Locals` fields. A function with only deleted lines now counts as **modified**.","internal/callgraph/callgraph.go:Node":"**New fields:** `Removed`, `Top` and `Locals`.","internal/callgraph/callgraph.go:localGroups":"**New:** keeps names used more than once, sorted by place.","internal/callgraph/callgraph.go:localObject":"**New:** decides if a name is local to a function. Struct fields and package-level names are not.","internal/callgraph/callgraph.go:localsIn":"**New:** finds every use of each local name in a function.","internal/callgraph/callgraph.go:markTops":"**New:** marks the start-here (★) functions: changed functions that no other changed function reaches.","internal/callgraph/callgraph.go:removedIn":"**New:** picks the deleted lines that belong to one declaration, with a rule for its first and last line.","internal/gitdiff/gitdiff.go:FileChange":"**New field** `Removed`: deleted lines, keyed by the new line they came before.","internal/gitdiff/gitdiff.go:Parse":"**Behavior change:** keeps the text of deleted lines in `Removed`, and counts hunk lines so a deleted `--- ` line is not a header. A pure deletion no longer marks a line as changed.","internal/gitdiff/gitdiff.go:count":"**New:** reads a hunk count; an empty count means 1.","internal/gitdiff/gitdiff.go:hunkHeader":"Now captures the old line count too."}};
