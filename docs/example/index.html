rOptions{\n\t\tLevel:     level,\n\t\tAddSource: true,\n\t\tReplaceAttr: func(_ []string, attr slog.Attr) slog.Attr {\n\t\t\tswitch attr.Key {\n\t\t\tcase slog.LevelKey:\n\t\t\t\tswitch attr.Value.Any().(slog.Level) {\n\t\t\t\tcase LevelTrace:\n\t\t\t\t\tattr.Value = slog.StringValue(\"TRACE\")\n\t\t\t\t}\n\t\t\tcase slog.SourceKey:\n\t\t\t\tif source, ok := attr.Value.Any().(*slog.Source); ok {\n\t\t\t\t\tsource.File = filepath.Base(source.File)\n\t\t\t\t}\n\t\t\t}\n\t\t\treturn attr\n\t\t},\n\t}))\n}"},{"id":"manifest/layer.go:12:6","name":"Layer","kind":"type","file":"manifest/layer.go","line":12,"endLine":19,"source":"type Layer struct {\n\tMediaType string `json:\"mediaType\"`\n\tDigest    string `json:\"digest\"`\n\tSize      int64  `json:\"size\"`\n\tFrom      string `json:\"from,omitempty\"`\n\tName      string `json:\"name,omitempty\"` // tensor name, e.g., \"text_encoder/model.embed_tokens.weight\"\n\tStatus    string `json:\"-\"`\n}"},{"id":"manifest/layer.go:134:6","name":"NewLayerFromLayer","kind":"func","file":"manifest/layer.go","line":134,"endLine":159,"source":"func NewLayerFromLayer(digest, mediatype, from string) (Layer, error) {\n\tif digest == \"\" {\n\t\treturn Layer{}, errors.New(\"creating new layer from layer with empty digest\")\n\t}\n\n\tblob, err := BlobsPath(digest)\n\tif err != nil {\n\t\treturn Layer{}, err\n\t}\n\n\tfi, err := os.Stat(blob)\n\tif err != nil {\n\t\treturn Layer{}, err\n\t}\n\tif err := touchLayer(blob); err != nil {\n\t\treturn Layer{}, err\n\t}\n\n\treturn Layer{\n\t\tMediaType: mediatype,\n\t\tDigest:    digest,\n\t\tSize:      fi.Size(),\n\t\tFrom:      from,\n\t\tStatus:    fmt.Sprintf(\"using existing layer %s\", digest),\n\t}, nil\n}"},{"id":"manifest/layer.go:23:2","name":"MediaTypeImageJSON","kind":"const","file":"manifest/layer.go","line":23,"endLine":23,"source":"\tMediaTypeImageJSON   = \"application/vnd.ollama.image.json\""},{"id":"manifest/layer.go:39:6","name":"NewLayer","kind":"func","file":"manifest/layer.go","line":39,"endLine":88,"source":"func NewLayer(r io.Reader, mediatype string) (Layer, error) {\n\tblobs, err := BlobsPath(\"\")\n\tif err != nil {\n\t\treturn Layer{}, err\n\t}\n\n\ttemp, err := os.CreateTemp(blobs, \"sha256-\")\n\tif err != nil {\n\t\treturn Layer{}, err\n\t}\n\tdefer temp.Close()\n\tdefer os.Remove(temp.Name())\n\n\tsha256sum := sha256.New()\n\tn, err := io.Copy(io.MultiWriter(temp, sha256sum), r)\n\tif err != nil {\n\t\treturn Layer{}, err\n\t}\n\n\tif err := temp.Close(); err != nil {\n\t\treturn Layer{}, err\n\t}\n\n\tdigest := fmt.Sprintf(\"sha256:%x\", sha256sum.Sum(nil))\n\tblob, err := BlobsPath(digest)\n\tif err != nil {\n\t\treturn Layer{}, err\n\t}\n\n\tstatus := \"using existing layer\"\n\tif _, err := os.Stat(blob); err != nil {\n\t\tstatus = \"creating new layer\"\n\t\tif err := os.Rename(temp.Name(), blob); err != nil {\n\t\t\treturn Layer{}, err\n\t\t}\n\t\tif err := os.Chmod(blob, 0o644); err != nil {\n\t\t\treturn Layer{}, err\n\t\t}\n\t}\n\tif err := touchLayer(blob); err != nil {\n\t\treturn Layer{}, err\n\t}\n\n\treturn Layer{\n\t\tMediaType: mediatype,\n\t\tDigest:    digest,\n\t\tSize:      n,\n\t\tStatus:    fmt.Sprintf(\"%s %s\", status, digest),\n\t}, nil\n}"},{"id":"manifest/manifest.go:1051:6","name":"WriteManifest","kind":"func","file":"manifest/manifest.go","line":1051,"endLine":1053,"source":"func WriteManifest(name model.Name, config Layer, layers []Layer) error {\n\treturn WriteManifestWithMetadata(name, config, layers, \"\", \"\")\n}"},{"id":"manifest/manifest.go:1740:6","name":"Manifests","kind":"func","file":"manifest/manifest.go","line":1740,"endLine":1760,"source":"func Manifests(continueOnError bool) (map[model.Name]*Manifest, error) {\n\trefs, err := namedManifestRefs(continueOnError)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\n\tms := make(map[model.Name]*Manifest, len(refs))\n\tfor n, ref := range refs {\n\t\tm, err := parseManifestFile(n, ref.path, ref.root, runnerPreferences())\n\t\tif err != n :6","name":"BlobsPath","kind":"func","file":"manifest/paths.go","line":400,"endLine":420,"source":"func BlobsPath(digest string) (string, error) {\n\t// the empty digest names the blobs directory\n\tif digest != \"\" {\n\t\tif err := ValidateDigest(digest); err != nil {\n\t\t\treturn \"\", err\n\t\t}\n\t}\n\n\tdigest = strings.ReplaceAll(digest, \":\", \"-\")\n\tpath := filepath.Join(envconfig.Models(), \"blobs\", digest)\n\tdirPath := filepath.Dir(path)\n\tif digest == \"\" {\n\t\tdirPath = path\n\t}\n\n\tif err := os.MkdirAll(dirPath, 0o755); err != nil {\n\t\treturn \"\", fmt.Errorf(\"%w: ensure path elements are traversable\", err)\n\t}\n\n\treturn path, nil\n}"},{"id":"manifest/paths.go:423:6","name":"PruneDirectory","kind":"func","file":"manifest/paths.go","line":423,"endLine":454,"source":"func PruneDirectory(path string) error {\n\tinfo, err := os.Lstat(path)\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tif info.IsDir() \u0026\u0026 info.Mode()\u0026os.ModeSymlink == 0 {\n\t\tentries, err := os.ReadDir(path)\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\n\t\tfor _, entry := range entries {\n\t\t\tif err := PruneDirectory(filepath.Join(path, entry.Name())); err != nil {\n\t\t\t\treturn err\n\t\t\t}\n\t\t}\n\n\t\tentries, err = os.ReadDir(path)\n\t\tif err != nil {\n\t\t\treturn err\n\t\t}\n\n\t\tif len(entries) \u003e 0 {\n\t\t\treturn nil\n\t\t}\n\n\t\treturn os.Remove(path)\n\t}\n\n\treturn nil\n}"},{"id":"manifest/paths.go:43:6","name":"Path","kind":"func","file":"manifest/paths.go","line":43,"endLine":45,"source":"func Path() (string, error) {\n\treturn manifestPath(legacyDirName)\n}"},{"id":"manifest/paths.go:47:6","name":"V2Path","kind":"func","file":"manifest/paths.go","line":47,"endLine":49,"source":"func V2Path() (string, error) {\n\treturn manifestPath(v2DirName)\n}"},{"id":"manifest/paths.go:65:6","name":"LegacyPathForName","kind":"func","file":"manifest/paths.go","line":65,"endLine":76,"source":"func LegacyPathForName(n model.Name) (string, error == \"darwin\" {\n\t\tif _, ok := os.LookupEnv(\"MLX_METAL_RESIDENCY_REFRESH_INTERVAL_MS\"); !ok {\n\t\t\tsetEnv(cmd, \"MLX_METAL_RESIDENCY_REFRESH_INTERVAL_MS\", \"1000\")\n\t\t}\n\t}\n\n\t// Set library path environment variable for MLX libraries\n\t// Linux: LD_LIBRARY_PATH, Windows: PATH\n\tvar libPathEnvVar string\n\tswitch runtime.GOOS {\n\tcase \"linux\":\n\t\tlibPathEnvVar = \"LD_LIBRARY_PATH\"\n\tcase \"windows\":\n\t\tlibPathEnvVar = \"PATH\"\n\t}\n\n\tif libPathEnvVar != \"\" {\n\t\tlibraryPaths := []string{ml.LibOllamaPath}\n\t\tif mlxDirs, err := filepath.Glob(filepath.Join(ml.LibOllamaPath, \"mlx_*\")); err == nil {\n\t\t\tlibraryPaths = append(libraryPaths, mlxDirs...)\n\t\t}\n\n\t\tif existingPath, ok := os.LookupEnv(libPathEnvVar); ok {\n\t\t\tlibraryPaths = append(libraryPaths, filepath.SplitList(existingPath)...)\n\t\t}\n\n\t\tpathEnvVal := strings.Join(libraryPaths, string(filepath.ListSeparator))\n\n\t\tfound := false\n\t\tfor i := range cmd.Env {"},{"id":"mlxrunner/client.go:538:18","name":"(*Client).ModelPath","kind":"method","file":"mlxrunner/client.go","line":538,"endLine":540,"source":"func (c *Client) ModelPath() string {\n\treturn c.modelName\n}"},{"id":"mlxrunner/client.go:543:18","name":"(*Client).Pid","kind":"method","file":"mlxrunner/client.go","line":543,"endLine":550,"source":"func (c *Client) Pid() int {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tif c.cmd != nil \u0026\u0026 c.cmd.Process != nil {\n\t\treturn c.cmd.Process.Pid\n\t}\n\treturn -1\n}"},{"id":"mlxrunner/client.go:57:6","name":"NewClient","kind":"func","file":"mlxrunner/client.go","line":57,"endLine":80,"source":"func NewClient(modelName string, softContextLength int) (*Client, error) {\n\tif err := CheckRuntime(); err != nil {\n\t\treturn nil, err\n\t}\n\n\tc := \u0026Client{\n\t\tmodelName:         modelName,\n\t\tsoftContextLength: softContextLength,\n\t\tdone:              make(chan struct{}),\n\t\tclient:            http.DefaultClient,\n\t}\n\n\tmodelManifest, err := manifest.ParseNamedManifest(model.ParseName(modelName))\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tvar tensorBytes int64\n\tfor _, layer := range modelManifest.TensorLayers() {\n\t\ttensorBytes += layer.Size\n\t}\n\tc.memory.Store(uint64(tensorBytes))\n\n\treturn c, nil\n}"},{"id":"mlxrunner/client.go:632:18","name":"(*Client).MemorySize","kind":"method","file":"mlxrunner/client.go","line":632,"endLine":635,"source":"func (c *Client) MemorySize() (total, vram uint64) {\n\tmem := c.currentMemory()\n\treturn mem, mem\n}"},{"id":"mlxrunner/client.go:91:18","name":"(*Client).WaitUntilRunning","kind":"method","file":"mlxrunner/client.go","line":91,"endLine":117,"source":"func (c *Client) WaitUntilRunning(ctx context.Context) error {\n\ttimeout := time.After(envconfig.LoadTimeout())\n\tticker := time.NewTicker(100 * time.Millisecond)\n\tdefer ticker.Stop()\n\n\tfor {\n\t\tselect {\n\t\tcase \u003c-ctx.Done():\n\t\t\treturn ctx.Err()\n\t\tcase \u003c-c.done:\n\t\t\tif msg := c.status.LastError(); msg != \"\" {\n\t\t\t\treturn fmt.Errorf(\"mlx runner failed: %s (exit: %v)\", msg, c.doneErr)\n\t\t\t}\n\t\t\treturn fmt.Errorf(\"mlx runner exited unexpectedly: %w\", c.doneErr)\n\t\tcase \u003c-timeout:\n\t\t\tif msg := c.status.LastError(); msg != \"\" {\n\t\t\t\treturn fmt.Errorf(\"timeout waiting for mlx runner: %s\", msg)\n\t\t\t}\n\t\t\treturn errors.New(\"timeout waiting for mlx runner to start\")\n\t\tcase \u003c-ticker.C:\n\t\t\tif err := c.Ping(ctx); err == nil {\n\t\t\t\tslog.Info(\"mlx runner is ready\", \"port\", c.port)\n\t\t\t\treturn nil\n\t\t\t}\n\t\t}\n\t}\n}"},{"id":"mlxrunner/server.go:25:6","name":"Execute","kind":"func","file":"mlxrunner/server.go","line":25,"endLine":254,"source":"func Execute(args []string) error {\n\tslog.SetDefault(logutil.NewLogger(os.Stderr, envconfig.LogLevel()))\n\n\tvar (\n\t\tmodelName string\n\t\tport      int\n\t)\n\n\tflagSet := flag.NewFlagSet(\"mlxrunner\", flag.ExitOnError)\n\tflagSet.StringVar(\u0026modelName, \"model\ runeLayers() error {\n\tvar candidates []string\n\tp, err := manifest.BlobsPath(\"\")\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tblobs, err := os.ReadDir(p)\n\tif err != nil {\n\t\tslog.Info(fmt.Sprintf(\"couldn't read dir '%s': %v\", p, err))\n\t\treturn err\n\t}\n\n\tfor _, blob := range blobs {\n\t\tif blob.IsDir() {\n\t\t\tcontinue\n\t\t}\n\n\t\tinfo, err := blob.Info()\n\t\tif err != nil {\n\t\t\tslog.Error(\"couldn't stat blob\", \"blob\", blob.Name(), \"error\", err)\n\t\t\tcontinue\n\t\t}\n\t\tif time.Since(info.ModTime()) \u003c layerPruneGracePeriod {\n\t\t\tcontinue\n\t\t}\n\n\t\tname := blob.Name()\n\t\tname = strings.ReplaceAll(name, \"-\", \":\")\n\n\t\t_, err = manifest.BlobsPath(name)\n\t\tif err != nil {\n\t\t\tif errors.Is(err, manifest.ErrInvalidDigestFormat) {\n\t\t\t\t// remove invalid blobs (e.g. partial downloads)\n\t\t\t\tif err := os.Remove(filepath.Join(p, blob.Name())); err != nil {\n\t\t\t\t\tslog.Error(\"couldn't remove blob\", \"blob\", blob.Name(), \"error\", err)\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tcontinue\n\t\t}\n\n\t\tcandidates = append(candidates, name)\n\t}\n\n\tslog.Info(fmt.Sprintf(\"total blobs: %d\", len(candidates)))\n\n\tremoved, err := manifest.RemoveUnreferencedBlobs(candidates...)\n\tif err != nil {\n\t\tslog.Error(fmt.Sprintf(\"couldn't remove unused layers: %v\", err))\n\t\treturn nil\n\t}\n\tpruneGGUFMetadata()\n\n\tslog.Info(fmt.Sprintf(\"total unused blobs removed: %d\", len(removed)))\n\n\treturn nil\n}"},{"id":"server/inference_request_log.go:33:18","name":"(*Server).initRequestLogging","kind":"method","file":"server/inference_request_log.go","line":33,"endLine":47,"source":"func (s *Server) initRequestLogging() error {\n\tif !envconfig.DebugLogRequests() {\n\t\treturn nil\n\t}\n\n\trequestLogger, err := newInferenceRequestLogger()\n\tif err != nil {\n\t\treturn fmt.Errorf(\"enable OLLAMA_DEBUG_LOG_REQUESTS: %w\", err)\n\t}\n\n\ts.requestLogger = requestLogger\n\tslog.Info(fmt.Sprintf(\"request debug logging enabled; hod","file":"server/model_thinking.go","line":63,"endLine":95,"source":"func (m *Model) Thinking() *model.Thinking {\n\tif m == nil || m.Config.RemoteHost != \"\" {\n\t\treturn nil\n\t}\n\tif shouldUseHarmony(m) {\n\t\treturn renderers.ThinkingForRenderer(\"harmony\")\n\t}\n\tif name := resolveRendererName(m); name != \"\" {\n\t\tthinking := renderers.ThinkingForRenderer(name)\n\t\tif thinking == nil {\n\t\t\treturn nil\n\t\t}\n\t\t// Discovery must match the controls accepted by the serving boundary.\n\t\tif !slices.Contains(m.Capabilities(), model.CapabilityThinking) {\n\t\t\treturn \u0026model.Thinking{Values: []any{false}, Default: false}\n\t\t}\n\t\t// Preserve the local endpoint's historical default-on behavior.\n\t\tif thinking.Default == false \u0026\u0026 thinking.Supports(true) {\n\t\t\tthinking.Default = true\n\t\t}\n\t\t// true currently reaches Qwen3.8 as medium via ThinkValue.String().\n\t\tif name == \"qwen3.8\" {\n\t\t\tthinking.Default = \"medium\"\n\t\t}\n\t\treturn thinking\n\t}\n\tif shouldUseGoTemplate(m) {\n\t\tif thinking, ok := legacyThinking[m.templateDigest]; ok {\n\t\t\treturn thinking.Clone()\n\t\t}\n\t}\n\treturn nil\n}"},{"id":"server/renderer_resolution.go:13:2","name":"gemma4RendererLarge","kind":"const","file":"server/renderer_resolution.go","line":13,"endLine":13,"source":"\tgemma4RendererLarge  = \"gemma4-large\""},{"id":"server/renderer_resolution.go:21:6","name":"resolveRendererName","kind":"func","file":"server/renderer_resolution.go","line":21,"endLine":32,"source":"func resolveRendererName(m *Model) string {\n\tif m == nil || m.Config.Renderer == \"\" {\n\t\treturn \"\"\n\t}\n\n\tswitch m.Config.Renderer {\n\tcase gemma4RendererLegacy:\n\t\treturn resolveGemma4Renderer(m)\n\tdefault:\n\t\treturn m.Config.Renderer\n\t}\n}"},{"id":"server/routes.go:106:5","name":"useClient2","kind":"var","file":"server/routes.go","line":106,"endLine":106,"source":"var useClient2 = experimentEnabled(\"client2\")"},{"id":"server/routes.go:110:6","name":"Server","kind":"type","file":"server/routes.go","line":110,"endLine":116,"source":"type Server struct {\n\taddr          net.Addr\n\tsched         *Scheduler\n\tdefaultNumCtx int\n\trequestLogger *inferenceRequestLogger\n\tmodelCaches   *modelCaches\n}"},{"id":"server/routes.go:1644:6","name":"getExistingName","kind":"func","file":"server/routes.go","line":1644,"endLine":1701,"source":"func getExistingName(n model.Name) (model.Name, error) {\n\tvar zero model.Name\n\tif manifest.IsDigestReferenceName(n) {\n\t\treturn n, nil\n\t}\n\n\t// The usual request names an existing model. Avoid decoding every installed\n\t// manifest just to resolve its spelling; partial matches below are for new names.\n\tif name, err := manifest.FindName(n); err == nil {\n\t\treturn name, nil\n\t} else if !errors.Is(err, os.ErrNotExist) {\n\t\treturn zero, err\n\t}\n\n\texisting, err := manifest.Manifests(true)\n\tif err != nil {\n\t\treturn zero, err\n\t}\n\t// Find the single manifest with the longest consecutive\n\t// case-insensitive prefix match (host -\u003e namespace -\u003e model) and copy\n\t// only the matching prefix parts from that manifest. The tag is left\n\t// as-is so that an unrelated manifest with a matching tag cannot\n\t// influence the casing of a different model's tag (e.g. pulling\n\t// \"myorg/mymodel:q8\" when \"MyOrg/MyModel:q4\" and\n\t// \"OtherOrg/OtherModel:Q8\" exist must not produce \"MyOrg/MyModel:Q8\").\n\tvar best model.Name\n\tbestLen := 0\n\tfor e := range existing {\n\t\tlength := 0\n\t\tif strings.EqualFold(e.Host, n.Host) {\n\t\t\tlength = 1\n\t\t\tif strings.EqualFold(e.Namespace, n.Namespace) {\n\t\t\t\tlength = 2\n\t\t\t\tif strings.EqualFold(e.Model, n.Model) {\n\t\t\t\t\tlength = 3\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\tif length \u003e bestLen {\n\t\t\tbestLen = length\n\t\t\tbest = e\n\t\t}\n\t}\n\n\tswitch bestLen {\n\tcase 3:\n\t\tn.Host = best.Host\n\t\tn.Namespace = best.Namespace\n\t\tn.Model = best.Model\n\tcase 2:\n\t\tn.Host = best.Host\n\t\tn.Namespace = best.Namespace\n\tcase 1:\n\t\tn.Host = best.Host\n\t}\n\n\treturn n, nil\n}"},{"id":"server/routes.go:2105:6","name":"getModelData","kind":"func","file":"server/routes.go","line":2105,"endLine":2120,"source":"func getModelData(paths []string, verbose bool) (*gguf.Metadata, gguf.Tensors, error) {\n\tif len(paths) == 0 {\n\t\treturn nil, gguf.Tensors{}, os.ErrNotExist\n\t}\n\n\tmaxArraySize := 0\n\tif verbose {\n\t\tmaxArraySize = -1\n\t}\n\tdata, err := llm.LoadModel(paths[0], maxArraySize, paths[1:]...)\n\tif err != nil {\n\t\treturn nil, gguf.Tensors{}, err\n\t}\n\n\treturn data.KV(), data.Tensors(), nil\n}"},{"id":"server/routes.go:2122:6","name":"selectedModelTemplate","kind":"func","file":"server/routes.go","line":2122,"endLine":2129,"source":"func selectedModelTemplate(m *Model, kv *gguf.Metadata) string {\n\tif m.HasChatTemplate \u0026\u0026 chatModeForModel(m) == chatExecutionModeNative {\n\t\tif chatTemplate := kv.ChatTemplate(); chatTemplate != \"\" {\n\t\t\treturn chatTemplate\n\t\t}\n\t}\n\treturn m.Template.String()\n}"},{"id":"server/routes.go:226:6","name":"normalizeRunner","kind":"func","file":"server/routes.go","line":226,"endLine":239,"source":"func normalizeRunner(runner string) (string, error) {\n\tswitch strings.ToLower(strings.TrimSpace(runner)) {\n\tcase \"\":\n\t\treturn \"\", nil\n\tcase manifest.RunnerMLX, \"mlxrunner\":\n\t\treturn manifest.RunnerMLX, nil\n\tcase manifest.RunnerGGML:\n\t\treturn manifest.RunnerGGML, nil\n\tcase manifest.RunnerLlamaCPP, \"llama.cpp\", \"llama-cpp\", \"llama_cpp\":\n\t\treturn manifest.RunnerLlamaCPP, nil\n\tdefault:\n\t\treturn \"\", fmt.Errorf(\"unknown runner %q\", runner)\n\t}\n}"},{"id":"server/routes.go:2328:18","name":"(*Server).GenerateRoutes","kind":"method","file":"server/routes.go","line":2328,"endLine":2428,"source":"func (s *Server) GenerateRoutes() (http.Handler, error) {\n\tcodexDesktopProxy, err := newCodexDesktopProxy()\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\n\tco g on loading,\n\t// including by evicting one or more other models. We can only load\n\t// one model at a time but new requests to models that already loaded can\n\t// happen in parallel\n\tactiveLoading llm.LlamaServer\n\tloaded        map[string]*runnerRef\n\n\tloadFn          func(req *LlmRequest, systemInfo ml.SystemInfo, gpus []ml.DeviceInfo, requireFull bool) bool\n\tnewServerFn     func(systemInfo ml.SystemInfo, gpus []ml.DeviceInfo, model string, f *gguf.Model, adapters []string, projectors []string, opts api.Options, numParallel int, config llm.LlamaServerConfig) (llm.LlamaServer, error)\n\tgetGpuFn        func(ctx context.Context, runners []ml.FilteredRunnerDiscovery) []ml.DeviceInfo\n\tgetSystemInfoFn func() ml.SystemInfo\n\twaitForRecovery time.Duration\n}"},{"id":"server/sched.go:817:24","name":"(*LlmRequest).reduceAutoNumCtxForLoadOOM","kind":"method","file":"server/sched.go","line":817,"endLine":843,"source":"func (req *LlmRequest) reduceAutoNumCtxForLoadOOM(f *gguf.Model, numParallel int, completion bool, systemInfo ml.SystemInfo, gpus []ml.DeviceInfo, launchOpts api.Options) (oldNumCtx, effectiveNumCtx, newNumCtx, oldNumBatch, newNumBatch int, ok bool) {\n\tif !req.numCtxAuto {\n\t\treturn 0, 0, 0, 0, 0, false\n\t}\n\n\toldNumCtx = req.opts.NumCtx\n\toldNumBatch = req.opts.NumBatch\n\teffectiveNumCtx = oldNumCtx\n\tif f != nil {\n\t\tif trainCtx := int(f.KV().ContextLength()); trainCtx \u003e 0 \u0026\u0026 effectiveNumCtx \u003e trainCtx {\n\t\t\teffectiveNumCtx = trainCtx\n\t\t}\n\t}\n\n\tnewNumCtx, ok = nextLowerAutoNumCtx(effectiveNumCtx)\n\tif !ok || newNumCtx \u003e= oldNumCtx {\n\t\treturn 0, 0, 0, 0, 0, false\n\t}\n\n\treq.opts.NumCtx = newNumCtx\n\tpredictedCtx := effectiveLlamaServerContext(req.opts.NumCtx, f, numParallel)\n\tpredictedVRAM := llm.PredictServerVRAM(req.model.ModelPath, f, predictedCtx)\n\tavailable, _, _ := availableMemoryForPlacement(systemInfo, gpus, launchOpts)\n\treq.applyAutomaticGenerationBatch(completion, predictedCtx, predictedVRAM, available, llm.LlamaServerFlashAttention(gpus), gpus)\n\tnewNumBatch = req.opts.NumBatch\n\treturn oldNumCtx, effectiveNumCtx, newNumCtx, oldNumBatch, newNumBatch, true\n}"},{"id":"server/sched.go:845:6","name":"explicitPartialGPUOffload","kind":"func","file":"server/sched.go","line":845,"endLine":851,"source":"func explicitPartialGPUOffload(opts api.Options, f *gguf.Model) bool {\n\tif opts.NumGPU \u003c= 0 || f == nil {\n\t\treturn false\n\t}\n\n\treturn uint64(opts.NumGPU) \u003c f.KV().BlockCount()+1\n}"},{"id":"server/sched.go:853:6","name":"effectiveLlamaServerContext","kind":"func","file":"server/sched.go","line":853,"endLine":855,"source":"func effectiveLlamaServerContext(numCtx int, f *gguf.Model, numParallel int) int {\n\treturn effectiveModelContext(numCtx, f) * max(numParallel, 1)\n}"},{"id":"server/sched.go:867:24","name":"(*LlmRequest).applyAutomaticGenerationBatch","kind":"method","file":"server/sched.go","line":867,"endLine":873,"source":"func (req *LlmRequest) applyAutomaticGenerationBatch(completion bool, effectiveCtx int, predictedVRAM, availableMemory uint64, flashAttention ml.FlashAttentionType, gpus []ml.DeviceInfo) {\n\tif !completion || !req.numBatchAuto {\n\t\treturn\n\t}\n\n\treq.opts.NumBatch = automaticGenerationBatch(effectiveCtx, predictedVRAM, availableMemory, flashAttention, gpus)\n}"},{"id":"server/sched.go:994:6","name":"availableMemoryForPlacement","kind":"func","file":"server/sched.go","line":994,"endLine":1004,"source":"func availableMemoryForPlacement(systemInfo ml.SystemInfo, gpus []ml.DeviceInfo, opts api.Options) (available, gpuFree uint64, systemLimited bool) {\n\tplacementGpus := gpusForPlacement(gpus, opts)\n\tif len(placementGpus) == 1 \u0026\u0026 opts.MainGPU != nil {\n\t\tgpuFree = placementGpus[0].FreeMemory\n\t\tavailable = availableMemoryForGPU(systemInfo, placementGpus[0])\n\t\tsystemLimited = available \u003c gpuFree\n\t\treturn available, gpuFree, systemLimited\n\t}\n\n\treturn availableMemoryForLoad(systemInfo, placementGpus)\n}"},{"id":"server/show_manifest.go:121:6","name":"collectManifestLicenseText","kind":"func","file":"server/show_manifest.go","line":121,"endLine":147,"source":"func collectManifestLicenseText(children []manifest.Manifest) (string, error) {\n\tseen := make(map[string]struct{})\n\tvar licenses []string\n\n\tfor _, child := range children {\n\t\tfor _, layer := range child.Layers {\n\t\t\tif layer.MediaType != manifest.MediaTypeImageLicense || layer.Digest == \"\" {\n\t\t\t\tcontinue\n\t\t\t}\n\n\t\t\tdigest := layer.Digest\n\t\t\tif _, ok := seen[digest]; ok {\n\t\t\t\tcontinue\n\t\t\t}\n\n\t\t\tdata, err := readBlobData(digest)\n\t\t\tif err != nil {\n\t\t\t\treturn \"\", err\n\t\t\t}\n\n\t\t\tseen[digest] = struct{}{}\n\t\t\tlicenses = append(licenses, string(data))\n\t\t}\n\t}\n\n\treturn strings.Join(licenses, \"\\n\"), nil\n}"},{"id":"server/show_manifest.go:19:6","name":"writeShowError","kind":"func","file":"server/show_manifest.go","line":19,"endLine":35,"source":"func writeShowError(c *gin.Context, model string, err error) {\n\tvar statusErr api.StatusError\n\tswitch {\n\tcase os.IsNotExist(err):\n\t\tc.JSON(http.StatusNotFound, gin.H{\"error\": fmt.Sprintf(\"model '%s' not found\", model)})\n\tcase errors.Is(err, manifest.ErrNoCompatibleManifest):\n\t\t// Not found rather than bad request: the client's show-then-pull path\n\t\t// treats 404 as \"fetch it\", which is what a missing runner variant needs.\n\t\tc.JSON(http.StatusNotFound, gin.H{\"error\": err.Error()})\n\tcase errors.As(err, \u0026statusErr):\n\t\tc.JSON(statusErr.StatusCode, gin.H{\"error\": statusErr.ErrorMessage})\n\tcase err.Error() == errtypes.InvalidModelNameErrMsg:\n\t\tc.JSON(http.StatusBadRequest, gin.H{\"error\": err.Error()})\n\tdefault:\n\t\tc.JSON(http.StatusInternalServerError, gin.H{\"error\": err.Error()})\n\t}\n}"},{"id":"server/show_manifest.go:58:6","name":"resolveLocalShowManifestChild","kind":"func","file":"server/show_manifest.go","line":58,"endLine":64,"source":"func resolveLocalShowManifestChild(child manifest.Manifest) (*manifest.Manifest, bool, error) {\n\tif child.MediaType == manifest.MediaTypeManifestList {\n\t\treturn nil, false, errors.New(\"nested manifest lists are not supported\")\n\t}\n\n\treturn manifest.ResolveManifestReference(child)\n}"},{"id":"server/show_manifest.go:66:6","name":"manifestSummariesForShow","kind":"func","file":"server/show_manifest.go","line":66,"endLine":119,"source":"func manifestSummariesForShow(name model.Name, selectedDigest string) ([]api.ManifestSummary, error) {\n\tif manifest.IsDigestReferenceName(name) {\n\t\treturn nil, nil\n\t}\n\n\tdata, err := manifest.ReadManifestData(name)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\n\tvar parent manifest.Manifest\n\tif err := json.Unmarshal(data, \u0026parent); err != nil {\n\t\treturn nil, err\n\t}\n\tif parent.MediaType != manifest.MediaTypeManifestList {\n\t\treturn nil, nil\n\t}\n\tif selectedDigest != \"\" \u0026\u0026 !strings.HasPrefix(selectedDigest, \"sha256:\") \u0026\u0026 !strings.HasPrefix(selectedDigest, \"sha256-\") {\n\t\tselectedDigest = \"sha256:\" + selectedDigest\n\t}\n\n\tsummaries := make([]api.ManifestSummary, 0, len(parent.Manifests))\n\tfor _, child := range parent.Manifests {\n\t\tresolved, ok, err := resolveLocalShowManifestChild(child)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tif !ok {\n\t\t\tcontinue\n\t\t}\n\t\tdigest, err := manifest.ChildManifestDigest(child)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\n\t\trunner, err := normalizeRunner(resolved.Runner)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tsummaries = append(summaries, api.ManifestSummary{\n\t\t\tDigest:   digest,\n\t\t\tRunner:   runner,\n\t\t\tFormat:   resolved.Format,\n\t\t\tSelected: manifest.SameDigest(digest, selectedDigest),\n\t\t})\n\t}\n\t// Only report manifests when there is a real choice: a single-child list\n\t// behaves like a plain model, and show omits the runner rows for it.\n\tif len(summaries) \u003c 2 {\n\t\treturn nil, nil\n\t}\n\n\treturn summaries, nil\n}"},{"id":"server/show_safetensors.go:221:6","name":"getSafetensorsTensorInfoForRunner","kind":"func","file":"server/show_safetensors.go","line":221,"endLine":228,"source":"func getSafetensorsTensorInfoForRunner(name model.Name, runner string) ([]api.Tensor, error) {\n\tmf, err := manifest.ParseNamedManifestForRunner(name, runner)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"failed to load manifest: %w\", err)\n\t}\n\n\treturn getTensorInfoFromManifest(mf)\n}"},{"id":"server/show_safetensors.go:316:6","name":"getSafetensorsDtypeForRunner","kind":"func","file":"server/show_safetensors.go","line":316,"endLine":368,"source":"func getSafetensorsDtypeForRunner(name model.Name, runner string) (string, error) {\n\tmf, err := manifest.ParseNamedManifestForRunner(name, runner)\n\tif err != nil {\n\t\treturn \"\", fmt.Errorf(\"failed to load manifest: %w\", err)\n\t}\n\n\tvar bestQuantType string\n\tvar bestPrecision int\n\n\tfor _, layer := range mf.Layers {\n\t\tif layer.MediaType != manifest.MediaTypeImageTensor {\n\t\t\tcontinue\n\t\t}\n\t\tblobPath, err := manifest.BlobsPath(layer.Digest)\n\t\tif err != nil {\n\t\t\tcontinue\n\t\t}\n\t\tf, err := os.Open(blobPath)\n\t\tif err != nil {\n\t\t\tcontinue\n\t\t}\n\t\tinfos, err := parseSafetensorsAllHeaders(f)\n\t\t_ = f.Close()\n\t\tif err != nil {\n\t\t\tcontinue\n\t\t}\n\t\tfor _, info := range infos {\n\t\t\tquantType := canonicalQuantType(info.QuantType)\n\t\t\tif quantType == \"\" {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tprecision := quantTypePrecision(quantType)\n\t\t\tif bestQuantType == \"\" || (precision \u003e 0 \u0026\u0026 (bestPrecision == 0 || precision \u003c bestPrecision)) {\n\t\t\t\tbestQuantType = quantType\n\t\t\t\tbestPrecision = precision\n\t\t\t}\n\t\t}\n\t}\n\n\tif bestQuantType != \"\" {\n\t\treturn bestQuantType, nil\n\t}\n\n\t// Not quantized - return torch_dtype from config.json\n\tvar cfg struct {\n\t\tTorchDtype string `json:\"torch_dtype\"`\n\t}\n\tif err := mf.ReadConfigJSON(\"config.json\", \u0026cfg); err != nil {\n\t\treturn \"\", fmt.Errorf(\"failed to read config.json: %w\", err)\n\t}\n\n\treturn cfg.TorchDtype, nil\n}"},{"id":"server/show_safetensors.go:47:6","name":"getSafetensorsLLMInfoForRunner","kind":"func","file":"server/show_safetensors.go","line":47,"endLine":77,"source":"func getSafetensorsLLMInfoForRunner(name model.Name, runner string) (map[string]any, error) {\n\tmf, err := manifest.ParseNamedManifestForRunner(name, runner)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"failed to load manifest: %w\", err)\n\t}\n\n\tvar config modelConfig\n\tif err := mf.ReadConfigJSON(\"config.json\", \u0026config); err != nil {\n\t\treturn nil, fmt.Errorf(\"failed to read config.json: %w\", err)\n\t}\n\n\t// Calculate total tensor bytes from manifest layers\n\tvar totalBytes int64\n\tvar tensorCount int64\n\tfor _, layer := range mf.Layers {\n\t\tif layer.MediaType == manifest.MediaTypeImageTensor {\n\t\t\ttotalBytes += layer.Size\n\t\t\ttensorCount++\n\t\t}\n\t}\n\n\tinfo := buildModelInfo(config, totalBytes, tensorCount)\n\n\t// For quantized models, byte-based estimation can significantly undercount\n\t// parameters. Prefer exact counting from tensor shapes in safetensors headers.\n\tif paramCount, err := getParameterCountFromManifest(mf); err == nil \u0026\u0026 paramCount \u003e 0 {\n\t\tinfo[\"general.parameter_count\"] = paramCount\n\t}\n\n\treturn info, nil\n}"},{"id":"template/template.go:167:20","name":"(*Template).String","kind":"method","file":"template/template.go","line":167,"endLine":169,"source":"func (t *Template) String() string {\n\treturn t.raw\n}"},{"id":"types/errtypes/errtypes.go:11:2","name":"InvalidModelNameErrMsg","kind":"const","file":"types/errtypes/errtypes.go","line":11,"endLine":11,"source":"\tInvalidModelNameErrMsg = \"invalid model name\""},{"id":"types/model/capability.go:10:2","name":"CapabilityEmbedding","kind":"const","file":"ty window.MAPR_NOTES = {"title":"ollama #19095 · Populate show renderer/parser fields and add template_source","url":"https://github.com/ollama/ollama/pull/19095","summary":"`ollama show` and `POST /api/show` return a `ShowResponse`. It already had `renderer` and `parser` fields, but the server never set them. This PR sets them, and adds a third field, `template_source`, that names what actually renders the chat prompt for the model: a Go renderer and parser, harmony, a Go template, the GGUF's embedded jinja template, or `none`.\n\nThe server already chose this source when it loaded a model, and wrote it to the log. The PR moves that choice into one method, `(*Model).templateSource`, so the log line and the API answer use the same code. The CLI prints the three new rows only when they are set, so `ollama show` output does not change for models without rendering config.","themes":[{"id":"api","title":"One new field on the show response","summary":"`ShowResponse` gets `TemplateSource` (`template_source`, omitempty). The rest of the diff is gofmt re-aligning the struct. `Renderer` and `Parser` were already there.\n\n`ShowResponse` is exported and has many users in the repo (most are not on the map). Adding an omitempty field is backward compatible for JSON clients. The OpenAPI doc lists the three fields and the seven values of `template_source`.","nodes":["api/types.go:ShowResponse"],"files":["docs/openapi.yaml"]},{"id":"source","title":"One answer for which template runs","summary":"`(*Model).templateSource` wraps the existing `selectedTemplateSource` with the harmony check that `logTemplateSelection` did inline. The scheduler's load log and the show API now call the same method, so they cannot disagree.","nodes":["server/images.go:(*Model).templateSource","server/images.go:logTemplateSelection"]},{"id":"server","title":"The server fills the fields","summary":"`GetModelInfo` sets `Renderer`, `Parser` and `TemplateSource` on every local show response. `Renderer` goes through `resolveRendererName`, so the legacy `gemma4` alias comes back as the renderer the model really uses (picked by model size).\n\n`GetModelInfo` is reached from the `/api/show` handler, from the in-memory show cache, and from the manifest listing. The new test creates three models through the HTTP handlers and checks each value.","nodes":["server/routes.go:GetModelInfo"]},{"id":"cli","title":"ollama show prints the new rows","summary":"`showInfo` adds `renderer`, `parser` and `template source` rows to the Model table, each only when it has a value. A `template source` of `none` is hidden too.","nodes":["cmd/cmd.go:showInfo"]}],"nodes":{"api/types.go:ShowResponse":"**New field:** `TemplateSource string` with `json:\"template_source,omitempty\"`. The other 19 changed lines are only gofmt alignment. `Renderer` and `Parser` existed before but were always empty.","cmd/cmd.go:showInfo":"**Behavior change:** prints `renderer`, `parser` and `template source` rows when they are set. Hiding `none` keeps the output the same for models with no template. `TestShowInfo` covers the new rows.","server/images.go:(*Model).templateSource":"**New:** returns `selectedTemplateSource(m, m.Template != nil \u0026\u0026 shouldUseHarmony(m))`. This is the same harmony predicate that `logTemplateSelection` computes, moved here so the API can use it.","server/images.go:logTemplateSelection":"**Refactor, no behavior change:** the `selected` log value now comes from `m.templateSource()`. The function still computes `usesHarmony` itself for the other log fields, so the predicate runs twice per model load.","server/routes.go:GetModelInfo":"**Behavior change:** sets `Renderer` (aliases resolved by `resolveRendererName`), `Parser` and `TemplateSource` on the response. Responses from the show cache carry them too: `cloneShowResponse` copies the struct by value.\n\n**Check:** `Renderer` is the resolved name, but `TemplateSource` is computed from the unresolved `m.Config.Renderer`. That is fine, because `selectedTemplateSource` only tests if the renderer is set."}};

// foldPlan picks the runs of a declaration's source to fold away, as a PR
// view folds code the change does not touch. It keeps the lines in keep
// (changed lines, calls, the lines next to deleted ones), the first and last
// line, and 3 lines around each kept line; a run of 8 or more other lines
// folds. A declaration of 40 lines or fewer does not fold. It returns
// [from, to] source lines, both included.
function foldPlan(n, keep) {
  const count = (n.source || "").split("\n").length;
  if (count <= 40) return [];
  const show = new Array(count).fill(false);
  show[0] = show[count - 1] = true;
  for (const l of keep) {
    for (let i = l - n.line - 3; i <= l - n.line + 3; i++) if (i >= 0 && i < count) show[i] = true;
  }
  const out = [];
  for (let i = 0; i < count;) {
    if (show[i]) { i++; continue; }
    let j = i;
    while (j < count && !show[j]) j++;
    if (j - i >= 8) out.push([n.line + i, n.line + j - 1]);
    i = j;
  }
  return out;
}
// keepLines are the lines of n a fold keeps: changed lines, the lines around
// deleted ones, and extra lines such as calls.
function keepLines(n, extra = []) {
  const keep = new Set([...(n.changed || []), ...extra]);
  for (const l of Object.keys(n.removed || {})) { keep.add(+l); keep.add(+l - 1); }
  return keep;
}
// ZoomMap draws a PR map on a canvas as one zoomable space with three levels
// of detail: packages when zoomed out, declarations (functions, methods,
// types, constants, variables) in the middle, and their code when zoomed in.
// The layout never changes between levels. Each level fades into the next,
// so the eye can follow a package down into one line of code.
function ZoomMap(canvas, opts) {
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
  const SANS = 'ui-sans-serif, -apple-system, "Segoe UI", sans-serif';
  const CH = 0.6; // width of a monospace character, in font sizes

  // World sizes. One world unit is one screen pixel at zoom 1.
  const S = {
    nameFont: 13, metaFont: 9.5, header: 42, radius: 0,
    codeFont: 4.2, codeLine: 5.8, bodyPad: 6, maxLines: 140, maxCols: 110,
    cardMinW: 250, cardMaxW: 460,
    gap: 28, sectionGap: 40, sectionLabel: 30, pkgPad: 36, pkgHeader: 78, pkgRadius: 22,
    fileLabel: 44, fileGap: 64,
  };
  // Zoom bands. Package summaries fade out while declarations fade in; a
  // card's name and code fade in when their text is readable on the screen.

  const FILL = [0.55, 0.8];
  const NAME_PX = [5.5, 8];
  const CODE_PX = [4.5, 6.5];
  const MAX_Z = 16;

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const hit = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

  const ctx = canvas.getContext("2d");
  let W = 1, H = 1, dpr = 1;
  const cam = { x: 0, y: 0, z: 1 };
  let C = {};
  let cards = new Map(), pkgs = new Map(), edges = [], pkgEdges = [], bounds = { x: 0, y: 0, w: 1, h: 1 };
  let leaving = []; // cards that fade out after a layout change

  // Code paths: {id, color, label, ids, cards}, drawn as colored lines.
  // activeFlow is the path that is open; hoverFlow the one under the pointer.
  let flows = [], activeFlow = null, hoverFlow = null;
  // intro draws the code paths one at a time when the page opens: path i

  // has this frame, reached the last one that pulsed. at holds when each

  // its end, for the branches; grown the branches that have pulsed.
  let intro = null, pulses = [];
  // branches tie the code no path runs through to the paths, as thin lines
  // in the color of the path each joins; branchEdges are the edges they
  // draw, which the plain edges leave out. branchDepth is how many branches
  // deep each path's longest one goes.
  let branches = [], branchEdges = new Set(), branchDepth = [];
  const INTRO_STEP = 450, INTRO_GAP = 500, PULSE_MS = 900, BRANCH_MS = 380;
  // Comment pins: {id, node, line, pkg, x, y, state, count}. In comment mode

  let notePins = [], activePin = null, commentMode = false;
  let fly = null, wheel = null, inertia = null, tween = null;
  let dirty = true, frame = 0, lastLevel = "", drawMs = 0, lastOpen = 0;
  const tokens = new Map();
  const tokenQueue = [];
  let tokenBusy = false;

  // ---------- colors ----------

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const v = n => cs.getPropertyValue(n).trim();
    C = {
      bg: v("--bg"), panel: v("--panel"), ink: v("--ink"), muted: v("--muted"), line: v("--line"),
      pkgBg: v("--pkg-bg"), codeBg: v("--code-bg"), hl: v("--hl"), grid: v("--grid"),
      added: v("--added"), addedBg: v("--added-bg"), modified: v("--modified"), modifiedBg: v("--modified-bg"),
      caller: v("--caller"), callerBg: v("--caller-bg"), note: v("--note-line"), removed: v("--removed"), removedBg: v("--removed-bg"),
      entry: v("--entry"), entryBg: v("--entry-bg"),
    };
  }
  // Code a path only passes through is muted: it is there to show the way.
  const statusColor = s => s === "added" ? C.added : s === "modified" ? C.modified : s === "entry" ? C.entry : s === "via" ? C.muted : C.caller;
  const statusBg = s => s === "added" ? C.addedBg : s === "modified" ? C.modifiedBg : s === "entry" ? C.entryBg : s === "via" ? C.pkgBg : C.callerBg;
  const isChanged = n => n.status === "added" || n.status === "modified";
  // entryTag is the short label of how execution enters at a declaration.
  const entryTag = e => ({ http: "▶ HTTP", goroutine: "▶ GO", main: "▶ MAIN", module: "▶ TOP LEVEL", root: "NO CALLERS" })[e.kind] || "▶ ENTRY";

  // ---------- layout ----------

  // rowsOf lists the rows a card shows: its source lines, with the lines the
  // change deleted before the line they came before, as a diff shows them.
  // no holds each row's line number, 0 on a deleted row. A run of unchanged
  // lines folds into one row with no -1; folds maps that row to its run.
  // A fold the reader opened stays open.
  function rowsOf(n) {
    const lines = (n.source || "").replace(/\t/g, "    ").split("\n");
    const removed = n.removed || {}, text = [], no = [], folds = new Map();
    const runs = foldPlan(n, keepLines(n, callLinesOf.get(n.id) || [])).filter(([a]) => !unfolded.has(n.id + ":" + a));
    const del = l => { for (const t of removed[l] || []) { text.push(t.replace(/\t/g, "    ")); no.push(0); } };
    for (let i = 0; i < lines.length; i++) {
      const run = runs.find(([a]) => a === n.line + i);
      if (run) {
        folds.set(text.length, run);
        text.push("");
        no.push(-1);
        i = run[1] - n.line;
        continue;
      }
      del(n.line + i);
      text.push(lines[i]);
      no.push(n.line + i);
    }
    del(n.line + lines.length);
    return { text, no, folds };
  }
  // callLinesOf holds, for each declaration, the lines that call code on the
  // map; a fold keeps them. unfolded holds the folds a reader opened, as
  // "id:first line".
  let callLinesOf = new Map();
  const unfolded = new Set();
  let lastData = null;

  // wantWidth is the width a card needs for its name and code.
  function wantWidth(n) {
    const lines = rowsOf(n).text;
    const cols = clamp(Math.max(...lines.map(l => l.trimEnd().length)), 24, S.maxCols);
    const gutterCols = String(n.line + lines.length).length + 2;
    const tag = (n.kind || "func").length * 10 * CH + 12;
    const extra = (n.tests ? 64 : 0) + (n.exported ? 58 : 0) + (n.hasNote ? 16 : 0);
    const nameW = 22 + tag + n.name.length * S.nameFont * CH + 18 + extra;
    const codeW = (cols + gutterCols) * S.codeFont * CH + S.bodyPad * 2 + 4;
    return clamp(Math.max(nameW, codeW), S.cardMinW, S.cardMaxW);
  }

  // measure sizes a card of width w so its whole declaration fits: long or
  // wide code gets a smaller font, so it needs a deeper zoom to read.
  function measure(n, w) {
    const { text: lines, no, folds } = rowsOf(n);
    const cols = clamp(Math.max(...lines.map(l => l.trimEnd().length)), 24, S.maxCols);
    const gutterCols = String(n.line + lines.length).length + 2;
    const shown = Math.min(lines.length, S.maxLines);
    const font = Math.min(S.codeFont * shown / lines.length, (w - S.bodyPad * 2 - 4) / ((cols + gutterCols) * CH));
    const lh = font * S.codeLine / S.codeFont;
    const rowOf = new Map(no.flatMap((l, i) => l > 0 ? [[l, i]] : []));
    for (const [i, [a, b]] of folds) for (let l = a; l <= b; l++) rowOf.set(l, i);
    // The header shrinks with the code font, so at the zoom that reads the
    // code it is the same size on every card.
    const hd = S.header * clamp(font / S.codeFont, 0.2, 1);
    return {
      w, h: hd + lines.length * lh + S.bodyPad * 2, hd, folds, lines, rowNo: no, rowOf,
      refs: refSpans(n, lines, rowOf), locals: localSpans(n, rowOf), font, lh, gutter: gutterCols * font * CH,
      textCols: Math.max(...lines.map(l => l.trimEnd().length)),
    };
  }

  // localSpans places the uses of each local name on the card's rows, so
  // hovering one marks the others. It maps a row to its spans of columns;
  // g numbers the local.
  function localSpans(n, rowOf) {
    const out = new Map();
    const raw = (n.source || "").split("\n");
    (n.locals || []).forEach((group, g) => {
      for (const [line, col, len] of group) {
        const i = rowOf.get(line), text = raw[line - n.line];
        if (i === undefined || text === undefined) continue;
        const c0 = displayCol(text, col - 1), c1 = displayCol(text, col - 1 + len);
        if (!out.has(i)) out.set(i, []);
        out.get(i).push({ c0, c1, g });
      }
    });
    return out;
  }

  // displayCol turns a byte offset in a source line into the column the card
  // draws it at: a tab is four columns, as the card shows it.
  function displayCol(text, bytes) {
    let b = 0, col = 0;
    for (const ch of text) {
      if (b >= bytes) break;
      const cp = ch.codePointAt(0);
      b += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
      col += ch === "\t" ? 4 : ch.length;
    }
    return col;
  }

  // refSpans finds, on each row, the names that refer to another
  // declaration, so a reader can click one to go to it. It maps a row to
  // its spans of columns.
  function refSpans(n, lines, rowOf) {
    const out = new Map();
    for (const r of opts.refsOf?.(n.id) || []) {
      const re = new RegExp(`(?<![\\w$])${r.name.replace(/[$]/g, "\\$&")}(?![\\w$])`, "g");
      for (const l of r.lines) {
        const i = rowOf.get(l);
        if (i === undefined) continue;
        if (!out.has(i)) out.set(i, []);
        for (const m of lines[i].matchAll(re)) out.get(i).push({ c0: m.index, c1: m.index + r.name.length, to: r.to });
      }
    }
    return out;
  }

  // masonry places cards of one width in columns, each card in the column
  // that is shortest so far, so the cards read in order across the rows.
  function masonry(list, cols, cardW) {
    const heights = new Array(cols).fill(0);
    for (const c of list) {
      const i = heights.indexOf(Math.min(...heights));
      c.lx = i * (cardW + S.gap);
      c.ly = heights[i];
      heights[i] += c.h + S.gap;
    }
    return { w: cols * cardW + (cols - 1) * S.gap, h: Math.max(...heights) - S.gap };
  }

  // callDepths gives each code card in a package its depth in the calls
  // inside the package: 0 when nothing in the package calls it, else one
  // more than its deepest caller. A call back up a cycle does not count.
  function callDepths(p, callersOf) {
    const inPkg = new Set(p.cards.map(c => c.id));
    const depth = new Map(), visiting = new Set();
    const visit = id => {
      if (depth.has(id)) return depth.get(id);
      visiting.add(id);
      let d = 0;
      for (const from of callersOf.get(id) || []) {
        if (from !== id && inPkg.has(from) && !visiting.has(from)) d = Math.max(d, visit(from) + 1);
      }
      visiting.delete(id);
      depth.set(id, d);
      return d;
    };
    for (const c of p.cards) visit(c.id);
    return depth;
  }

  // Constants, variables and types go in a lane below the code of their file.
  const isValue = n => n.kind === "const" || n.kind === "var" || n.kind === "type" || n.kind === "sql";

  // layoutFiles places one section's cards as a block per file, the blocks
  // side by side in shelves no wider than maxCols columns. In a block, the
  // code comes first, callers before the code they call, then the values.
  // It returns the size and the file labels, at block-local places.
  function layoutFiles(list, maxCols, cardW, depth) {
    const files = new Map();
    for (const c of list) {
      if (!files.has(c.node.file)) files.set(c.node.file, []);
      files.get(c.node.file).push(c);
    }
    const byLine = (a, b) => a.node.line - b.node.line;
    const byDepth = (a, b) => depth.get(a.id) - depth.get(b.id) || byLine(a, b);
    const colsFor = cs => {
      const area = cs.reduce((s, c) => s + (cardW + S.gap) * (c.h + S.gap), 0);
      return clamp(Math.round(Math.sqrt(area * 1.6) / (cardW + S.gap)), 1, Math.min(maxCols, cs.length));
    };
    const blocks = [...files.keys()].sort().map(file => {
      const cs = files.get(file);
      const code = cs.filter(c => !isValue(c.node)).sort(byDepth);
      const values = cs.filter(c => isValue(c.node)).sort(byLine);
      const cols = colsFor(cs);
      let y = S.fileLabel, w = 0;
      for (const lane of [code, values].filter(l => l.length)) {
        const box = masonry(lane, Math.min(cols, lane.length), cardW);
        for (const c of lane) c.ly += y;
        y += box.h + S.gap;
        w = Math.max(w, box.w);
      }
      return { file, cards: cs, w, h: y - S.gap };
    });
    // Shelves: blocks left to right, a new shelf when the next one does
    // not fit.
    const maxW = maxCols * (cardW + S.gap) - S.gap;
    const labels = [];
    let x = 0, y = 0, shelfH = 0, w = 0;
    for (const b of blocks) {
      if (x > 0 && x + b.w > maxW) { x = 0; y += shelfH + S.sectionGap; shelfH = 0; }
      for (const c of b.cards) { c.lx += x; c.ly += y; }
      labels.push({ label: `${b.file.split("/").pop()} · ${b.cards.length}`, lx: x, ly: y + 24, file: true });
      x += b.w + S.fileGap;
      w = Math.max(w, x - S.fileGap);
      shelfH = Math.max(shelfH, b.h);
    }
    return { w, h: y + shelfH, labels };
  }

  // A package lists its changed declarations first, then the code that uses
  // them, each grouped by file.
  function layoutPackage(p, callersOf) {
    const groups = [
      ["Entry points", p.cards.filter(c => c.node.status === "entry")],
      ["Changed", p.cards.filter(c => isChanged(c.node))],
      ["Calls changed code", p.cards.filter(c => c.node.status === "caller")],
      ["On a code path", p.cards.filter(c => c.node.status === "via")],
    ].filter(g => g[1].length);
    // Every card in a package has the same width, so the columns line up.
    const wants = p.cards.map(c => wantWidth(c.node)).sort((a, b) => a - b);
    const cardW = wants[Math.floor((wants.length - 1) * 0.9)];
    for (const c of p.cards) Object.assign(c, measure(c.node, cardW));
    const area = p.cards.reduce((s, c) => s + (cardW + S.gap) * (c.h + S.gap), 0);
    const headerW = Math.max(p.name.length * 24 * CH, p.path.length * 12 * CH) + 150;
    const depth = callDepths(p, callersOf);
    // place lays the sections out with at most cols columns.
    const place = cols => {
      let y = S.pkgHeader, w = headerW;
      const sections = [];
      for (const [label, list] of groups) {
        sections.push({ label: `${label.toUpperCase()} · ${list.length}`, lx: 0, ly: y + 12 });
        y += S.sectionLabel;
        const box = layoutFiles(list, cols, cardW, depth);
        for (const c of list) { c.lx += S.pkgPad; c.ly += y; }
        for (const l of box.labels) sections.push({ ...l, ly: l.ly + y });
        y += box.h + S.sectionGap;
        w = Math.max(w, box.w);
      }
      return { w: w + S.pkgPad * 2, h: y - S.sectionGap + S.pkgPad, sections };
    };
    // Aim for a package about 1.6 times as wide as it is tall. File blocks
    // leave gaps in their shelves, so try a few column counts from the one
    // the cards' area asks for and keep the best.
    const want = clamp(Math.round(Math.sqrt(area * 1.6) / (cardW + S.gap)), 1, p.cards.length);
    const off = r => Math.abs(Math.log(r.w / r.h / 1.6));
    let best = want;
    for (let cols = want, r0 = null; cols <= Math.min(p.cards.length, want * 2); cols++) {
      const r = place(cols);
      if (!r0 || off(r) < off(r0)) { r0 = r; best = cols; }
    }
    Object.assign(p, place(best));
  }

  function layout(data) {
    const byNode = new Map(data.nodes.map(n => [n.id, n]));
    callLinesOf = new Map();
    for (const e of data.edges) {
      const n = byNode.get(e.from);
      if (!n) continue;
      const lines = (e.lines || []).filter(l => l >= n.line && l <= n.endLine);
      if (lines.length) callLinesOf.set(n.id, [...(callLinesOf.get(n.id) || []), ...lines]);
    }
    const nextCards = new Map(), nextPkgs = new Map();
    for (const n of data.nodes) {
      const c = { id: n.id, node: n, dim: 1, fade: 1 };
      nextCards.set(n.id, c);
      let p = nextPkgs.get(n.package);
      if (!p) {
        p = { id: n.package, path: n.package, name: n.package.split("/").slice(-2).join("/"), cards: [], dim: 1, fade: 1 };
        nextPkgs.set(n.package, p);
      }
      p.cards.push(c);
    }
    // A package's files are the changed files in its folder. An external
    // test package (path ending in _test) shares the folder and shows none.
    const stats = data.stats || {};
    const dirOf = f => f.includes("/") ? f.slice(0, f.lastIndexOf("/")) : ".";
    const owner = new Map();
    for (const p of nextPkgs.values()) {
      const dir = dirOf(p.cards[0].node.file);
      if (!owner.has(dir) || owner.get(dir).path.endsWith("_test")) owner.set(dir, p);
    }
    const callersOf = new Map();
    for (const e of data.edges) {
      if (!callersOf.has(e.to)) callersOf.set(e.to, []);
      callersOf.get(e.to).push(e.from);
    }
    for (const p of nextPkgs.values()) {
      layoutPackage(p, callersOf);
      p.changed = p.cards.filter(c => isChanged(c.node)).length;
      p.tops = p.cards.filter(c => c.node.top).map(c => c.node);
      p.users = p.cards.length - p.changed;
      const dir = dirOf(p.cards[0].node.file);
      p.files = owner.get(dir) === p ? Object.keys(stats).filter(f => dirOf(f) === dir) : [];
      p.added = p.files.reduce((n, f) => n + stats[f].added, 0);
      p.deleted = p.files.reduce((n, f) => n + stats[f].deleted, 0);
    }

    const nextEdges = data.edges.filter(e => nextCards.has(e.from) && nextCards.has(e.to))
      .map(e => ({ ...e, a: nextCards.get(e.from), b: nextCards.get(e.to) }));
    const counts = new Map();
    for (const e of nextEdges) {
      const [from, to] = [e.a.node.package, e.b.node.package];
      if (from === to) continue;
      const k = from + "\n" + to;
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    const nextPkgEdges = [...counts].map(([k, count]) => {
      const [from, to] = k.split("\n");
      return { a: nextPkgs.get(from), b: nextPkgs.get(to), count };
    });

    // Packages are placed with dagre, users below the code they use. Each
    // package gets a slot big enough for its zoomed-out label at the zoom
    // that fits the whole map; that zoom depends on the slots, so it repeats
    // until it settles.
    if (window.dagre) {
      let z = 0;
      for (let pass = 0; pass < 4; pass++) {
        const g = new dagre.graphlib.Graph();
        g.setGraph({ rankdir: "BT", nodesep: 140, ranksep: 180, marginx: 0, marginy: 0 });
        g.setDefaultEdgeLabel(() => ({}));
        for (const p of nextPkgs.values()) {
          const [lw, lh] = labelSize(p, 13);
          p.slotW = z ? Math.max(p.w, (lw + 36) / z) : p.w;
          p.slotH = z ? Math.max(p.h, (lh + 28) / z) : p.h;
          g.setNode(p.id, { width: p.slotW, height: p.slotH });
        }
        for (const e of nextPkgEdges) g.setEdge(e.a.id, e.b.id);
        dagre.layout(g);
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
        for (const p of nextPkgs.values()) {
          const d = g.node(p.id);
          p.x = d.x - p.w / 2; p.y = d.y - p.h / 2;
          x1 = Math.min(x1, d.x - p.slotW / 2); x2 = Math.max(x2, d.x + p.slotW / 2);
          y1 = Math.min(y1, d.y - p.slotH / 2); y2 = Math.max(y2, d.y + p.slotH / 2);
        }
        const next = fitZoom({ w: x2 - x1, h: y2 - y1 }, 40);
        if (z && Math.abs(next - z) / z < 0.03) break;
        z = next;
      }
    } else {
      let x = 0;
      for (const p of nextPkgs.values()) { p.x = x; p.y = 0; x += p.w + 140; }
    }
    for (const c of nextCards.values()) {
      const p = nextPkgs.get(c.node.package);
      c.x = p.x + c.lx; c.y = p.y + c.ly;
    }
    return { cards: nextCards, pkgs: nextPkgs, edges: nextEdges, pkgEdges: nextPkgEdges };
  }

  function computeBounds() {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const p of pkgs.values()) {
      x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y);
      x2 = Math.max(x2, p.x + p.w); y2 = Math.max(y2, p.y + p.h);
    }
    bounds = isFinite(x1) ? { x: x1, y: y1, w: x2 - x1, h: y2 - y1 } : { x: 0, y: 0, w: 1, h: 1 };
  }

  // setData lays the map out. With animate, cards and packages move from
  // their old places to the new ones; new cards fade in and old ones out.
  function setData(data, animate) {
    lastData = data;
    const old = { cards, pkgs };
    const next = layout(data);
    if (animate && old.cards.size) {
      const from = new Map();
      for (const c of next.cards.values()) {
        const o = old.cards.get(c.id);
        from.set(c, o ? { x: o.x, y: o.y, fade: 1 } : { x: c.x, y: c.y, fade: 0 });
      }
      for (const p of next.pkgs.values()) {
        const o = old.pkgs.get(p.id);
        from.set(p, o ? { x: o.x, y: o.y, w: o.w, h: o.h, fade: 1 } : { x: p.x, y: p.y, w: p.w, h: p.h, fade: 0 });
      }
      leaving = [...old.cards.values()].filter(c => !next.cards.has(c.id));
      tween = { start: performance.now(), dur: 520, from, to: new Map([...from.keys()].map(k => [k, { x: k.x, y: k.y, w: k.w, h: k.h }])) };
      for (const [k, f] of from) { k.x = f.x; k.y = f.y; if (k.cards) { k.w = f.w; k.h = f.h; } k.fade = f.fade; }
    } else {
      leaving = [];
      tween = null;
    }
    ({ cards, pkgs, edges, pkgEdges } = next);
    setFlows(data.flows || []);
    if (tween) {
      // Bounds use the end positions, so a fit during the tween is right.
      const now = new Map([...tween.to].map(([k, t]) => [k, { x: k.x, y: k.y, w: k.w, h: k.h }]));
      for (const [k, t] of tween.to) { k.x = t.x; k.y = t.y; if (k.cards) { k.w = t.w; k.h = t.h; } }
      computeBounds();
      for (const [k, t] of now) { k.x = t.x; k.y = t.y; if (k.cards) { k.w = t.w; k.h = t.h; } }
    } else {
      computeBounds();
    }
    hover = null;
    if (selected && !cards.has(selected)) selected = null;
    updateEmphasis();
    request();
  }

  // ---------- camera ----------

  const minZ = () => Math.min(0.05, fitZoom(bounds, 40) * 0.5);
  function fitZoom(r, pad) {
    return clamp(Math.min((W - pad * 2) / Math.max(r.w, 1), (H - pad * 2) / Math.max(r.h, 1)), 0.01, MAX_Z);
  }
  const toWorld = (sx, sy) => [(sx - W / 2) / cam.z + cam.x, (sy - H / 2) / cam.z + cam.y];
  const viewRect = (m = 0) => ({ x: cam.x - W / 2 / cam.z - m, y: cam.y - H / 2 / cam.z - m, w: W / cam.z + 2 * m, h: H / cam.z + 2 * m });

  function zoomAt(sx, sy, z) {
    const [wx, wy] = toWorld(sx, sy);
    cam.z = clamp(z, minZ(), MAX_Z);
    cam.x = wx - (sx - W / 2) / cam.z;
    cam.y = wy - (sy - H / 2) / cam.z;
  }

  function stopMotion() { fly = null; wheel = null; inertia = null; skipIntro(); }

  // flyTo moves the camera along a zoom-out, pan, zoom-in path (van Wijk and
  // Nuij, "Smooth and efficient zooming and panning"), so a long move first
  // shows where it goes.
  function flyTo(target) {
    stopMotion();
    target.z = clamp(target.z, minZ(), MAX_Z);
    const rho = 1.4, rho2 = rho * rho, rho4 = rho2 * rho2;
    const [ux0, uy0, w0] = [cam.x, cam.y, W / cam.z];
    const [ux1, uy1, w1] = [target.x, target.y, W / target.z];
    const dx = ux1 - ux0, dy = uy1 - uy0, d2 = dx * dx + dy * dy;
    let path, S0;
    if (d2 < 1e-6) {
      S0 = Math.log(w1 / w0) / rho;
      path = t => [ux0 + t * dx, uy0 + t * dy, w0 * Math.exp(rho * t * S0)];
    } else {
      const d1 = Math.sqrt(d2);
      const b0 = (w1 * w1 - w0 * w0 + rho4 * d2) / (2 * w0 * rho2 * d1);
      const b1 = (w1 * w1 - w0 * w0 - rho4 * d2) / (2 * w1 * rho2 * d1);
      const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0);
      const r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
      S0 = (r1 - r0) / rho;
      path = t => {
        const s = t * S0, u = w0 / (rho2 * d1) * (Math.cosh(r0) * Math.tanh(rho * s + r0) - Math.sinh(r0));
        return [ux0 + u * dx, uy0 + u * dy, w0 * Math.cosh(r0) / Math.cosh(rho * s + r0)];
      };
    }
    const dur = clamp(Math.abs(S0) * 520, 320, 1300);
    fly = { start: performance.now(), dur, path };
    request();
  }

  // openness is how far package p shows its declarations at zoom z, from
  // 0 (a solid summary) to 1.
  function openness(p, z = cam.z) {
    const fill = Math.max(p.w * z / W, p.h * z / H);
    return Math.max(smooth(PKG_FADE[0], PKG_FADE[1], z), smooth(FILL[0], FILL[1], fill));
  }
  // closedZoom is the largest zoom at which package p is still closed.
  const closedZoom = p => Math.max(PKG_FADE[0], FILL[0] * 0.97 * Math.min(W / p.w, H / p.h));

  // fitRect returns a camera that shows r. It never stops where a package
  // in r is half open: half of each level reads as neither.
  function fitRect(r, { pad = 60, maxZ = MAX_Z, minZoom = 0 } = {}) {
    let z = clamp(fitZoom(r, pad), minZoom, maxZ);
    for (const p of pkgs.values()) {
      if (!overlaps(p, r)) continue;
      const t = openness(p, z);
      if (t > 0.01 && t < 0.99) z = Math.min(z, closedZoom(p));
    }
    return { x: r.x + r.w / 2, y: r.y + r.h / 2, z };
  }
  function union(rects) {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const r of rects) {
      x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y);
      x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h);
    }
    return isFinite(x1) ? { x: x1, y: y1, w: x2 - x1, h: y2 - y1 } : null;
  }
  // Rects at the end of a running layout tween, so a flight aims where things will be.
  const finalRect = k => (tween && tween.to.get(k)) || k;

  function fit(animate = true) {
    const t = fitRect(bounds, { pad: 40 });
    if (animate) flyTo(t); else { stopMotion(); Object.assign(cam, t); request(); }
  }

  // showCode flies to a card close enough to read its code. A long card is
  // shown from its top, or around line when one is given.
  function showCode(id, line) {
    const c = cards.get(id);
    if (!c) return;
    const r = finalRect(c);
    // Aim for code text of 11 to 14 screen pixels. A card too big for the
    // view is shown from its top left, where the code starts.
    const z = clamp(fitZoom(r, 40), 11 / c.font, 14 / c.font);
    const x = r.w * z > W - 80 ? r.x + (W / 2 - 40) / z : r.x + r.w / 2;
    const y = r.h * z <= H - 80 ? r.y + r.h / 2
      : line ? clamp(r.y + c.hd + S.bodyPad + (rowOf(c, line) + 0.5) * c.lh, r.y + (H / 2 - 40) / z, r.y + r.h - (H / 2 - 40) / z)
      : r.y + (H / 2 - 40) / z;
    flyTo({ x, y, z });
  }

  function showIds(ids, { maxZ = 1.1, pad = 70 } = {}) {
    const r = union(ids.map(id => cards.get(id)).filter(Boolean).map(finalRect));
    if (r) flyTo(fitRect(r, { pad, maxZ }));
  }

  function showPackage(id) {
    const p = pkgs.get(id);
    if (p) flyTo(fitRect(finalRect(p), { pad: 50, maxZ: 1.2 }));
  }

  // ---------- emphasis ----------

  // updateEmphasis sets how strongly each card and package is drawn: a
  // selection or a focus dims everything else. A selection inside a focus,
  // as on a code path, keeps both lit.
  function updateEmphasis() {
    let keep = null, keepPkg = null;
    if (selected) {
      keep = new Set([selected, ...(focus && focus.ids || [])]);
      for (const e of edges) {
        if (e.from === selected) keep.add(e.to);
        if (e.to === selected) keep.add(e.from);
      }
    } else if (focus && focus.ids) {
      keep = new Set(focus.ids);
      if (focus.neighbors) for (const e of edges) {
        if (focus.ids.includes(e.from)) keep.add(e.to);
        if (focus.ids.includes(e.to)) keep.add(e.from);
      }
    } else if (focus && focus.pkg) {
      keepPkg = focus.pkg;
    }
    for (const c of cards.values()) {
      c.dimTo = keep ? (keep.has(c.id) ? 1 : 0.16) : keepPkg ? (c.node.package === keepPkg ? 1 : 0.22) : 1;
    }
    for (const p of pkgs.values()) {
      p.dimTo = keep ? (p.cards.some(c => keep.has(c.id)) ? 1 : 0.35) : keepPkg ? (p.id === keepPkg ? 1 : 0.35) : 1;
    }
    request();
  }

  function setFocus(f) { focus = f; updateEmphasis(); }
  function select(id) { selected = id && cards.has(id) ? id : null; updateEmphasis(); }

  // ---------- tokens ----------

  function wantTokens(c) {
    if (tokens.has(c.id) || !opts.tokenize) return null;
    tokens.set(c.id, null);
    tokenQueue.push(c);
    pumpTokens();
    return null;
  }
  async function pumpTokens() {
    if (tokenBusy) return;
    tokenBusy = true;
    while (tokenQueue.length) {
      // Coloring code takes main-thread time, so it waits while the camera moves.
      while (fly || wheel || inertia || drag) await new Promise(r => setTimeout(r, 60));
      await new Promise(r => setTimeout(r, 0));
      const c = tokenQueue.shift();
      try {
        tokens.set(c.id, await opts.tokenize(c.node, c.lines.join("\n")));
      } catch (err) {
        console.warn("map-pr: syntax colors unavailable", err);
        tokenQueue.length = 0;
        break;
      }
      request();
    }
    tokenBusy = false;
  }
  function clearTokens() { tokens.clear(); tokenQueue.length = 0; request(); }

  // ---------- drawing ----------

  function request() {
    dirty = true;
    if (!frame) frame = requestAnimationFrame(tick);
  }

  function tick(now) {
    frame = 0;
    let active = false;
    if (fly) {
      const t = clamp((now - fly.start) / fly.dur, 0, 1);
      const [x, y, w] = fly.path(ease(t));
      cam.x = x; cam.y = y; cam.z = W / w;
      if (t >= 1) fly = null; else active = true;
    }
    if (wheel) {
      const k = wheel.fast ? 0.45 : 0.28;
      const z = Math.exp(lerp(Math.log(cam.z), Math.log(wheel.target), k));
      zoomAt(wheel.sx, wheel.sy, z);
      if (Math.abs(Math.log(wheel.target / cam.z)) < 0.002 || cam.z <= minZ() || cam.z >= MAX_Z) wheel = null; else active = true;
    }
    if (inertia) {
      const dt = Math.min(now - inertia.last, 40);
      inertia.last = now;
      cam.x -= inertia.vx * dt; cam.y -= inertia.vy * dt;
      const decay = Math.exp(-dt / 260);
      inertia.vx *= decay; inertia.vy *= decay;
      if (Math.hypot(inertia.vx, inertia.vy) * cam.z < 0.02) inertia = null; else active = true;
    }
    if (tween) {
      const t = ease(clamp((now - tween.start) / tween.dur, 0, 1));
      for (const [k, f] of tween.from) {
        const to = tween.to.get(k);
        k.x = lerp(f.x, to.x, t); k.y = lerp(f.y, to.y, t);
        if (k.cards) { k.w = lerp(f.w, to.w, t); k.h = lerp(f.h, to.h, t); }
        k.fade = lerp(f.fade, 1, t);
      }
      if (t >= 1) { tween = null; leaving = []; } else active = true;
    }
    if (intro) {
      // A path is done once its line and its branches have grown.
      if (intro.n && now - intro.t0 > (intro.n - 1) * INTRO_STEP + (branchDepth[intro.i] || 0) * BRANCH_MS + INTRO_GAP) {
        intro.ends.set(intro.i, intro.t0 + (intro.n - 1) * INTRO_STEP);
        intro = intro.i + 1 < flows.length ? { ...intro, i: intro.i + 1, t0: now, n: 0, reached: -1 } : null;
      }
      active = true;
    }
    pulses = pulses.filter(p => now - p.t < PULSE_MS);
    if (pulses.length) active = true;
    for (const k of [...cards.values(), ...pkgs.values()]) {
      const d = (k.dimTo ?? 1) - k.dim;
      if (Math.abs(d) > 0.005) { k.dim += d * 0.2; active = true; } else k.dim = k.dimTo ?? 1;
    }
    if (dirty || active) {
      dirty = false;
      const t = performance.now();
      draw(now);
      drawMs = performance.now() - t;
    }
    // A draw that left bitmaps to make sets dirty again.
    if (active || dirty) request();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }

  function setWorld() {
    const z = cam.z;
    ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - cam.x * z), dpr * (H / 2 - cam.y * z));
  }
  function setScreen() { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  const sx = x => (x - cam.x) * cam.z + W / 2;
  const sy = y => (y - cam.y) * cam.z + H / 2;

  function draw() {
    minimapDeadline = performance.now() + 4;
    setScreen();
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);
    drawGrid();

    const view = viewRect(40 / cam.z);
    arrows = [];
    let open = 0;
    for (const p of pkgs.values()) {
      p.t = openness(p);
      if (overlaps(p, view)) open = Math.max(open, p.t);
    }
    setWorld();
    for (const p of pkgs.values()) if (overlaps(p, view)) drawPackage(p, p.t);
    // Cards under a solid package summary are covered, so they are not drawn.
    if (open > 0.01) {
      drawPackageEdges((A, B) => 0.3 * Math.max(A.t, B.t));
      drawEdges(view);
      drawFlows(open, true);
      for (const c of leaving) if (overlaps(c, view)) drawCard(c, openOf(c), 1 - (c.fadeOut = Math.max(0, (c.fadeOut ?? 1) - 0.08)));
      for (const c of cards.values()) if (overlaps(c, view)) drawCard(c, openOf(c), c.fade);
      drawArrows();
    }
    for (const p of pkgs.values()) if (overlaps(p, view)) drawSummary(p, p.t);
    drawPackageEdges((A, B) => 1 - Math.max(A.t, B.t));
    drawFlows(open, false);
    drawPulses();
    drawLabels(view);
    drawFlowBadges();
    drawMarks(view);
    setScreen();
    drawPins();

    lastOpen = open;
    const level = open < 0.5 ? "packages" : cam.z * S.codeFont >= (CODE_PX[0] + CODE_PX[1]) / 2 ? "code" : "decls";
    if (level !== lastLevel) { lastLevel = level; opts.onLevel?.(level); }
  }

  // The dot grid moves and scales with the map, so a pan or zoom always shows motion.
  function drawGrid() {
    const base = 26;
    const step = Math.pow(2, Math.ceil(Math.log2(base / cam.z)));
    const px = step * cam.z;
    const a = smooth(base, base * 1.6, px);
    ctx.fillStyle = C.grid;
    for (const [s, alpha] of [[step, a], [step / 2, 1 - a]]) {
      if (alpha < 0.03) continue;
      const g = s * cam.z;
      ctx.globalAlpha = alpha;
      const ox = ((W / 2 - cam.x * cam.z) % g + g) % g, oy = ((H / 2 - cam.y * cam.z) % g + g) % g;
      for (let x = ox; x < W; x += g) for (let y = oy; y < H; y += g) ctx.fillRect(x - 0.75, y - 0.75, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
  }

  // openOf is how far the package of card c is open.
  const openOf = c => pkgs.get(c.node.package)?.t ?? 1;

  // drawPackage draws a package as a container with a header, as seen at
  // the declaration level.
  function drawPackage(p, t1) {
    const z = cam.z, a = p.fade * lerp(0.35, 1, p.dim);
    ctx.globalAlpha = a;
    roundRect(p.x, p.y, p.w, p.h, S.pkgRadius);
    ctx.fillStyle = C.pkgBg;
    ctx.fill();
    ctx.lineWidth = 1 / z;
    ctx.strokeStyle = C.line;
    ctx.stroke();
    const textA = smooth(5, 8, 22 * z) * t1;
    if (textA > 0.01) {
      ctx.globalAlpha = a * textA;
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = C.ink;
      ctx.font = `600 24px ${SANS}`;
      ctx.fillText(p.name, p.x + S.pkgPad, p.y + 42);
      ctx.fillStyle = C.muted;
      ctx.font = `12px ${MONO}`;
      ctx.fillText(p.path, p.x + S.pkgPad, p.y + 62);
      ctx.font = `600 12px ${SANS}`;
      drawParts(statsParts(p), p.x + p.w - S.pkgPad, p.y + 42, "right");
      ctx.fillStyle = C.muted;
      // A file label is big enough to read among the cards, so it fades out
      // when the code is zoomed in close.
      const fileA = 1 - smooth(32, 56, 20 * z);
      for (const s of p.sections) {
        if (s.file && fileA < 0.01) continue;
        ctx.globalAlpha = a * textA * (s.file ? fileA : 1);
        ctx.font = s.file ? `600 20px ${MONO}` : `600 11px ${SANS}`;
        ctx.fillText(s.label, p.x + S.pkgPad + s.lx, p.y + s.ly + 4);
      }
    }
    // A package that opens while small on the screen gets a header in
    // screen pixels, as its own header is too small to read.
    const compactA = t1 * (1 - smooth(5, 8, 22 * z));
    if (compactA > 0.01) {
      setScreen();
      const size = clamp(S.pkgHeader * z * 0.55, 10, 13);
      const x = sx(p.x) + 14, y = sy(p.y) + Math.max(S.pkgHeader * z / 2, size);
      ctx.globalAlpha = a * compactA;
      ctx.textBaseline = "middle";
      ctx.font = `600 ${size}px ${SANS}`;
      ctx.fillStyle = C.ink;
      ctx.fillText(p.name, x, y);
      const nw = ctx.measureText(p.name).width;
      ctx.font = `600 ${size - 1}px ${SANS}`;
      drawParts(statsParts(p), Math.max(sx(p.x + p.w) - 14, x + nw + 120), y, "right");
      setWorld();
    }
    ctx.globalAlpha = 1;
  }
  // statsParts is a package's diff summary as colored pieces: the top
  // functions it holds (★, where to start reading), files, +added, −deleted.
  const statsParts = p => [
    ...(p.tops.length ? [[`★ ${p.tops.length}`, statusColor(p.tops[0].status)]] : []),
    ...(p.files.length
      ? [[`${p.files.length} file${p.files.length > 1 ? "s" : ""}`, C.muted], [`+${p.added}`, C.added], [`−${p.deleted}`, C.removed]]
      : [["no changed files", C.muted]]),
  ];
  const statsText = p => statsParts(p).map(x => x[0]).join(" ");

  // drawParts draws colored pieces of text on one line, aligned like fillText.
  function drawParts(parts, x, y, align) {
    const gap = ctx.measureText(" ").width * 1.6;
    const widths = parts.map(([t]) => ctx.measureText(t).width);
    const total = widths.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
    let left = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
    const saved = ctx.textAlign;
    ctx.textAlign = "left";
    parts.forEach(([t, color], i) => {
      ctx.fillStyle = color;
      ctx.fillText(t, left, y);
      left += widths[i] + gap;
    });
    ctx.textAlign = saved;
    return total;
  }

  // labelSize measures a package's zoomed-out label at a name size in pixels.
  function labelSize(p, size, name = p.name) {
    ctx.save();
    ctx.font = `600 ${size}px ${SANS}`;
    const nw = ctx.measureText(name).width;
    ctx.font = `${Math.max(size * 0.62, 9)}px ${SANS}`;
    const sw = ctx.measureText(statsText(p)).width * 1.08;
    ctx.restore();
    return [Math.max(nw, sw), size * 2.3];
  }

  const toneOf = p => p.changed ? (p.cards.every(c => c.node.status !== "modified") ? "added" : "modified") : p.cards.every(c => c.node.status === "entry") ? "entry" : p.cards.every(c => c.node.status === "via") ? "via" : "caller";

  // drawSummary covers a package with a solid card and a large label when
  // zoomed out. It fades away as the declarations inside become visible.
  function drawSummary(p, t1) {
    const a = (1 - t1) * p.fade;
    if (a < 0.01) return;
    const z = cam.z, dimA = lerp(0.35, 1, p.dim);
    const tone = toneOf(p);
    ctx.globalAlpha = a * dimA;
    roundRect(p.x, p.y, p.w, p.h, S.pkgRadius);
    ctx.fillStyle = statusBg(tone);
    ctx.fill();
    ctx.lineWidth = 2 / z;
    ctx.strokeStyle = statusColor(tone);
    ctx.stroke();

    ctx.globalAlpha = 1;
  }

  // drawLabels draws the zoomed-out package labels in screen pixels, sized
  // to fit each package. Big packages are labeled first. A label that
  // would cover one already drawn tries the short name, then is left out;
  // the tooltip still names that package.
  function drawLabels(view) {
    const z = cam.z;
    const placed = [];
    const list = [...pkgs.values()].filter(p => overlaps(p, view) && p.t < 0.99).sort((x, y) => y.w * y.h - x.w * x.h);
    for (const p of pkgs.values()) { p.labelHidden = true; p.plate = null; }
    if (!list.length) return;
    setScreen();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const p of list) {
      const w = p.w * z, h = p.h * z;
      const cx = sx(p.x + p.w / 2), cy = sy(p.y + p.h / 2);
      const short = p.name.split("/").pop();
      let pick = null;
      for (const name of short === p.name ? [p.name] : [p.name, short]) {
        const [fw] = labelSize(p, 22, name);
        const size = clamp(Math.min(22, 22 * (w - 20) / fw, h / 2.6), 11, 22);
        const [lw, lh] = labelSize(p, size, name);
        const box = { x: cx - lw / 2 - 8, y: cy - lh / 2 - 2, w: lw + 16, h: lh + 4 };
        if (!placed.some(b => overlaps(b, box))) { pick = { name, size, box, inside: lw + 16 <= w && lh <= h }; break; }
      }
      if (!pick) continue;
      p.labelHidden = false;
      p.plate = pick.box;
      placed.push(pick.box);
      const tone = toneOf(p);
      ctx.globalAlpha = (1 - p.t) * p.fade * lerp(0.35, 1, p.dim);
      // With code paths on the map, each label is a station's name plate
      // over the lines that meet there.
      if (!pick.inside || flows.length) {
        ctx.fillStyle = C.panel;
        roundRect(pick.box.x, pick.box.y, pick.box.w, pick.box.h, 8);
        ctx.fill();
        ctx.strokeStyle = statusColor(tone);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.fillStyle = C.ink;
      ctx.font = `600 ${pick.size}px ${SANS}`;
      ctx.fillText(pick.name, cx, cy - pick.size * 0.5);
      ctx.font = `${Math.max(pick.size * 0.62, 9)}px ${SANS}`;
      drawParts(statsParts(p), cx, cy + pick.size * 0.62, "center");
    }
    ctx.textAlign = "left";
    setWorld();
    ctx.globalAlpha = 1;
  }

  // drawPackageEdges draws the edges between packages; alpha gives each
  // edge's strength from its two packages.
  function drawPackageEdges(alpha) {
    const z = cam.z;
    for (const e of pkgEdges) {
      const A = e.a, B = e.b;
      const a = alpha(A, B);
      if (a < 0.01) continue;
      const ax = A.x + A.w / 2, ay = A.y, bx = B.x + B.w / 2, by = B.y + B.h;
      // From the top of the user package to the bottom of the used one, or sideways when level.
      const [p0, p3] = by <= ay ? [[ax, ay], [bx, by]] : sideAnchors(A, B);
      const dim = Math.min(A.dim, B.dim);
      const width = (1.5 + Math.min(4.5, Math.log2(e.count) * 1.2)) / z;
      // Code paths carry the eye; the package edges stay behind them.
      ctx.globalAlpha = a * lerp(0.15, 0.85, dim) * Math.min(A.fade, B.fade) * (flows.length ? 0.4 : 1);
      ctx.strokeStyle = C.muted;
      ctx.fillStyle = C.muted;
      ctx.lineWidth = width;
      const [c1, c2] = controls(p0, p3, by <= ay);
      curve(p0, c1, c2, p3);
      arrow(c2, p3, 9 / z + width);
      if (e.count > 1 && dim > 0.5 && a > 0.5) {
        const m = bez(p0, c1, c2, p3, 0.5);
        setScreen();
        const label = String(e.count), x = sx(m[0]), y = sy(m[1]);
        ctx.font = `600 11px ${SANS}`;
        const tw = ctx.measureText(label).width + 10;
        ctx.fillStyle = C.bg;
        roundRect(x - tw / 2, y - 9, tw, 18, 9);
        ctx.fill();
        ctx.strokeStyle = C.line;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = C.muted;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, x, y + 0.5);
        ctx.textAlign = "left";
        setWorld();
      }
    }
    ctx.globalAlpha = 1;
  }

  function sideAnchors(A, B) {
    const left = B.x + B.w / 2 < A.x + A.w / 2;
    return [[left ? A.x : A.x + A.w, A.y + A.h / 2], [left ? B.x + B.w : B.x, B.y + B.h / 2]];
  }
  function controls(p0, p3, vertical) {
    if (vertical) {
      const d = Math.max(40, Math.abs(p3[1] - p0[1]) * 0.5);
      return [[p0[0], p0[1] - d], [p3[0], p3[1] + d]];
    }
    const d = Math.max(40, Math.abs(p3[0] - p0[0]) * 0.5) * Math.sign(p3[0] - p0[0] || 1);
    return [[p0[0] + d, p0[1]], [p3[0] - d, p3[1]]];
  }
  function curve(p0, c1, c2, p3) {
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], p3[0], p3[1]);
    ctx.stroke();
  }
  function bez(p0, c1, c2, p3, t) {
    const u = 1 - t;
    return [0, 1].map(i => u * u * u * p0[i] + 3 * u * u * t * c1[i] + 3 * u * t * t * c2[i] + t * t * t * p3[i]);
  }
  function arrow(from, to, size) {
    const ang = Math.atan2(to[1] - from[1], to[0] - from[0]);
    ctx.beginPath();
    ctx.moveTo(to[0], to[1]);
    ctx.lineTo(to[0] - size * Math.cos(ang - 0.42), to[1] - size * Math.sin(ang - 0.42));
    ctx.lineTo(to[0] - size * Math.cos(ang + 0.42), to[1] - size * Math.sin(ang + 0.42));
    ctx.closePath();
    ctx.fill();
  }

  // ---------- code paths ----------

  // Code paths are drawn the way a subway map draws its lines: each runs
  // only straight or at 45°, bends on a rounded corner, and has a thin casing
  // in the background color, so a crossing reads as one line passing over
  // another. Lines between the same two stations run side by side in one
  // bundle. Zoomed out, a closed package is one station where its lines meet,
  // under its name plate; as the package opens, the station splits into the
  // declarations inside.
  function setFlows(list) {
    skipIntro();
    flows = list.map(f => ({ ...f, cards: f.ids.map(id => cards.get(id)).filter(Boolean) })).filter(f => f.cards.length > 1);
    setBranches();
  }
