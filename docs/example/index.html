  // setBranches joins each card off the paths to the nearest card on one,
  // through the fewest edges on the map in either direction. Ties go to the
  // first path. A card that no edge links to a path gets no branch.
  // Each branch also keeps its root, the card on the path it grows from,
  // and its depth, how many branches lie between it and that root.
  function setBranches() {
    branches = [];
    branchEdges = new Set();
    branchDepth = flows.map(() => 0);
    const join = new Map(), queue = [], near = new Map(), root = new Map(), depth = new Map();
    flows.forEach((f, i) => { for (const c of f.cards) if (!join.has(c)) { join.set(c, i); queue.push(c); root.set(c, c); depth.set(c, 0); } });
    for (const e of edges) for (const [x, y] of [[e.a, e.b], [e.b, e.a]]) {
      if (!near.has(x)) near.set(x, []);
      near.get(x).push([y, e]);
    }
    for (let i = 0; i < queue.length; i++) {
      const c = queue[i];
      for (const [d, e] of near.get(c) || []) {
        if (join.has(d)) continue;
        const fi = join.get(c);
        join.set(d, fi);
        root.set(d, root.get(c));
        depth.set(d, depth.get(c) + 1);
        queue.push(d);
        branches.push({ leaf: d, stem: c, e, fi, root: root.get(c), depth: depth.get(d) });
        branchEdges.add(e);
        branchDepth[fi] = Math.max(branchDepth[fi], depth.get(d));
      }
    }
  }

  // drawBranches draws the branches under the path lines, in the layer
  // drawFlows is drawing: a thin line on a casing, fainter the deeper it is,
  // with a small station at the leaf when its package is closed.
  function drawBranches(open, under, k) {
    const w = lerp(1.2, 1.8, open), casing = 1, leaves = [], now = performance.now();
    for (const b of branches) {
      const grow = branchGrowth(b, now);
      if (grow <= 0) continue;
      const f = flows[b.fi];
      // Each branch further from the path is fainter.
      let a = Math.max(0.12, 0.55 * Math.pow(0.6, b.depth - 1));
      if (activeFlow !== null && f.id !== activeFlow) a = 0.1;
      else if (activeFlow === null && selected && selected !== b.leaf.id && selected !== b.stem.id) a = 0.15;
      if (focus && focus.ids && activeFlow === null) a *= 0.3;
      const A = stationOf(b.stem), B = stationOf(b.leaf);
      if (A.key === B.key || a * k < 0.02) continue;
      if (grow >= 1 && intro && !intro.grown.has(b)) {
        intro.grown.add(b);
        pulses.push({ s: B, color: f.color, t: now, soft: true });
      }
      let pts = route(A, B);
      if (grow < 1) pts = cutLine(pts, lengthTo(pts, pts.length - 1) * ease(grow));
      ctx.globalAlpha = a * k;
      ctx.strokeStyle = C.bg;
      ctx.lineWidth = w + casing * 2;
      strokeRounded(pts, 10);
      ctx.strokeStyle = f.color;
      ctx.lineWidth = w;
      strokeRounded(pts, 10);
      if (!under && !B.hub && grow >= 1) leaves.push([B, f.color, a * k]);
    }
    for (const [B, color, a] of leaves) {
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(B.x, B.y, w + 1.5, 0, Math.PI * 2);
      ctx.fillStyle = C.panel;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = color;
      ctx.stroke();
    }
  }

  // stationOf is where a path stops at card c, in screen pixels: the card's
  // center, moving to the center of its package as the package closes. key
  // names the station, so stops in one closed package merge. The open path
  // keeps every stop (whole), so a path inside one package still shows.
  function stationOf(c, whole) {
    const p = whole ? null : pkgs.get(c.node.package);
    const t = p ? smooth(0.3, 0.7, p.t ?? 1) : 1;
    const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
    const x = p ? lerp(p.x + p.w / 2, cx, t) : cx, y = p ? lerp(p.y + p.h / 2, cy, t) : cy;
    return { key: p && t < 0.5 ? "pkg:" + p.id : c.id, hub: !!p && t < 0.5, card: c, x: sx(x), y: sy(y) };
  }

  // route joins two stations with straight and 45° runs: straight, diagonal,
  // straight, with the straight part split between both ends.
  function route(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, ax = Math.abs(dx), ay = Math.abs(dy);
    const d = Math.min(ax, ay), run = (Math.max(ax, ay) - d) / 2;
    if (d < 1 || run < 1) return [[a.x, a.y], [b.x, b.y]];
    const p1 = ax > ay ? [a.x + Math.sign(dx) * run, a.y] : [a.x, a.y + Math.sign(dy) * run];
    const p2 = [p1[0] + Math.sign(dx) * d, p1[1] + Math.sign(dy) * d];
    return [[a.x, a.y], p1, p2, [b.x, b.y]];
  }

  // offsetLine moves a polyline o pixels to its left, with mitered corners,
  // so the lines of a bundle stay parallel through each bend.
  function offsetLine(pts, o) {
    if (!o) return pts;
    const n = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1], l = Math.hypot(dx, dy) || 1;
      n.push([-dy / l, dx / l]);
    }
    return pts.map((p, i) => {
      const a = n[Math.max(0, i - 1)], b = n[Math.min(n.length - 1, i)];
      let mx = a[0] + b[0], my = a[1] + b[1];
      const ml = Math.hypot(mx, my);
      if (ml < 1e-6) { mx = b[0]; my = b[1]; } else { mx /= ml; my /= ml; }
      const k = o / Math.max(0.5, mx * b[0] + my * b[1]);
      return [p[0] + mx * k, p[1] + my * k];
    });
  }

  // flowLines lays out every path for this frame, in screen pixels: its
  // polyline, its stations, and the alpha and width to draw it. open is how
  // far the packages in view are open; the lines are wider when open, as
  // they run behind the cards.
  function flowLines(open) {
    const px = lerp(4.5, 6, open), casing = 1.5, gap = px + casing;
    const runs = flows.map(f => {
      const st = [];
      for (const c of f.cards) {
        const s = stationOf(c, f.id === activeFlow);
        if (!st.length || st[st.length - 1].key !== s.key) st.push(s);
      }
      return st;
    });
    // A bundle is the paths between two stations, in path order.
    const bundles = new Map();
    const bundleKey = (a, b) => a.key < b.key ? a.key + "\n" + b.key : b.key + "\n" + a.key;
    runs.forEach((st, i) => {
      for (let j = 1; j < st.length; j++) {
        const k = bundleKey(st[j - 1], st[j]);
        if (!bundles.has(k)) bundles.set(k, []);
        if (!bundles.get(k).includes(i)) bundles.get(k).push(i);
      }
    });
    const out = [];
    flows.forEach((f, i) => {
      const on = f.id === activeFlow, hot = f.id === hoverFlow;
      const lit = activeFlow === null ? !selected || f.ids.includes(selected) : on;
      let a = on || lit ? 1 : 0.15;
      // A theme's focus dims the paths; a package's does not.
      if (focus && focus.ids && !on && activeFlow === null) a *= 0.3;
      if (hot) a = Math.max(a, 0.95);
      const st = runs[i];
      if (intro && (i > intro.i || (i === intro.i && performance.now() < intro.t0))) return;
      // A path with one station here has nothing to grow; the intro waits
      // one gap on it and goes on.
      if (intro && i === intro.i) intro.n = Math.max(st.length, 1);
      if (a < 0.02 || st.length < 2) return;
      const pts = [];
      for (let j = 1; j < st.length; j++) {
        const A = st[j - 1], B = st[j], list = bundles.get(bundleKey(A, B));
        const slot = (list.indexOf(i) - (list.length - 1) / 2) * gap;
        // The route and its side come from the stations' sorted order, so a
        // bundle is the same whichever way each of its paths runs.
        const fwd = A.key < B.key;
        const seg = offsetLine(fwd ? route(A, B) : route(B, A), slot);
        pts.push(...(fwd ? seg : seg.reverse()));
        if (j === 1) { A.at = pts[0]; A.idx = 0; }
        B.at = pts[pts.length - 1];
        B.idx = pts.length - 1;
      }
      // While the intro plays, the path it is on ends where it has got to,
      // and reach is the last station it has passed.
      let line = pts, reach = Infinity;
      if (intro && i === intro.i) {
        const u = Math.min((performance.now() - intro.t0) / INTRO_STEP, st.length - 1), j = Math.floor(u);
        reach = j;
        if (u < st.length - 1) line = cutLine(pts, lerp(lengthTo(pts, st[j].idx), lengthTo(pts, st[j + 1].idx), ease(u - j)));
      }
      out.push({ f, i, a, w: px + (on || hot ? 1.5 : 0), casing, pts: line, st, gap, bundles: bundles, reach, cut: line !== pts });
    });
    // The open path and the hovered one draw last, on top.
    return out.sort((x, y) => (x.f.id === activeFlow || x.f.id === hoverFlow) - (y.f.id === activeFlow || y.f.id === hoverFlow));
  }

  const dist = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
  // lengthTo is how long a polyline is up to its point i.
  function lengthTo(pts, i) {
    let l = 0;
    for (let k = 1; k <= i; k++) l += dist(pts[k - 1], pts[k]);
    return l;
  }
  // cutLine is the first len pixels of a polyline.
  function cutLine(pts, len) {
    const out = [pts[0]];
    for (let k = 1; k < pts.length; k++) {
      const d = dist(pts[k - 1], pts[k]);
      if (len <= d) {
        const t = d ? len / d : 0;
        out.push([lerp(pts[k - 1][0], pts[k][0], t), lerp(pts[k - 1][1], pts[k][1], t)]);
        return out;
      }
      len -= d;
      out.push(pts[k]);
    }
    return out;
  }
  // strokeRounded strokes a polyline with each corner rounded.
  function strokeRounded(pts, r) {
    const q = [pts[0]];
    for (const p of pts) if (dist(p, q[q.length - 1]) > 0.5) q.push(p);
    ctx.beginPath();
    ctx.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < q.length - 1; i++) {
      ctx.arcTo(q[i][0], q[i][1], q[i + 1][0], q[i + 1][1], Math.min(r, dist(q[i - 1], q[i]) / 2, dist(q[i], q[i + 1]) / 2));
    }
    ctx.lineTo(q[q.length - 1][0], q[q.length - 1][1]);
    ctx.stroke();
  }

  // drawFlows draws the paths in one of two layers. Under the cards, they
  // show between the declarations of open packages and never cover code;
  // over the closed packages, they carry stations: a white dot ringed in the
  // line's color where one path stops, a white disc ringed in ink where
  // several meet (an interchange) and at a closed package. The layers fade
  // into each other as the packages open. A path ends at a bar across the
  // line; drawFlowBadges numbers its start.
  function drawFlows(open, under) {
    if (!flows.length) return;
    const k = under ? open : 1 - open;
    const lines = flowLines(open);
    if (!under) {
      flowFrame = lines;
      // Each station the intro reaches pulses, at every zoom.
      for (const l of lines) if (intro && l.i === intro.i && l.reach > intro.reached) {
        const now = performance.now();
        for (let j = intro.reached + 1; j <= l.reach; j++) {
          pulses.push({ s: l.st[j], color: l.f.color, t: now });
          intro.at.set(l.st[j].card, now);
        }
        intro.reached = l.reach;
      }
    }
    if (k < 0.01) return;
    setScreen();
    ctx.save();
    if (under) {
      // Behind the cards a line stops at each card's edge: the code is not
      // fully opaque, and a line across it is hard to read through.
      const z = cam.z;
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      for (const c of cards.values()) {
        const x = sx(c.x), y = sy(c.y), w = c.w * z, h = c.h * z;
        if (openOf(c) > 0.01 && x < W && y < H && x + w > 0 && y + h > 0) ctx.rect(x, y, w, h);
      }
      ctx.clip("evenodd");
    }
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    drawBranches(open, under, k);
    for (const { f, a, w, casing, pts, cut } of lines) {
      if (pts.length < 2) continue;
      ctx.globalAlpha = a * k;
      ctx.strokeStyle = C.bg;
      ctx.lineWidth = w + casing * 2;
      strokeRounded(pts, 16);
      ctx.strokeStyle = f.color;
      ctx.lineWidth = w;
      strokeRounded(pts, 16);
      if (cut) continue;
      // The end: a bar across the line.
      const e = pts[pts.length - 1], d = pts[pts.length - 2], l = dist(d, e) || 1;
      const nx = -(e[1] - d[1]) / l, ny = (e[0] - d[0]) / l, h = w * 1.4;
      ctx.lineCap = "butt";
      ctx.beginPath();
      ctx.moveTo(e[0] - nx * h, e[1] - ny * h);
      ctx.lineTo(e[0] + nx * h, e[1] + ny * h);
      ctx.lineWidth = w;
      ctx.stroke();
      ctx.lineCap = "round";
    }
    ctx.restore();
    if (under) { ctx.globalAlpha = 1; setWorld(); return; }
    // Stations: each place once, drawn as strongly as its strongest line.
    const places = new Map();
    for (const { f, a, w, st, gap, reach } of lines) for (const s of st.slice(0, reach + 1)) {
      const p = places.get(s.key) || { s, a: 0, w, gap, colors: new Set(), at: s.at };
      p.a = Math.max(p.a, a * k);
      p.colors.add(f.color);
      if (p.colors.size === 1) p.at = s.at;
      places.set(s.key, p);
    }
    for (const { s, a, w, gap, colors, at } of places.values()) {
      const k = colors.size, inter = k > 1 || s.hub;
      const [x, y] = inter ? [s.x, s.y] : at || [s.x, s.y];
      if (x < -40 || y < -40 || x > W + 40 || y > H + 40) continue;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(x, y, inter ? Math.max(w + 2, (k * gap) / 2 + 2) : w * 0.7 + 1, 0, Math.PI * 2);
      ctx.fillStyle = C.panel;
      ctx.fill();
      ctx.lineWidth = inter ? 2.5 : 2;
      ctx.strokeStyle = inter ? C.ink : [...colors][0];
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    setWorld();
  }
  // branchGrowth is how far a branch has grown in the intro, from 0 to 1. It
  // starts when its path reaches its root, or when its path ends if the
  // root was not a station of its own (inside a closed package), and grows
  // after the branches between it and the root.
  function branchGrowth(b, now) {
    if (!intro) return 1;
    if (b.fi > intro.i) return 0;
    let t = intro.at.get(b.root);
    if (t === undefined) t = intro.ends.get(b.fi);
    if (t === undefined) return 0;
    return clamp((now - t - (b.depth - 1) * BRANCH_MS) / BRANCH_MS, 0, 1);
  }

  // drawPulses marks each station the intro reaches in the path's color: an
  // open card glows and fades, and a closed one sends out a growing ring.
  function drawPulses() {
    if (!pulses.length) return;
    setScreen();
    const now = performance.now();
    for (const { s, color, t, soft } of pulses) {
      const k = clamp((now - t) / PULSE_MS, 0, 1), fade = (1 - k) * (soft ? 0.6 : 1);
      const c = s.card;
      ctx.strokeStyle = ctx.fillStyle = color;
      if (!s.hub && openOf(c) > 0.5) {
        const g = 6 * ease(k);
        ctx.beginPath();
        ctx.roundRect(sx(c.x) - g, sy(c.y) - g, c.w * cam.z + g * 2, c.h * cam.z + g * 2, 8);
        ctx.globalAlpha = fade * c.fade * 0.18;
        ctx.fill();
        ctx.globalAlpha = fade * c.fade;
        ctx.lineWidth = 3;
        ctx.stroke();
        continue;
      }
      ctx.globalAlpha = fade;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, lerp(6, 30, ease(k)), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    setWorld();
  }

  // playPaths starts the intro, unless the reader asked for less motion.
  function playPaths() {
    if (!flows.length || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    intro = { i: 0, t0: performance.now() + 400, n: 0, reached: -1, at: new Map(), ends: new Map(), grown: new Set() };
    request();
  }
  // skipIntro ends the intro with every path drawn whole. Anything that
  // moves the map ends it, as the pulses are where the stations were.
  function skipIntro() {
    if (!intro && !pulses.length) return;
    intro = null;
    pulses = [];
    request();
  }

  // flowFrame holds the paths as drawn this frame, for their badges;
  // flowBadges holds where each badge was drawn, for the pointer.
  let flowFrame = [], flowBadges = [];

  // drawFlowBadges numbers each path at its start, after the package labels
  // so no name plate covers a badge. Paths that start at a closed package
  // line up under its name plate, and paths that start at an open card line
  // up on the card's top-left corner. Any other badge sits back along its
  // line from the start, and steps further back when another is there.
  function drawFlowBadges() {
    if (!flows.length || !flowFrame.length) return;
    setScreen();
    ctx.font = `700 11px ${SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const placed = [], rows = new Map();
    flowBadges = [];
    for (const line of flowFrame) {
      const s0 = line.st[0], p = s0.hub ? pkgs.get(s0.card.node.package) : null;
      if (p && p.plate) rows.set(p, [...(rows.get(p) || []), line]);
    }
    const badge = (f, a, X, Y) => {
      placed.push([X, Y]);
      if (a >= 0.3) flowBadges.push({ f, x: X, y: Y });
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(X, Y, 9, 0, Math.PI * 2);
      ctx.fillStyle = f.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = C.bg;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.fillText(String(f.id + 1), X, Y + 0.5);
    };
    for (const [p, list] of rows) {
      const b = p.plate, y = b.y + b.h + 12;
      list.sort((x, y) => x.f.id - y.f.id).forEach((l, i) => badge(l.f, l.a, b.x + b.w / 2 + (i - (list.length - 1) / 2) * 20, y));
    }
    const onCard = new Map();
    for (const { f, a, w, pts, st } of flowFrame) {
      if (st[0].hub && pkgs.get(st[0].card.node.package)?.plate) continue;
      const c = st[0].card;
      if (!st[0].hub && openOf(c) > 0.5) {
        const i = onCard.get(c) || 0;
        onCard.set(c, i + 1);
        const X = sx(c.x) + 4 + i * 20, Y = sy(c.y) - 4;
        if (X > -20 && Y > -20 && X < W + 20 && Y < H + 20) badge(f, a * c.fade, X, Y);
        continue;
      }
      const p0 = pts[0], p1 = pts.find(p => dist(p, p0) > 1) || [p0[0], p0[1] - 1];
      const l = dist(p0, p1), ux = (p0[0] - p1[0]) / l, uy = (p0[1] - p1[1]) / l;
      let back = w + 14, X, Y;
      do { X = p0[0] + ux * back; Y = p0[1] + uy * back; back += 20; } while (placed.some(q => dist(q, [X, Y]) < 19) && back < 200);
      badge(f, a, X, Y);
    }
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
    setWorld();
  }

  // flowAt finds the code path whose line passes within a few pixels of a
  // screen point, drawn strongly enough to see.
  function flowAt(sx0, sy0) {
    if (!flows.length) return null;
    const badge = flowBadges.find(b => Math.hypot(b.x - sx0, b.y - sy0) <= 10);
    if (badge) return badge.f;
    // Behind an open card, the card is what the pointer is on.
    if (lastOpen > 0.5 && pick(sx0, sy0).card) return null;
    let best = null, bestD = Infinity;
    for (const { f, a, w, pts } of flowLines(lastOpen)) {
      if (a < 0.45) continue;
      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], dx = x1 - x0, dy = y1 - y0;
        const t = clamp(((sx0 - x0) * dx + (sy0 - y0) * dy) / (dx * dx + dy * dy || 1), 0, 1);
        const d = Math.hypot(x0 + t * dx - sx0, y0 + t * dy - sy0);
        if (d < w / 2 + 6 && d < bestD) { best = f; bestD = d; }
      }
    }
    return best;
  }

  const codeAlpha = c => smooth(CODE_PX[0], CODE_PX[1], c.font * cam.z);
  // A card whose code is wider than the card scrolls sideways. maxScroll is
  // how far, in world units; scrollOf is where it is now.
  const codeLeft = c => c.x + S.bodyPad + 4 + c.gutter;
  const maxScroll = c => Math.max(0, (c.textCols + 1) * c.font * CH - (c.x + c.w - S.bodyPad - codeLeft(c)));
  const scrollOf = c => clamp(c.scroll || 0, 0, maxScroll(c));
  // rowOf is the row of a card that shows a source line.
  const rowOf = (c, line) => c.rowOf.get(line) ?? clamp(line - c.node.line, 0, c.lines.length - 1);
  const lineY = (c, line) => c.y + c.hd + S.bodyPad + (rowOf(c, line) + 0.5) * c.lh;

  // edgePath runs from the user to the declaration it uses. When the user's
  // code is readable, the edge starts at the line that makes the call.
  function edgePath(e) {
    const A = e.a, B = e.b;
    let p0, p3, vertical;
    if (B.y + B.h <= A.y - 8) {
      p0 = [A.x + A.w / 2, A.y]; p3 = [B.x + B.w / 2, B.y + B.h]; vertical = true;
    } else if (B.y >= A.y + A.h + 8) {
      p0 = [A.x + A.w / 2, A.y + A.h]; p3 = [B.x + B.w / 2, B.y]; vertical = true;
    } else {
      [p0, p3] = sideAnchors(A, B); vertical = false;
    }
    let [c1, c2] = vertical
      ? (() => { const d = Math.max(30, Math.abs(p3[1] - p0[1]) * 0.45) * Math.sign(p3[1] - p0[1]); return [[p0[0], p0[1] + d], [p3[0], p3[1] - d]]; })()
      : controls(p0, p3, false);
    const ca = codeAlpha(A);
    const line = e.lines && e.lines.find(l => l >= A.node.line && l <= A.node.endLine);
    if (ca > 0 && line) {
      const right = B.x + B.w / 2 >= A.x + A.w / 2;
      const q0 = [right ? A.x + A.w : A.x, lineY(A, line)];
      const d = Math.max(40, Math.abs(p3[0] - q0[0]) * 0.4) * (right ? 1 : -1);
      p0 = [lerp(p0[0], q0[0], ca), lerp(p0[1], q0[1], ca)];
      c1 = [lerp(c1[0], q0[0] + d, ca), lerp(c1[1], q0[1], ca)];
    }
    return [p0, c1, c2, p3];
  }

  // arrows holds the head of each edge drawn this frame. The heads are drawn
  // after the cards, so a card never covers one, and a reader can point at
  // one to see every edge that arrives there.
  let arrows = [];
  // arrowPx is an arrow head's size on screen: base when zoomed out, growing
  // with the zoom up to a limit, so it stays easy to see and to hit.
  const arrowPx = base => Math.min(base * (1 + 0.9 * Math.log2(Math.max(cam.z, 1))), 26);
  function drawArrows() {
    for (const a of arrows) {
      ctx.globalAlpha = a.alpha;
      ctx.fillStyle = a.color;
      arrow(a.from, a.p, a.px / cam.z);
    }
    ctx.globalAlpha = 1;
  }
  // hoverPort holds the edges that end where the pointer is.
  let hoverPort = null;

  function drawEdges(view) {
    const z = cam.z;
    const hot = selected || hover;
    const portSet = hoverPort ? new Set(hoverPort.edges) : null;
    const focusSet = focus && focus.ids ? new Set(focus.ids) : null;
    const later = [];
    for (const e of edges) {
      const box = union([e.a, e.b]);
      if (!overlaps(box, view)) continue;
      const t1 = Math.min(openOf(e.a), openOf(e.b));
      if (t1 < 0.01) continue;
      const isHot = hot && (e.from === hot || e.to === hot) || portSet && portSet.has(e);
      const isFocus = focusSet && focusSet.has(e.from) && focusSet.has(e.to);
      if (isHot || isFocus) { later.push([e, isHot, t1]); continue; }
      if (branchEdges.has(e)) continue;
      // Edges to other packages show as package edges until zoomed in; at
      // the declaration level they show for the hovered or selected card.
      const same = e.a.node.package === e.b.node.package;
      const dim = Math.min(e.a.dim, e.b.dim);
      if (!same) continue;
      // An edge from an entry point skips code that is not on the map, so
      // it is dashed.
      ctx.setLineDash(e.via ? [6 / z, 5 / z] : []);
      ctx.globalAlpha = t1 * lerp(0.06, 0.38, dim) * Math.min(e.a.fade, e.b.fade);
      ctx.strokeStyle = C.muted;
      ctx.fillStyle = C.muted;
      ctx.lineWidth = 1.2 / z;
      const [p0, c1, c2, p3] = edgePath(e);
      curve(p0, c1, c2, p3);
      arrows.push({ e, p: p3, from: c2, px: arrowPx(7), color: C.muted, alpha: ctx.globalAlpha });
    }
    for (const [e, isHot, t1] of later) {
      ctx.setLineDash(e.via ? [8 / z, 6 / z] : []);
      ctx.globalAlpha = t1 * 0.95;
      const color = isHot ? C.caller : (focus.color || C.note);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2.2 / z;
      const [p0, c1, c2, p3] = edgePath(e);
      curve(p0, c1, c2, p3);
      arrows.push({ e, p: p3, from: c2, px: arrowPx(9), color, alpha: ctx.globalAlpha });
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function ellipsize(text, maxChars) {
    if (maxChars <= 1) return "";
    return text.length <= maxChars ? text : text.slice(0, maxChars - 1) + "…";
  }

  function drawCard(c, t1, fade) {
    if (t1 < 0.01) return;
    const n = c.node, z = cam.z;
    const a = fade * lerp(0.35, 1, t1) * lerp(0.12, 1, c.dim);
    if (a < 0.01) return;
    ctx.globalAlpha = a;
    const sw = c.w * z;
    if (sw < 5) {
      ctx.fillStyle = statusColor(n.status);
      ctx.fillRect(c.x, c.y, c.w, c.h);
      ctx.globalAlpha = 1;
      return;
    }
    const r = S.radius;
    // A dimmed card fades toward the background, but it is not see-through:
    // edges and code paths behind it would cross its code.
    if (c.dim < 0.99) {
      ctx.globalAlpha = fade * lerp(0.35, 1, t1);
      roundRect(c.x, c.y, c.w, c.h, r);
      ctx.fillStyle = C.bg;
      ctx.fill();
      ctx.globalAlpha = a;
    }
    roundRect(c.x, c.y, c.w, c.h, r);
    ctx.fillStyle = C.panel;
    ctx.fill();
    ctx.lineWidth = (hover === c.id ? 1.6 : 1) / z;
    ctx.strokeStyle = hover === c.id ? C.muted : C.line;
    ctx.stroke();
    // The code area and the status stripe.
    ctx.fillStyle = C.codeBg;
    ctx.beginPath();
    ctx.roundRect(c.x + 1 / z, c.y + c.hd, c.w - 2 / z, c.h - c.hd - 1 / z, [0, 0, r, r]);
    ctx.fill();
    ctx.fillStyle = statusColor(n.status);
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, 5 * c.hd / S.header, c.h, [r, 0, 0, r]);
    ctx.fill();

    if (c.h * z > 18) drawBody(c, a);

    const nameA = smooth(NAME_PX[0], NAME_PX[1], S.nameFont * z * c.hd / S.header);
    if (nameA > 0.01) {
      // Deep in, the header text stops growing at 26 pixels and stays
      // centered in its band, so it does not crowd out the code.
      const k = c.hd / S.header, hs = k * Math.min(1, 26 / (S.nameFont * z * k));
      ctx.globalAlpha = a * nameA;
      ctx.save();
      ctx.translate(c.x, c.y + c.hd / 2);
      ctx.scale(hs, hs);
      ctx.translate(0, -S.header / 2);
      // The header's file and line, in header units, for the pointer.
      c.locW = drawHeader(n, c.w / hs, z * hs, hoverLoc === c);
      c.hs = nameA > 0.5 ? hs : 0;
      ctx.restore();
    } else c.hs = 0;
    // While the name is too small to read, a card wide enough on the
    // screen shows it in screen pixels, cut to fit.
    const compactA = (1 - nameA) * smooth(34, 56, sw) * smooth(12, 18, c.h * z);
    if (compactA > 0.01) drawCompactName(c, a * compactA);
    if (nameA > 0.5) drawStickyName(c, a);
    ctx.globalAlpha = 1;
  }

  // drawStickyName keeps a card's name in view while its header is scrolled
  // above the top of the screen and its code still shows, so a reader deep in
  // a long function always sees which one it is.
  function drawStickyName(c, alpha) {
    const z = cam.z, bandH = 26;
    if (sy(c.y + c.hd) > 0 || sy(c.y + c.h) < bandH * 2 || sy(c.y) > H) return;
    const x = Math.max(sx(c.x), 0), w = Math.min(sx(c.x + c.w), W) - x;
    if (w < 60) return;
    const y = Math.min(0, sy(c.y + c.h) - bandH);
    setScreen();
    ctx.globalAlpha = alpha * 0.96;
    ctx.fillStyle = C.panel;
    ctx.fillRect(x, y, w, bandH);
    ctx.fillStyle = statusColor(c.node.status);
    ctx.fillRect(x, y, 3, bandH);
    ctx.fillStyle = C.line;
    ctx.fillRect(x, y + bandH - 1, w, 1);
    ctx.globalAlpha = alpha;
    ctx.textBaseline = "middle";
    ctx.font = `600 10px ${SANS}`;
    ctx.fillStyle = C.muted;
    const kind = (c.node.kind || "func").toUpperCase();
    ctx.fillText(kind, x + 12, y + bandH / 2);
    const kx = x + 12 + ctx.measureText(kind).width + 8;
    ctx.font = `600 13px ${MONO}`;
    ctx.fillStyle = C.ink;
    let text = c.node.name;
    const maxW = w - (kx - x) - 12, tw = ctx.measureText(text).width;
    if (tw > maxW) text = ellipsize(text, Math.floor(text.length * maxW / tw));
    ctx.fillText(text, kx, y + bandH / 2);
    setWorld();
  }

  function drawCompactName(c, alpha) {
    const z = cam.z;
    setScreen();
    ctx.globalAlpha = alpha;
    ctx.font = `600 10px ${MONO}`;
    ctx.textBaseline = "middle";
    ctx.fillStyle = C.ink;
    const x = sx(c.x) + Math.max(5 * z, 2) + 4, maxW = c.w * z - (x - sx(c.x)) - 4;
    let text = (c.node.top ? "★ " : "") + c.node.name;
    const w = ctx.measureText(text).width;
    if (w > maxW) text = ellipsize(text, Math.floor(text.length * maxW / w));
    ctx.fillText(text, x, sy(c.y) + Math.max(c.hd * z / 2, 7));
    setWorld();
  }

  // drawHeader draws a card's kind, name, place and badges in card-local
  // units, w wide; z is the zoom those units are drawn at.
  // drawHeader draws a card's header in header units and returns the width
  // of its file and line, which link to the PR when there is one.
  function drawHeader(n, w, z, linkHot) {
    ctx.textBaseline = "alphabetic";
    let x = 18;
    const right = w - 14;
    ctx.font = `600 10px ${SANS}`;
    ctx.fillStyle = C.muted;
    const kind = (n.kind || "func").toUpperCase();
    ctx.fillText(kind, x, 19);
    x += ctx.measureText(kind).width + 8;
    // A star marks the highest changed function: start reading here.
    if (n.top) {
      ctx.font = `${S.nameFont}px ${SANS}`;
      ctx.fillStyle = statusColor(n.status);
      ctx.fillText("★", x, 20);
      x += ctx.measureText("★").width + 6;
    }
    // Right side: tests, exported, note.
    let rx = right;
    ctx.textAlign = "right";
    if (n.hasNote) {
      ctx.fillStyle = C.note;
      ctx.beginPath();
      ctx.arc(rx - 4, 15, 3.5, 0, Math.PI * 2);
      ctx.fill();
      rx -= 16;
    }
    if (n.exported) {
      ctx.font = `600 9.5px ${SANS}`;
      const tw = ctx.measureText("PUBLIC").width + 10;
      ctx.strokeStyle = C.line;
      ctx.lineWidth = 1 / z;
      roundRect(rx - tw, 8, tw, 14, 7);
      ctx.stroke();
      ctx.fillStyle = C.muted;
      ctx.textAlign = "center";
      ctx.fillText("PUBLIC", rx - tw / 2, 18.5);
      ctx.textAlign = "right";
      rx -= tw + 8;
    }
    if (n.entry) {
      const label = entryTag(n.entry);
      ctx.font = `700 9.5px ${SANS}`;
      const tw = ctx.measureText(label).width + 12;
      ctx.fillStyle = n.entry.kind === "root" ? C.muted : C.entry;
      roundRect(rx - tw, 8, tw, 14, 7);
      ctx.fill();
      ctx.fillStyle = C.panel;
      ctx.textAlign = "center";
      ctx.fillText(label, rx - tw / 2, 18.5);
      ctx.textAlign = "right";
      rx -= tw + 8;
    }
    if (n.tests) {
      ctx.font = `11px ${SANS}`;
      ctx.fillStyle = C.muted;
      const label = `${n.tests} test${n.tests > 1 ? "s" : ""}`;
      ctx.fillText(label, rx, 19);
      rx -= ctx.measureText(label).width + 10;
    }
    ctx.textAlign = "left";
    ctx.font = `600 ${S.nameFont}px ${MONO}`;
    ctx.fillStyle = C.ink;
    ctx.fillText(ellipsize(n.name, Math.floor((rx - x) / (S.nameFont * CH))), x, 20);
    ctx.font = `${S.metaFont}px ${MONO}`;
    ctx.fillStyle = C.muted;
    // A handler shows its route, the first thing a reviewer looks for.
    const route = n.entry && n.entry.routes && n.entry.routes[0];
    // A long path loses its start, not its end, so the file name stays.
    const prefix = route ? route + "  ·  " : "";
    const pos = `${n.file}:${n.line}`;
    const room = Math.floor((right - 18) / (S.metaFont * CH)) - prefix.length;
    const loc = room > 1 && pos.length > room ? prefix + "…" + pos.slice(pos.length - room + 1) : prefix + pos;
    const text = ellipsize(loc, Math.floor((right - 18) / (S.metaFont * CH)));
    if (linkHot) ctx.fillStyle = C.caller;
    ctx.fillText(text, 18, 34);
    const tw = ctx.measureText(text).width;
    if (linkHot) ctx.fillRect(18, 35.5, tw, 0.8);
    return tw;
  }

  // drawBody draws a card's code: colored bars like a minimap when small,
  // then the text when it is readable. Changed lines and lines that call
  // something on the map are marked at every size.
  function drawBody(c, a) {
    const n = c.node, z = cam.z;
    const top = c.y + c.hd + S.bodyPad, lh = c.lh;
    const x0 = c.x + 5, w0 = c.w - 5 - 1 / z;
    const changed = n.changed || [];
    ctx.globalAlpha = a;
    if (changed.length) {
      ctx.fillStyle = C.addedBg;
      for (const l of changed) ctx.fillRect(x0, top + rowOf(c, l) * lh, w0, lh + 0.01);
      ctx.fillStyle = C.added;
      for (const l of changed) ctx.fillRect(x0, top + rowOf(c, l) * lh, 2, lh + 0.01);
    }
    if (n.removed) {
      ctx.fillStyle = C.removedBg;
      c.rowNo.forEach((l, i) => { if (!l) ctx.fillRect(x0, top + i * lh, w0, lh + 0.01); });
      ctx.fillStyle = C.removed;
      c.rowNo.forEach((l, i) => { if (!l) ctx.fillRect(x0, top + i * lh, 2, lh + 0.01); });
    }
    if (c.callLines) {
      ctx.fillStyle = C.hl;
      for (const l of c.callLines) ctx.fillRect(x0 + 2, top + rowOf(c, l) * lh, w0 - 2, lh + 0.01);
    }
    // A folded run of unchanged lines is a band that says how many lines it
    // holds; a click opens it.
    for (const [i, [from, to]] of c.folds) {
      const y = top + i * lh;
      ctx.globalAlpha = a;
      ctx.fillStyle = hoverFold && hoverFold.card === c && hoverFold.row === i ? C.callerBg : C.pkgBg;
      ctx.fillRect(x0, y, w0, lh);
      if (c.font * z > 4) {
        ctx.fillStyle = C.muted;
        ctx.font = `${c.font}px ${MONO}`;
        ctx.textBaseline = "middle";
        ctx.fillText(`⋯ ${to - from + 1} unchanged lines (${from}–${to}) · click to show`, c.x + S.bodyPad + 4, y + lh / 2);
      }
    }
    const px = c.font * z;
    if (px < 0.5 || c.h * z < 24) return;
    const toks = tokens.get(c.id) ?? (px > 0.7 ? wantTokens(c) : null);
    const codeA = codeAlpha(c);
    const cw = c.font * CH;
    const left = c.x + S.bodyPad + 4 + c.gutter;
    const maxX = c.x + c.w - S.bodyPad;
    ctx.save();
    ctx.beginPath();
    ctx.rect(c.x, c.y + c.hd, c.w, c.h - c.hd);
    ctx.clip();
    if (codeA < 1) {
      const m = minimap(c, toks);
      if (m) {
        ctx.globalAlpha = a * (1 - codeA);
        ctx.drawImage(m.canvas, c.x, c.y + c.hd, c.w, c.h - c.hd);
      }
    }
    if (codeA > 0) {
      ctx.globalAlpha = a * codeA;
      ctx.textBaseline = "middle";
      ctx.font = `${c.font}px ${MONO}`;
      const view = viewRect();
      const first = Math.max(0, Math.floor((view.y - top) / lh)), last = Math.min(c.lines.length, Math.ceil((view.y + view.h - top) / lh));
      ctx.fillStyle = C.muted;
      ctx.textAlign = "right";
      for (let i = first; i < last; i++) {
        if (c.rowNo[i] < 0) continue;
        const on = hoverLine && hoverLine.card === c && hoverLine.row === i;
        ctx.fillStyle = on ? C.note : c.rowNo[i] ? C.muted : C.removed;
        ctx.fillText(c.rowNo[i] ? String(c.rowNo[i]) : "−", left - cw, top + (i + 0.5) * lh);
        if (on) {
          const tw = ctx.measureText(String(c.rowNo[i])).width;
          ctx.fillRect(left - cw - tw, top + (i + 0.5) * lh + c.font * 0.6, tw, Math.max(c.font * 0.08, 1 / cam.z));
        }
      }
      ctx.textAlign = "left";
      // The code scrolls sideways under the line numbers, which stay put.
      const scroll = scrollOf(c), ox = left - scroll;
      if (scroll > 0) {
        ctx.beginPath();
        ctx.rect(left - cw * 0.5, c.y + c.hd, c.x + c.w - (left - cw * 0.5), c.h - c.hd);
        ctx.clip();
      }
      if (hoverRef && hoverRef.card === c) {
        ctx.fillStyle = C.callerBg;
        ctx.fillRect(ox + hoverRef.c0 * cw, top + hoverRef.row * lh, (hoverRef.c1 - hoverRef.c0) * cw, lh);
      }
      // Every use of the hovered local name is marked, as an editor does.
      if (hoverLocal && hoverLocal.card === c) {
        const alpha = ctx.globalAlpha;
        ctx.globalAlpha = alpha * 0.35;
        ctx.fillStyle = C.note;
        for (const [i, spans] of c.locals) {
          for (const r of spans) if (r.g === hoverLocal.g) ctx.fillRect(ox + r.c0 * cw, top + i * lh, (r.c1 - r.c0) * cw, lh);
        }
        ctx.globalAlpha = alpha;
        for (const [i, spans] of c.locals) {
          for (const r of spans) if (r.g === hoverLocal.g) ctx.fillRect(ox + r.c0 * cw, top + (i + 0.9) * lh, (r.c1 - r.c0) * cw, Math.max(lh * 0.06, 1 / z));
        }
      }
      for (let i = first; i < last; i++) {
        const y = top + (i + 0.5) * lh;
        if (toks && toks[i]) {
          let col = 0;
          for (const t of toks[i]) {
            if (t.text.trim()) {
              ctx.fillStyle = t.color || C.ink;
              ctx.fillText(t.text, ox + col * cw, y);
            }
            col += t.text.length;
          }
        } else {
          ctx.fillStyle = C.ink;
          ctx.fillText(c.lines[i], ox, y);
        }
      }
      // A name that refers to another declaration is underlined, as a link.
      const thin = Math.max(lh * 0.05, 1 / z);
      for (let i = first; i < last; i++) {
        for (const r of c.refs.get(i) || []) {
          const on = hoverRef && hoverRef.card === c && hoverRef.row === i && hoverRef.c0 === r.c0;
          ctx.fillStyle = on ? C.caller : C.muted;
          ctx.globalAlpha = a * codeA * (on ? 1 : 0.5);
          ctx.fillRect(ox + r.c0 * cw, top + (i + 0.9) * lh, (r.c1 - r.c0) * cw, on ? thin * 1.5 : thin);
        }
      }
      // A thin bar shows that the code scrolls sideways, and where it is.
      const max = maxScroll(c);
      if (max > 0) {
        const track = maxX - left, view = track / (track + max);
        const thumb = Math.max(track * view, 12 / z);
        ctx.globalAlpha = a * codeA * 0.5;
        ctx.fillStyle = C.muted;
        ctx.fillRect(left + (track - thumb) * scroll / max, c.y + c.h - S.bodyPad * 0.7, thumb, Math.max(S.bodyPad * 0.35, 2 / z));
      }
    }
    ctx.restore();
  }

  // pins labels marked cards while their own names are too small to read,
  // as a map labels places. A label that would cover another is left out.
  function pins(list, alpha, color) {
    setScreen();
    ctx.font = `600 12px ${MONO}`;
    ctx.textBaseline = "middle";
    const placed = [];
    for (const c of list) {
      const text = c.node.name.length > 42 ? c.node.name.slice(0, 41) + "…" : c.node.name;
      const w = ctx.measureText(text).width + 18, h = 22;
      const x = sx(c.x + c.w / 2) - w / 2, y = sy(c.y) - h - 6;
      const box = { x, y, w, h };
      if (placed.some(b => overlaps(b, { x: box.x - 4, y: box.y - 2, w: box.w + 8, h: box.h + 4 }))) continue;
      placed.push(box);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = C.panel;
      roundRect(x, y, w, h, 11);
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = color;
      ctx.stroke();
      ctx.beginPath(); // the pointer under the label
      ctx.moveTo(x + w / 2 - 5, y + h);
      ctx.lineTo(x + w / 2, y + h + 5);
      ctx.lineTo(x + w / 2 + 5, y + h);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.fillStyle = C.ink;
      ctx.fillText(text, x + 9, y + h / 2 + 0.5);
    }
    setWorld();
    ctx.globalAlpha = 1;
  }

  // minimap returns a bitmap of a card's code drawn as colored bars, at a
  // resolution that suits the zoom. Bitmaps are kept, up to a pixel budget,
  // so a frame draws one image per card instead of a bar per token.
  const minimaps = new Map();
  let minimapPixels = 0, minimapDeadline = 0;
  function minimap(c, toks) {
    const bodyH = c.h - c.hd;
    const want = Math.pow(2, Math.ceil(Math.log2(Math.max(cam.z * dpr, 1 / 16))));
    const scale = Math.min(want, 4, 2048 / c.w, 4096 / bodyH);
    let m = minimaps.get(c.id);
    const fresh = m && m.scale === scale && m.colored === !!toks && m.w === c.w;
    // Making bitmaps is limited per frame; until a card gets its turn, its
    // old bitmap is drawn scaled, or none at all.
    if (fresh || performance.now() > minimapDeadline) {
      if (!fresh) dirty = true;
      if (!m) return null;
      minimaps.delete(c.id);
      minimaps.set(c.id, m); // most recently used last
      return m;
    }
    if (m) minimapPixels -= m.pixels;
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.ceil(c.w * scale));
    canvas.height = Math.max(1, Math.ceil(bodyH * scale));
    const g = canvas.getContext("2d");
    g.scale(scale, scale);
    g.globalAlpha = 0.6;
    const lh = c.lh, cw = c.font * CH, bh = lh * 0.56;
    const left = S.bodyPad + 4 + c.gutter, maxX = c.w - S.bodyPad;

  // ---------- comments ----------

  // anchorAt names what is under a screen point, for a new comment: a card

  function anchorAt(x0, y0) {

      const top = c.y + c.hd + S.bodyPad;

        let i = clamp(Math.floor((y - top) / c.lh), 0, c.lines.length - 1);

  // ---------- input ----------

    console.warn("map-pr: syntax-highlighted diff unavailable, showing plain diff", err);
  }
}

// linkRefs turns each name in a source block that refers to another
// declaration into a link to its definition. It runs on the plain source
// and again after syntax coloring replaces it.
function linkRefs(pre) {
  const n = declOf(pre.dataset.node);
  const rows = pre.querySelectorAll(".code");
  for (const u of USES[n.id] || []) {
    const to = declOf(u.to);
    if (!to) continue;
    const name = identName(to);
    for (const line of u.lines) {
      const cell = rows[line - n.line];
      if (!cell) continue;
      const spans = [...cell.querySelectorAll("span")].filter(sp => sp.textContent === name && !sp.classList.contains("ref"));
      if (spans.length) {
        for (const sp of spans) { sp.classList.add("ref"); sp.dataset.ref = u.to; }
      } else if (!cell.querySelector("span")) {
        const re = new RegExp(`\\b${name.replace(/[$]/g, "\\$&")}\\b`, "g");
        cell.innerHTML = cell.innerHTML.replace(re, m => `<span class="ref" data-ref="${esc(u.to)}">${m}</span>`);
      } else {
        // A token holds more than the name: wrap the name inside it.
        for (const sp of cell.querySelectorAll("span:not(.ref)")) {
          if (sp.children.length || !new RegExp(`\\b${name}\\b`).test(sp.textContent)) continue;
          sp.innerHTML = sp.innerHTML.replace(new RegExp(`\\b${name}\\b`, "g"), m => `<span class="ref" data-ref="${esc(u.to)}">${m}</span>`);
        }
      }
    }
  }
}

// openDecl shows a declaration: on the map if it is there, else its definition.
const openDecl = id => byId[id] ? selectNode(id) : showDef(id);
// refTo follows a name in code.
const refTo = id => openDecl(id);

// showDef shows the definition of code the PR does not change, with the
// declarations on this map that use it.
function showDef(id) {
  const d = DEFS[id];
  if (!d) return;
  leavePath();
  const users = usersOfDecl(id).filter(x => declOf(x));
  const total = d.endLine - d.line + 1, shown = d.source.split("\n").length;
  setPanel(`
    <span class="back" data-back>← Back</span>
    <h2><span class="kind">${esc(d.kind)}</span> ${esc(d.name)}</h2>
    <span class="badge unchanged">not changed in this PR</span>
    <div class="loc">${fileLink(d.file, d.line)}</div>
    <h3>Used here by</h3>
    ${linkList(users.map(x => [x, `<span class="name">${byId[x] ? badge(byId[x]) + " " : ""}<span class="kind">${esc(declOf(x).kind)}</span> ${esc(declOf(x).name)}</span> <span class="loc">${esc(declOf(x).file)}</span>`]))}
    <h3>Definition</h3>
    ${srcHead(d)}
    ${codeBlock(d, [], false)}
    ${shown < total ? `<p class="empty">The first ${shown} of ${total} lines. The rest is in the file.</p>` : ""}`);
  record("def=" + id);
}

// highlightCode colors a declaration's source in place, so the line numbers
// and the changed and call-site marks stay.
async function highlightCode(pre) {
  const n = declOf(pre.dataset.node);
  try {
    const [hl, lang] = await highlighter(n.file);
    const { tokens } = hl.codeToTokens(n.source, { lang, themes: { light: "pierre-light", dark: "pierre-dark" } });
    const cells = pre.querySelectorAll(".code");
    tokens.forEach((line, i) => {
      if (!cells[i]) return;
      cells[i].innerHTML = line.map(t => {
        const style = typeof t.htmlStyle === "string" ? t.htmlStyle
          : Object.entries(t.htmlStyle || { color: t.color }).map(([k, v]) => `${k}:${v}`).join(";");
        return `<span style="${esc(style)}">${esc(t.content)}</span>`;
      }).join("");
    });
    linkRefs(pre);
  } catch (err) {
    console.warn("map-pr: syntax-highlighted source unavailable, showing plain source", err);
  }
}

const panel = document.getElementById("panel");
panel.addEventListener("click", e => {
  const fold = e.target.closest(".ln.fold");
  if (fold) {
    const pre = fold.closest("pre");
    for (const ln of pre.querySelectorAll(`.ln[data-in="${fold.dataset.fold}"]`)) ln.classList.remove("folded");
    fold.remove();
    return;
  }
  const ref = e.target.closest(".ref");
  if (ref) { e.preventDefault(); refTo(ref.dataset.ref); }
});

// setPanel fills the side panel.
function setPanel(html) {
  map.setActivePin(null);
  panel.innerHTML = html;
  panel.scrollTop = 0;
  for (const li of panel.querySelectorAll("li[data-id], li.group > div[data-id]")) li.onclick = () => openDecl(li.dataset.id);
  for (const b of panel.querySelectorAll("[data-back]")) b.onclick = () => history.length > 1 ? history.back() : home();
  for (const pre of panel.querySelectorAll("pre.src[data-node]")) linkRefs(pre);
  for (const li of panel.querySelectorAll("li[data-theme]")) li.onclick = () => showTheme(li.dataset.theme);
  for (const li of panel.querySelectorAll("li[data-pkg]")) li.onclick = () => selectPackage(li.dataset.pkg);
  for (const b of panel.querySelectorAll("[data-home]")) b.onclick = () => home();
  for (const b of panel.querySelectorAll("[data-code]")) b.onclick = () => map.showCode(b.dataset.code);
  for (const b of panel.querySelectorAll("[data-path]")) b.onclick = () => showPath(+b.dataset.path);
  for (const li of panel.querySelectorAll("li[data-thread]")) li.onclick = () => focusThread(li.dataset.thread);
  for (const b of panel.querySelectorAll("[data-ask]")) b.onclick = () => attachTo({ node: b.dataset.ask, line: 0 });
  if (comments.on) {
    for (const pre of panel.querySelectorAll("pre.src[data-node]")) {
      pre.classList.add("askable");
      pre.querySelectorAll(".no").forEach(no => {
        no.title = "Ask Claude about this line";
        no.onclick = () => attachTo({ node: pre.dataset.node, line: +no.textContent });
      });
    }
  }
  for (const pre of panel.querySelectorAll("pre[data-node]")) highlightCode(pre);
  for (const d of panel.querySelectorAll("details[data-file]")) {
    if (d.open) highlightFile(d);
    d.addEventListener("toggle", () => d.open && highlightFile(d));
  }
}

// ensureShown turns tests on when a view needs one that is hidden.
function ensureShown(ids) {
  if (ids.some(id => byId[id].isTest) && !testsToggle.checked) {
    testsToggle.checked = true;
    map.setData(mapData(), true);
  }
}

// where says where an edge's call is: its lines, or for an edge from an
// entry point, the calls off the map in between.
const where = (e, prefix = "") => e.via
  ? `through ${e.via.length ? e.via.map(esc).join(" → ") : "a direct call"}`
  : prefix + (e.lines || []).join(", ");

function showNode(id) {
  const n = byId[id];
  const uses = edges.filter(e => e.from === id);
  const usedBy = edges.filter(e => e.to === id);
  let usedByNote = "";
  if (n.hidden > 0) usedByNote = `<p class="empty">${n.hidden} more not on the map.</p>`;
  else if (!n.expanded && n.callers > 0) usedByNote = `<p class="empty">${n.callers} more not shown (raise -depth).</p>`;
  const exported = n.exported
    ? `<span class="badge exported">public</span><p class="empty">Code outside this repository can use it. The map shows only users in this repository.</p>`
    : "";
  const themes = themesOf(n).map(t =>
    `<li data-theme="${esc(t.id)}"><span class="chip" style="background:${t.color}"></span><span class="title">${esc(t.title)}</span></li>`).join("");
  const note = noteOf(n);
  const viaEdges = n.status === "entry" ? uses.filter(e => e.via) : [];
  const entryInfo = n.entry ? `<h3>Entry point</h3><p>${entryPill(n)} ${esc(entryText(n.entry))}</p>` +
    (viaEdges.length ? `<p class="empty">Reaches the changes through code that is not on the map:</p>` +
      linkList(viaEdges.map(e => [e.to, `<span class="path">${esc(n.name)} → ${e.via.map(v => esc(v) + " → ").join("")}</span>` +
        `<span class="name">${kindTag(byId[e.to])} ${esc(byId[e.to].name)}</span>`])) : "") : "";
  const from = [...reach(id, true)].filter(([x]) => byId[x].entry).sort((a, b) => a[1] - b[1]);
  const reachedFrom = !n.entry || n.status !== "entry" ? `<h3>Reached from</h3>` + (from.length
    ? linkList(from.slice(0, 12).map(([x, hops]) => [x, `<span class="name">${entryPill(byId[x])} ${esc(byId[x].name)}</span>` +
      ` <span class="loc">${esc(byId[x].entry.kind === "http" && byId[x].entry.routes ? byId[x].entry.routes[0] : entryText(byId[x].entry))} · ${hops} call${hops === 1 ? "" : "s"} up</span>`])) +
      (from.length > 12 ? `<p class="empty">${from.length - 12} more.</p>` : "")
    : `<p class="empty">No entry point found within reach on the map.</p>`) : "";

  setPanel(`
    <span class="back" data-home>← Overview</span>
    <h2>${kindTag(n)} ${esc(n.name)}</h2>
    ${badge(n)} ${entryPill(n)} ${exported}
    <div class="loc">${esc(n.package)}<br>${fileLink(n.file, n.line)}</div>
    ${note ? `<div class="note">${md(note)}</div>` : ""}
    ${themes ? `<h3>Part of</h3><ul class="links themes">${themes}</ul>` : ""}
    ${entryInfo}
    ${pathsThrough(id).length ? `<h3>Code paths through here</h3><ul class="links">${pathsThrough(id).map(pathRow).join("")}</ul>` : ""}
    ${reachedFrom}
    <h3>Uses these changes</h3>
    ${linkList(uses.filter(e => !viaEdges.includes(e)).map(e => [e.to, `<span class="name">${kindTag(byId[e.to])} ${esc(byId[e.to].name)}</span> <span class="loc">${where(e, "line ")}</span>`]))}
    ${(() => {
      const plain = (USES[id] || []).filter(u => DEFS[u.to]);
      return plain.length ? `<h3>Also uses (not changed)</h3>` + linkList(plain.map(u => [u.to,
        `<span class="name"><span class="kind">${esc(DEFS[u.to].kind)}</span> ${esc(DEFS[u.to].name)}</span> <span class="loc">line ${u.lines.join(", ")}</span>`])) : "";
    })()}
    <h3>Used by</h3>
    ${linkList(usedBy.map(e => [e.from, `<span class="name">${kindTag(byId[e.from])} ${esc(byId[e.from].name)}</span> <span class="loc">${e.via ? where(e) : esc(byId[e.from].file) + ":" + where(e)}</span>`]))}
    ${usedByNote}
    ${comments.on ? `<h3>Questions <button class="mini" data-ask="${esc(id)}">Ask about this</button></h3>
    <div class="questions" data-for="${esc(n.key)}">${threadList(threadsAt(n.key))}</div>` : ""}
    <h3>Source <button class="mini" data-code="${esc(id)}">Zoom to code</button></h3>
    ${srcHead(n, comments.on ? ` <span class="hint">· click a line number to ask Claude about it</span>` : "")}
    ${codeBlock(n, uses.flatMap(e => e.lines || []), true, callTips(uses))}`);
}

// selectNode shows a declaration. From the panel or a link the map flies to
// it with its neighbors; a click on the map leaves the camera alone.
function selectNode(id, { fly = true } = {}) {
  leavePath();
  ensureShown([id]);
  map.setFocus(null);
  map.select(id);
  // The map zooms in to the declaration's code; its edges to callers and
  // callees stay lit while it is selected.
  if (fly) map.showCode(id);
  showNode(id);
  record("node=" + byId[id].key);
}

// ---------- code paths ----------

// A code path is one chain of calls from an entry point down to a change
// that calls nothing more on the map. The map draws each path as a colored
// line through its declarations, like a transit line: where lines share a
// declaration, the paths meet. A few paths are picked so that together they
// reach every change an entry point reaches, and start at every entry point.
const PATH_COLORS = ["#e03131", "#1971c2", "#2f9e44", "#f08c00", "#9c36b5", "#0c8599", "#d6336c", "#5c940d", "#e8590c", "#3b5bdb", "#862e9c", "#495057"];
const MAX_PATHS = 12;
const isCode = n => !["const", "var", "type", "sql"].includes(kindOf(n));
const calleesOf = new Map();
for (const e of edges) {
  const t = byId[e.to];
  if (!t || t.isTest || !isCode(t) || byId[e.from].isTest) continue;
  const list = calleesOf.get(e.from) || [];
  if (!list.includes(e.to)) list.push(e.to);
  calleesOf.set(e.from, list);
}

// pathsFrom lists the chains of calls from id to each end, at most limit.
function pathsFrom(id, limit = 400) {
  const out = [], path = [id];
  (function dfs(cur) {
    const next = (calleesOf.get(cur) || []).filter(x => !path.includes(x));
    if (!next.length) { if (path.length > 1) out.push([...path]); return; }
    for (const x of next) {
      if (out.length >= limit) return;
      path.push(x);
      dfs(x);
      path.pop();
    }
  })(id);
  return out;
}

const codePaths = (() => {
  const cands = entryGroups.flatMap(g => pathsFrom(g[0].n.id));
  const covered = new Set(), started = new Set(), out = [];
  while (out.length < MAX_PATHS) {
    let best = null, bestGain = 0;
    for (const p of cands) {
      // A path from code with no callers counts half: a route or a worker
      // shows how execution really gets there.
      const weight = byId[p[0]].entry.kind === "root" ? 0.5 : 1;
      const gain = weight * (2 * p.filter(x => isChange(byId[x]) && !covered.has(x)).length + (started.has(p[0]) ? 0 : 1));
      if (gain > bestGain || gain > 0 && gain === bestGain && p.length < best.length) { best = p; bestGain = gain; }
    }
    if (!best) break;
    for (const x of best) covered.add(x);
    started.add(best[0]);
    out.push(best);
  }
  return out.map((ids, i) => {
    const start = byId[ids[0]], end = byId[ids[ids.length - 1]];
    // Top-level code has no name of its own, so its file names it.
    const from = start.entry && start.entry.kind === "http" && start.entry.routes ? start.entry.routes[0]
      : start.entry && start.entry.kind === "module" ? start.file.split("/").pop() : start.name;
    return { id: i, ids, color: PATH_COLORS[i % PATH_COLORS.length], label: `${from} → ${end.name}`, changes: ids.filter(x => isChange(byId[x])).length };
  });
})();
const pathsThrough = id => codePaths.filter(p => p.ids.includes(id));
const pathChip = p => `<span class="path-chip" style="background:${p.color}">${p.id + 1}</span>`;

// pathView is the open path and its current station, or null.
let pathView = null;

// callFrom says how station a calls station b: at the lines of the call, or
// through the code off the map in between.
function callFrom(a, b) {
  const es = edges.filter(e => e.from === a && e.to === b);
  const via = es.find(e => e.via);
  if (via) return via.via.length ? `through ${via.via.map(esc).join(" → ")}` : "directly";
  const n = byId[a], lines = [...new Set(es.flatMap(e => e.lines || []))].sort((x, y) => x - y);
  if (!lines.length) return "";
  const src = (n.source || "").split("\n")[lines[0] - n.line];
  return `at line ${lines.join(", ")}` + (src ? `: <code>${esc(src.trim())}</code>` : "");
}

// showPath shows one code path: the map lights its line, and the panel lists
// its stations in call order. With at, the map zooms in to that station's
// code, at the line that calls the next one.
function showPath(i, at = null) {
  const p = codePaths[i];
  if (!p) return home();
  at = at === null ? null : clamp(at, 0, p.ids.length - 1);
  pathView = { i, at };
  map.setFlow(i);
  map.setFocus({ ids: p.ids, color: p.color });
  const cur = at === null ? null : p.ids[at];
  map.select(cur);
  const callLines = j => j < p.ids.length - 1
    ? edges.filter(e => e.from === p.ids[j] && e.to === p.ids[j + 1]).flatMap(e => e.lines || []) : [];
  if (cur) map.showCode(cur, callLines(at)[0]); else map.showIds(p.ids);

  const start = byId[p.ids[0]];
  const stations = p.ids.map((id, j) => {
    const n = byId[id], others = pathsThrough(id).filter(o => o !== p);
    const call = j < p.ids.length - 1 ? callFrom(id, p.ids[j + 1]) : "";
    return `<li data-station="${j}" class="${j === at ? "cur" : ""}${others.length ? " interchange" : ""}"><div>` +
      `<span class="name">${badge(n)} ${kindTag(n)} ${esc(n.name)}</span>` +
      `<div class="loc">${fileLink(n.file, n.line)}</div>` +
      (noteOf(n) ? `<div class="note small">${md(noteOf(n))}</div>` : "") +
      (call ? `<div class="call">calls ${esc(byId[p.ids[j + 1]].name)} ${call}</div>` : "") +
      (others.length ? `<div class="also">Also on ${others.map(o => `<span data-path="${o.id}" title="${esc(o.label)}">${pathChip(o)}</span>`).join(" ")}</div>` : "") +
      `</div></li>`;
  }).join("");
  const here = cur && byId[cur];
  setPanel(`
    <span class="back" data-home>← Overview</span>
    <div class="path-nav">
      <span class="count">${pathChip(p)} Path ${i + 1} of ${codePaths.length} · ${at === null ? `${p.ids.length} steps` : `step ${at + 1} of ${p.ids.length}`}</span>
      <button data-path-at="${at === null ? -1 : at - 1}" ${at === null ? "disabled" : ""}>← Back</button>
      <button class="primary" data-path-at="${at === null ? 0 : at + 1}" ${at === p.ids.length - 1 ? "disabled" : ""}>${at === null ? "Start" : "Next"} →</button>
    </div>
    <h2>${esc(p.label)}</h2>
    <p class="empty">${entryPill(start)} ${start.entry ? esc(entryText(start.entry)) : ""}. Reaches ${p.changes} change${p.changes === 1 ? "" : "s"}.</p>
    <ol class="stations" style="--path:${p.color}">${stations}</ol>
    <p class="hint">← → step through the path · click a step to go to its code</p>
    ${here ? `<h3>Source <button class="mini" data-code="${esc(cur)}">Zoom to code</button></h3>
    ${srcHead(here)}
    ${codeBlock(here, callLines(at))}` : ""}`);
  for (const li of panel.querySelectorAll("li[data-station]")) li.onclick = e => { if (!e.target.closest("[data-path], a")) showPath(i, +li.dataset.station); };
  for (const b of panel.querySelectorAll("[data-path-at]")) b.onclick = () => showPath(i, +b.dataset.pathAt < 0 ? null : +b.dataset.pathAt);
  panel.querySelector("li.cur")?.scrollIntoView({ block: "nearest" });
  record("path=" + (i + 1) + (at === null ? "" : "." + (at + 1)));
}

// leavePath clears a path's light when another view opens.
function leavePath() {
  if (!pathView) return;
  pathView = null;
  map.setFlow(null);
}

function showTheme(themeId) {
  const t = themeById[themeId];
  leavePath();
  const ids = (t.nodes || []).map(k => idOf[k]).filter(Boolean);
  ensureShown(ids);
  map.select(null);
  map.setFocus({ ids, color: t.color });
  map.showIds(ids);
  setPanel(`
    <span class="back" data-home>← Overview</span>
    <h2><span class="chip" style="background:${t.color}"></span>${esc(t.title)}</h2>
    <div class="prose">${md(t.summary)}</div>
    <h3>Functions &amp; types</h3>
    ${nodeList(t.nodes || [])}
    ${fileList("Files", t.files)}`);
  record("theme=" + themeId);
}

function home({ fly = true } = {}) {
  leavePath();
  map.select(null);
  map.setFocus(null);
  if (fly) map.fit();
  showSummary();
  record("");
}

// selectPackage shows one package: the map flies to it and the panel lists
// what changed in it.
function selectPackage(pkg) {
  leavePath();
  const ns = nodes.filter(n => n.package === pkg && (testsToggle.checked || !n.isTest));
  if (!ns.length) return home();
  map.select(null);
  map.setFocus({ pkg });
  map.showPackage(pkg);
  const list = group => linkList(group.map(n => [n.id, `<span class="name">${badge(n)} ${kindTag(n)} ${esc(n.name)}</span>`]));
  const changed = ns.filter(isChange);
  const users = ns.filter(n => n.status === "caller");
  const starts = ns.filter(n => n.status === "entry");
  const passing = ns.filter(n => n.status === "via");
  const dir = ns[0].file.includes("/") ? ns[0].file.slice(0, ns[0].file.lastIndexOf("/")) : ".";
  const files = Object.keys(STATS).filter(f => (f.includes("/") ? f.slice(0, f.lastIndexOf("/")) : ".") === dir).sort();
  const added = files.reduce((n, f) => n + STATS[f].added, 0), deleted = files.reduce((n, f) => n + STATS[f].deleted, 0);
  setPanel(`
    <span class="back" data-home>← Overview</span>
    <h2>${esc(shortPkg(pkg))}</h2>
    <div class="loc">${esc(pkg)}</div>
    <p>${files.length} changed file${files.length === 1 ? "" : "s"} · <span class="add-count">+${added}</span> <span class="del-count">−${deleted}</span></p>
    ${starts.length ? `<h3>Entry points</h3>${list(starts)}` : ""}
    ${changed.length ? `<h3>Changed here</h3>${list(changed)}` : ""}
    ${users.length ? `<h3>Calls changed code</h3><p class="empty">Code in this package that the PR does not change, but that calls code it changes.</p>${list(users)}` : ""}
    ${passing.length ? `<h3>On a code path</h3><p class="empty">Code the PR does not change that a code path passes through on its way to the changes.</p>${list(passing)}` : ""}
    ${fileList("Files", files)}`);
  record("pkg=" + pkg);
}

// Each view has a URL hash (#path=N, #theme=ID, #node=KEY, #pkg=PATH, or none
// for the overview), so the browser's back and forward buttons move between
// views and a link can open one.
let restoring = false;

function record(view) {
  if (restoring) return;
  const eq = view.indexOf("=");
  const hash = view ? "#" + view.slice(0, eq + 1) + encodeURIComponent(view.slice(eq + 1)) : "";
  if (hash === location.hash) return;
  history.pushState(null, "", hash || location.pathname + location.search);
}

function route() {
  const view = decodeURIComponent(location.hash.slice(1));
  const [kind, value] = [view.slice(0, view.indexOf("=")), view.slice(view.indexOf("=") + 1)];
  restoring = true;
  try {
    if (kind === "theme" && themeById[value]) showTheme(value);
    else if (kind === "node" && idOf[value]) selectNode(idOf[value]);
    else if (kind === "pkg" && nodes.some(n => n.package === value)) selectPackage(value);
    else if (kind === "thread" && comments.threads.some(t => t.id === value)) { goToThread(value); focusThread(value); }
    else if (kind === "def" && DEFS[value]) showDef(value);
    else if (kind === "path" && codePaths[+value.split(".")[0] - 1]) {
      const [i, at] = value.split(".");
      showPath(+i - 1, at ? +at - 1 : null);
    }
    else home();
  } finally {
    restoring = false;
  }
}

window.addEventListener("popstate", route);

function showSummary() {
  const changes = group => linkList(group.filter(isChange).sort((a, b) => !!b.top - !!a.top).map(n => [n.id,
    `<span class="name">${badge(n)} ${kindTag(n)} ${n.top ? `<span class="top" title="No other change calls it: review it first">★</span> ` : ""}${esc(n.name)}</span>` +
    (n.exported ? ` <span class="badge exported">public</span>` : "") +
    (n.isTest ? "" : ` <span class="loc">${n.callers - testUsers(n.id)} code · ${testUsers(n.id)} tests</span>`)]));
  // The top functions (★) are where to start: changed code that no other
  // change calls. The ones that reach the most changes come first.
  const tops = code.filter(n => n.top)
    .map(n => ({ n, reach: changesReached(n.id).filter(id => id !== n.id).length }))
    .sort((a, b) => b.reach - a.reach || a.n.file.localeCompare(b.n.file) || a.n.line - b.n.line);
  const startHere = tops.length ? `<h3><span class="top">★</span> Review first</h3>
    <p class="empty">Changed code that no other change calls. Click one to zoom in to its code.</p>
    ${linkList(tops.map(({ n, reach }) => [n.id, `<span class="name">${badge(n)} ${kindTag(n)} ${esc(n.name)}</span>` +
      ` <span class="loc">${esc(n.file)}:${n.line}${reach ? ` · reaches ${reach} more change${reach === 1 ? "" : "s"}` : ""}</span>`]))}` : "";
  const themes = NOTES.themes.map(t => `<li data-theme="${esc(t.id)}">
      <div><span class="chip" style="background:${t.color}"></span><span class="title">${esc(t.title)}</span>
      <span class="loc">${(t.nodes || []).length === 1 ? "1 function or type" : `${(t.nodes || []).length} functions &amp; types`}</span></div>
      <div class="sum">${md(t.summary.split(/\n\s*\n/)[0])}</div></li>`).join("");

  setPanel(`
    ${NOTES.summary ? `<div class="prose">${md(NOTES.summary)}</div>` : ""}
    ${codePaths.length ? `<h3>Code paths</h3>
    <p class="empty">Chains of calls from where execution starts down into the change, drawn as colored lines on the map. Where lines meet, the paths share code. Pick one to follow it step by step.</p>
    <ul class="links">${codePaths.map(pathRow).join("")}</ul>` : ""}
    ${startHere}
    ${themes ? `<h3>Themes</h3><ul class="links themes">${themes}</ul>` : ""}
    <h3>Changed code</h3>
    ${changes(code)}
    ${tests.some(isChange) ? `<h3>Changed tests</h3>${changes(tests)}` : ""}
    ${fileList("Other changed files", DATA.otherFiles)}
    ${fileList("Deleted files", DATA.deleted)}`);
}

// pathRow is a code path in a list.
const pathRow = p => `<li data-path="${p.id}"><span class="name">${pathChip(p)} ${esc(p.label)}</span>` +
  ` <span class="loc">${p.ids.length} steps · ${p.changes} change${p.changes === 1 ? "" : "s"}</span></li>`;

// ---------- comments ----------

// When `map-pr serve` serves the page, a chat with Claude runs down its left
// side. A message can carry a place on the map: a line, a declaration, a
// package or a point. Each message the reader sends is a thread in
// comments.json, and Claude answers it with `map-pr reply`. Opened as a file,
// the page has no chat.
const comments = { on: false, threads: [], sig: "" };
let commentMode = false;
const commentBtn = document.getElementById("comment-btn");

const threadState = t => t.resolved ? "resolved" : t.messages[t.messages.length - 1].author === "claude" ? "answered" : "open";
const threadsAt = key => comments.threads.filter(t => t.anchor.node === key);
const when = at => new Date(at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
// placed is true for a thread with a place on the map; a plain chat message has none.
const placed = a => !!(a.node || a.package || a.x || a.y);

async function api(path, body) {
  const res = await fetch(path, body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : { cache: "no-store" });
  if (!res.ok) throw new Error((await res.text()).trim() || res.statusText);
  return res.json();
}

// apiAnchor turns the map's anchor (node IDs) into a stored one (node keys,
// which stay the same when the map is built again).
function apiAnchor(a) {
  if (!a) return {};
  if (a.node) return { node: byId[a.node].key, line: a.line || 0 };
  if (a.pkg) return { package: a.pkg };
  return { x: a.x, y: a.y };
}

// anchorShort names an anchor in a few words: a declaration and line, a package, or a point.
const anchorShort = a => a.node ? a.node.split(":").pop() + (a.line ? ":" + a.line : "") : a.package ? "package " + shortPkg(a.package) : "a point on the map";

// lineText is the source of an anchored line, for the chip that shows it.
function lineText(a) {
  const n = a.node && byId[idOf[a.node]];
  if (!n || !a.line) return "";
  return (n.source.split("\n")[a.line - n.line] || "").trim();
}

function chipHTML(a, attrs = "") {
  const code = lineText(a);
  return `<span class="att" ${attrs} title="Go to this place on the map"><span class="where">${esc(anchorShort(a))}</span>` +
    (code ? `<code>${esc(code)}</code>` : "") + `</span>`;
}

function threadList(ts) {
  if (!ts.length) return `<p class="empty">No questions yet.</p>`;
  return `<ul class="links">${ts.map(t => {
    const first = t.messages[0].body;
    return `<li data-thread="${esc(t.id)}"><span class="state ${threadState(t)}">${threadState(t)}</span> ` +
      `${esc(first.length > 90 ? first.slice(0, 89) + "…" : first)}<div class="loc">${esc(anchorShort(t.anchor))} · ${t.messages.length} message${t.messages.length > 1 ? "s" : ""}</div></li>`;
  }).join("")}</ul>`;
}

function setCommentMode(on) {
  commentMode = on;
  map.setCommentMode(on);
  commentBtn.classList.toggle("on", on);
  document.getElementById("stage").classList.toggle("commenting", on);
}

// ---------- chat ----------

const chat = {
  el: document.getElementById("chat"), log: document.getElementById("chat-log"),
  box: document.getElementById("chat-input"), attachEl: document.getElementById("chat-attach"),
  btn: document.getElementById("chat-btn"), toast: document.getElementById("toast"),
  attach: null, seen: null, timer: 0,
};
const seenKey = "map-pr:seen:" + location.pathname;
const pageTitle = document.title;
const answersIn = t => t.messages.filter(m => m.author === "claude").length;
const unread = t => !!chat.seen && answersIn(t) > (chat.seen[t.id] || 0);
// plain is the first line of Markdown text, without its marks.
const plain = text => (text.split("\n").find(l => l.trim()) || "").replace(/[`*]/g, "").trim();
const chatOpen = () => !chat.el.hidden;

// attachTo puts a place on the map on the message being written, and opens
// the chat to write it.
function attachTo(anchor) {
  chat.attach = anchor;
  if (anchor.node) map.select(anchor.node);
  setChat(true);
  renderAttach();
  chat.box.focus();
}

function renderAttach() {
  const a = chat.attach && apiAnchor(chat.attach);
  chat.attachEl.hidden = !a;
  chat.attachEl.innerHTML = a ? chipHTML(a, "data-goto-attach") + `<button class="x" title="Remove">×</button>` : "";
  if (!a) return;
  chat.attachEl.querySelector(".x").onclick = () => { chat.attach = null; renderAttach(); chat.box.focus(); };
  chat.attachEl.querySelector("[data-goto-attach]").onclick = () => goToAnchor(a);
}

async function sendChat() {
  const body = chat.box.value;
  if (!body.trim()) return;
  chat.box.disabled = true;
  try {
    await api("api/threads", { anchor: apiAnchor(chat.attach), body });
    chat.box.value = "";
    chat.attach = null;
    renderAttach();
    await loadThreads(true);
    chat.log.scrollTop = chat.log.scrollHeight;
  } catch (err) {
    chatError(err);
  } finally {
    chat.box.disabled = false;
    chat.box.focus();
  }
}

function chatError(err) {
  const p = chat.el.querySelector(".error");
  p.textContent = String(err.message || err);
  p.hidden = false;
  setTimeout(() => { p.hidden = true; }, 6000);
}

// renderChat draws every message in time order. An answer that does not come
// right after its question quotes it.
function renderChat() {
  const items = comments.threads.flatMap(t => t.messages.map((m, i) => ({ t, m, i })))
    .sort((a, b) => a.m.at.localeCompare(b.m.at));
  const atEnd = chat.log.scrollHeight - chat.log.scrollTop - chat.log.clientHeight < 40;
  let prev = null;
  chat.log.innerHTML = items.length ? items.map(({ t, m, i }) => {
    const claude = m.author === "claude";
    const quote = claude && prev !== t.id ? `<div class="quote" data-jump="${esc(t.id)}">↪ ${esc(plain(t.messages[0].body))}</div>` : "";
    const chip = !claude && i === 0 && placed(t.anchor) ? chipHTML(t.anchor, `data-pin="${esc(t.id)}"`) : "";
    const fresh = claude && unread(t) && i >= t.messages.length - (answersIn(t) - (chat.seen[t.id] || 0)) ? " fresh" : "";
    const waiting = !claude && i === t.messages.length - 1 && threadState(t) === "open" ? `<div class="waiting">Waiting for Claude…</div>` : "";
    prev = t.id;
    return `<div class="msg ${claude ? "claude" : "you"}${fresh}" ${i === 0 ? `data-thread="${esc(t.id)}"` : ""}>
      <div class="who">${claude ? "Claude" : "You"} <span>${when(m.at)}</span></div>${quote}${chip}
      <div class="prose">${md(m.body)}</div>${waiting}</div>`;
  }).join("") : `<p class="empty">Ask Claude about this pull request. Click a line number on the map or in the panel to attach that line to your question.</p>`;
  for (const c of chat.log.querySelectorAll("[data-pin]")) c.onclick = () => goToThread(c.dataset.pin);
  for (const q of chat.log.querySelectorAll("[data-jump]")) q.onclick = () => focusThread(q.dataset.jump);
  if (atEnd) chat.log.scrollTop = chat.log.scrollHeight;
}

// goToAnchor shows a stored anchor on the map.
function goToAnchor(a) {
  const n = a.node && byId[idOf[a.node]];
  if (n) {
    selectNode(n.id, { fly: false });
    map.showCode(n.id, a.line || 0);
  } else if (a.package) selectPackage(a.package);
}

// goToThread takes the map back to the place a message is about.
function goToThread(id) {
  const t = comments.threads.find(t => t.id === id);
  if (!t) return;
  const n = t.anchor.node && byId[idOf[t.anchor.node]];
  if (n) selectNode(n.id, { fly: false });
  else if (t.anchor.package) selectPackage(t.anchor.package);
  map.setActivePin(id);
  map.showPin(id);
  record("thread=" + id);
}

// focusThread scrolls the chat to a question and marks it for a moment.
function focusThread(id) {
  setChat(true);
  const el = chat.log.querySelector(`[data-thread="${CSS.escape(id)}"]`);
  if (!el) return;
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}

function setChat(open) {
  chat.el.hidden = !open;
  chat.btn.classList.toggle("on", open);
  try { localStorage.setItem("map-pr:chat", open ? "open" : "closed"); } catch {}
  map.resize();
  if (open) { hideToast(); renderChat(); markSeen(); }
  refreshBadge();
}

// ---------- read state ----------
// What this viewer has read is kept in the browser as the count of Claude's
// messages seen in each thread. While the chat is open and the tab is shown,
// answers are read when they come.

function loadSeen() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(seenKey)); } catch {}
  chat.seen = saved || Object.fromEntries(comments.threads.map(t => [t.id, answersIn(t)]));
  if (!saved) saveSeen();
}
function saveSeen() {
  try { localStorage.setItem(seenKey, JSON.stringify(chat.seen)); } catch {}
}
function markSeen() {
  if (!chatOpen() || document.hidden) return;
  clearTimeout(chat.timer);
  // The "new" mark stays a moment, so the reader sees which answers came.
  chat.timer = setTimeout(() => {
    for (const t of comments.threads) chat.seen[t.id] = answersIn(t);
    saveSeen();
    for (const m of chat.log.querySelectorAll(".msg.fresh")) m.classList.remove("fresh");
    refreshBadge();
  }, 4000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) markSeen(); });

function refreshBadge() {
  const n = comments.threads.filter(unread).length;
  const badge = chat.btn.querySelector(".badge");
  badge.hidden = !n;
  badge.textContent = n;
  document.title = n ? `(${n}) ${pageTitle}` : pageTitle;
}

function showToast(t, count) {
  chat.toast.innerHTML = `<b>${count > 1 ? `${count} new answers` : "Claude answered"}</b><span>${esc(plain(t.messages[0].body))}</span>`;
  chat.toast.hidden = false;
  clearTimeout(chat.toastTimer);
  chat.toastTimer = setTimeout(hideToast, 12000);
}
function hideToast() { chat.toast.hidden = true; }
chat.toast.onclick = () => { setChat(true); chat.log.scrollTop = chat.log.scrollHeight; };

// refreshComments updates the pins and the chat after the threads change.
function refreshComments() {
  map.setPins(comments.threads.filter(t => placed(t.anchor)).map(t => ({
    id: t.id, node: t.anchor.node ? idOf[t.anchor.node] || "missing" : null, line: t.anchor.line || 0,
    pkg: t.anchor.package || null, x: t.anchor.x || 0, y: t.anchor.y || 0,
    state: threadState(t), count: t.messages.length,
  })));
  if (chatOpen()) renderChat();
  for (const q of panel.querySelectorAll(".questions")) {
    q.innerHTML = threadList(threadsAt(q.dataset.for));
    for (const li of q.querySelectorAll("li[data-thread]")) li.onclick = () => focusThread(li.dataset.thread);
  }
  refreshBadge();
}

async function loadThreads(force = false) {
  const ts = await api("api/threads");
  const sig = JSON.stringify(ts);
  if (!force && sig === comments.sig) return;
  const before = new Map(comments.threads.map(t => [t.id, answersIn(t)]));
  comments.sig = sig;
  comments.threads = ts;
  if (!chat.seen) loadSeen();
  refreshComments();
  // A hidden tab does not poll, so a thread can come with its question and
  // answer at once.
  const fresh = ts.filter(t => answersIn(t) > (before.get(t.id) ?? 0) && unread(t));
  if (fresh.length && !chatOpen()) showToast(fresh[fresh.length - 1], fresh.length);
  if (fresh.length) markSeen();
}

chat.btn.onclick = () => setChat(!chatOpen());
document.getElementById("chat-close").onclick = () => setChat(false);
chat.box.onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); }
  if (e.key === "Escape") chat.box.blur();
};

async function startComments() {
  if (!location.protocol.startsWith("http")) return;
  try {
    await loadThreads(true);
  } catch {
    return; // a plain file server: no comments API
  }
  comments.on = true;
  map.setCanAsk(true);
  commentBtn.hidden = false;
  commentBtn.onclick = () => setCommentMode(!commentMode);
  chat.btn.hidden = false;
  let saved = null;
  try { saved = localStorage.getItem("map-pr:chat"); } catch {}
  setChat(saved !== "closed");
  route(); // show the comment parts of the current view, or open a #thread= link
  setInterval(() => { if (!document.hidden) loadThreads().catch(() => {}); }, 2500);
}

// ---------- controls ----------

document.addEventListener("keydown", evt => {
  if (evt.target.closest("input, textarea") || evt.metaKey || evt.ctrlKey) return;
  if (pathView) {
    const { i, at } = pathView, last = codePaths[i].ids.length - 1;
    const go = d => { evt.preventDefault(); showPath(i, at === null ? (d > 0 ? 0 : null) : at + d < 0 ? null : Math.min(at + d, last)); };
    if (evt.key === "ArrowRight" || evt.key === "j") return go(1);
    if (evt.key === "ArrowLeft" || evt.key === "k") return go(-1);
  }
  if (evt.key === "Escape") { if (commentMode) setCommentMode(false); else home(); }
  if ((evt.key === "c" || evt.key === "C") && comments.on) setCommentMode(!commentMode);
  if (evt.key === "/" && comments.on) { evt.preventDefault(); setChat(true); chat.box.focus(); }
  if (evt.key === "+" || evt.key === "=") map.zoomBy(1.6);
  if (evt.key === "-") map.zoomBy(1 / 1.6);
  if (evt.key === "0") map.fit();
});

for (const b of document.querySelectorAll("[data-level]")) b.onclick = () => map.goLevel(b.dataset.level);
document.querySelector("[data-zoom=in]").onclick = () => map.zoomBy(1.6);
document.querySelector("[data-zoom=out]").onclick = () => map.zoomBy(1 / 1.6);
document.querySelector("[data-zoom=fit]").onclick = () => map.fit();

testsToggle.onchange = () => {
  map.setData(mapData(), true);
  map.fit();
};

// splitter makes a bar resize the column next to it as it is dragged. width
// turns the pointer's x into the column's width.
function splitter(bar, col, width, key) {
  try { const w = localStorage.getItem(key); if (w) col.style.width = w; } catch {}
  bar.addEventListener("pointerdown", evt => {
    bar.setPointerCapture(evt.pointerId);
    bar.classList.add("dragging");
    const move = e => { col.style.width = width(e.clientX) + "px"; };
    const up = () => {
      bar.classList.remove("dragging");
      bar.removeEventListener("pointermove", move);
      bar.removeEventListener("pointerup", up);
      try { localStorage.setItem(key, col.style.width); } catch {}
    };
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
  });
}
splitter(document.getElementById("split"), panel,
  x => Math.max(320, Math.min(window.innerWidth - 200, window.innerWidth - x)), "map-pr:panel-width");
// The chat leaves the map at least 300px beside the side panel.
splitter(document.getElementById("chat-split"), chat.el,
  x => Math.max(240, Math.min(window.innerWidth - panel.offsetWidth - 300, x)), "map-pr:chat-width");

if (!nodes.length) {
  document.getElementById("stage").insertAdjacentHTML("beforeend",
    `<p class="empty" style="position:absolute;inset:24px">This PR changes no Go or TypeScript functions or types. The side panel lists the files it changes.</p>`);
}
map.setData(mapData());
map.fit(false);
route();
// On the overview, the code paths draw themselves one at a time.
if (!location.hash.slice(1)) map.playPaths();
startComments();
</script>
</body>
</html>
